name: TEMP Residual 9 Detailed Audit
on:
  push:
    branches: [diagnostic/residual-9-detailed-audit-20260920]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - run: python3 scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/report.json
      - name: Exact residual evidence
        run: |
          python3 - <<'PY'
          import importlib.util,json
          from pathlib import Path
          ids=["mep-028","ex5-98","svp-225","sv08.5-176","sv08.5-177","sv08.5-178","sv08.5-179","sv08.5-180","sv09-190"]
          spec=importlib.util.spec_from_file_location("v","scripts/test_variant_finish_audit.py")
          v=importlib.util.module_from_spec(spec); spec.loader.exec_module(v)
          cards,errs,sha=v.load_official_database(Path("tcgdex-cards-database"))
          by={c["id"]:c for c in cards}
          report=json.load(open("artifacts/report.json"))
          issues={x["tcgdexId"]:x for x in report["issuesByPriority"]}
          out={}
          for cid in ids:
            c=by[cid]
            rows=[]
            for q in c.get("variants_detailed") or []:
              rows.append({
                "type":q.get("type"),"canonicalType":v.canonical_finish_type_label(q.get("type")),
                "foil":q.get("foil"),"canonicalFoil":v.canonical_finish_foil_label(q.get("foil")),
                "stamp":q.get("stamp"),"size":q.get("size"),"subtype":q.get("subtype"),
                "canonicalRowFinish":v.canonical_row_finish(q)
              })
            out[cid]={
              "name":c.get("name"),"set":c.get("set"),"localId":c.get("localId"),
              "variants":c.get("variants"),"variants_detailed":rows,
              "rarity":c.get("rarity"),"category":c.get("category"),
              "thirdParty":c.get("thirdParty"),
              "auditIssue":issues.get(cid)
            }
          print(json.dumps({"dbSha":sha,"summary":report["summary"],"cases":out},ensure_ascii=False,indent=2))
          PY
