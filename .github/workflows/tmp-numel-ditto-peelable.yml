name: Temporary guarded Numel Ditto patch

on:
  push:
    branches:
      - fix/numel-ditto-peelable

permissions:
  contents: write

jobs:
  patch-test-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard base and temporary-only staging
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fad2ab3204948ca4e802fd69f0f38e7bc07e4195 HEAD
          changed="$(git diff --name-only fad2ab3204948ca4e802fd69f0f38e7bc07e4195...HEAD | sort)"
          expected="$(printf '%s\n' .github/workflows/tmp-numel-ditto-peelable.yml scripts/tmp_apply_numel_ditto_patch.py | sort)"
          test "$changed" = "$expected"
          sha256sum data/retail_prices.json data/cardmarket_play_index.json > /tmp/cardoryx-protected.before

      - name: Repair temporary runner quoting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/tmp_apply_numel_ditto_patch.py')
          s=p.read_text(encoding='utf-8')
          a="runtime_helper = r'''"
          b="\n'''\nmarker = \"\\ndef stratified"
          if s.count(a)!=1 or s.count(b)!=1:
              raise SystemExit('Temporary runner delimiter guard failed')
          s=s.replace(a, 'runtime_helper = r"""', 1)
          s=s.replace(b, '\n"""\nmarker = "\\ndef stratified', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile scripts/tmp_apply_numel_ditto_patch.py

      - name: Apply exact guarded patch
        run: python scripts/tmp_apply_numel_ditto_patch.py

      - name: Fix generated production-function extractor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_variant_finish_audit.py')
          s=p.read_text(encoding='utf-8')
          old='''    brace = source.find("{", marker.end())\n    if brace < 0:\n        raise AssertionError(f"Missing body for production function {name}")\n'''
          new='''    header = re.search(r"\\)\\s*\\{", source[marker.start():])\n    if not header:\n        raise AssertionError(f"Missing body for production function {name}")\n    brace = marker.start() + header.end() - 1\n'''
          if s.count(old)!=1:
              raise SystemExit('Production-function extractor guard failed')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY

      - name: Add focused Numel Ditto mode to existing audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_variant_finish_audit.py')
          s=p.read_text(encoding='utf-8')
          old='''    ap.add_argument("--baseline-report", help="Previous report used for deterministic before/after metrics")\n    args = ap.parse_args()\n'''
          new='''    ap.add_argument("--baseline-report", help="Previous report used for deterministic before/after metrics")\n    ap.add_argument("--numel-ditto-only", action="store_true",\n                    help="Run the production-JS Numel Ditto P0 checks plus the binding 39-card regression set only")\n    args = ap.parse_args()\n'''
          if s.count(old)!=1:
              raise SystemExit('Focused-mode argparse guard failed')
          s=s.replace(old,new,1)
          old='''    play_index = json.loads(PLAY_INDEX.read_text())\n\n    set_specs = dict(SAMPLED_SETS); set_specs.update(FULL_SETS)\n'''
          new='''    play_index = json.loads(PLAY_INDEX.read_text())\n\n    if args.numel_ditto_only:\n        real_world_regression = real_world_regression_audit(registries, play_index, set(), args.workers)\n        report = {\n            "audit": "Numel Ditto peelable focused production regression",\n            "baseProductionRuntime": ditto_runtime,\n            "realWorldRegression": real_world_regression,\n            "safety": {\n                "readOnlyAudit": True, "retailModified": False, "cardmarketDataModified": False,\n                "scannerModified": False, "storageSchemaModified": False, "deckModified": False,\n            },\n        }\n        output = ROOT / args.output\n        output.parent.mkdir(parents=True, exist_ok=True)\n        output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\\n")\n        print(json.dumps({\n            "output": str(output), "dittoRuntime": ditto_runtime,\n            "realWorldRegression": {k: real_world_regression[k] for k in (\n                "bindingDatasetSize", "recordsRecovered", "classificationBreakdown",\n                "finishMatrixMatchesExpectation", "finishMatrixAnomalies", "fullyResolvedCases",\n                "pipelineDataLossCases")},\n        }, ensure_ascii=False, indent=2))\n        return\n\n    set_specs = dict(SAMPLED_SETS); set_specs.update(FULL_SETS)\n'''
          if s.count(old)!=1:
              raise SystemExit('Focused-mode insertion guard failed')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
          python -m py_compile scripts/test_variant_finish_audit.py

      - name: Run production JS and binding 39-card finish regression
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_variant_finish_audit.py --numel-ditto-only --output /tmp/variant_finish_audit_report.json --workers 20
          python -c "import json; r=json.load(open('/tmp/variant_finish_audit_report.json',encoding='utf-8')); d=r.get('baseProductionRuntime') or {}; rw=r['realWorldRegression']; by={x['tcgdexId']:x for x in rw['records']}; assert d.get('persistedVariant')=='Ditto Peelable'; assert d.get('dittoPrice')=='needs-exact-variant'; assert d.get('dittoMarketplace') is None; assert d.get('standardReverseProduct')==665657; assert rw['bindingDatasetSize']==39 and rw['recordsRecovered']==39 and rw['finishMatrixAnomalies']==0 and not rw['pipelineDataLossCases']; assert set(by['swsh10.5-013']['scannerSelectableFinishes'])=={'Normal','Reverse Holo','Ditto Peelable'}; assert all('Ditto Peelable' not in by[c]['scannerSelectableFinishes'] for c in ('swsh10.5-009','swsh10.5-019','swsh10.5-066','swsh10.5-068')); print(json.dumps({'dittoRuntime':d,'numel':by['swsh10.5-013']['scannerSelectableFinishes'],'regressions':'PASS'},ensure_ascii=False,indent=2))"

      - name: Verify protected separation and final diff
        shell: bash
        run: |
          set -euo pipefail
          sha256sum data/retail_prices.json data/cardmarket_play_index.json > /tmp/cardoryx-protected.after
          diff -u /tmp/cardoryx-protected.before /tmp/cardoryx-protected.after
          git diff --check
          git diff --exit-code -- data/retail_prices.json data/cardmarket_play_index.json sw.js manifest.webmanifest
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html scripts/test_variant_finish_audit.py scripts/tmp_apply_numel_ditto_patch.py | sort)"
          test "$changed" = "$expected"

      - name: Commit only production and existing test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cardoryx-audit-bot"
          git config user.email "cardoryx-audit-bot@users.noreply.github.com"
          git add index.html scripts/test_variant_finish_audit.py
          git checkout -- scripts/tmp_apply_numel_ditto_patch.py
          git rm .github/workflows/tmp-numel-ditto-peelable.yml scripts/tmp_apply_numel_ditto_patch.py
          git commit -m "Fix peelable Ditto finish identity"
          git push origin HEAD:fix/numel-ditto-peelable

      - name: Upload read-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: numel-ditto-variant-finish-audit
          path: /tmp/variant_finish_audit_report.json
          if-no-files-found: error
          retention-days: 14
