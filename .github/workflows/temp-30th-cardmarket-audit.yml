name: TEMP 30th Cardmarket read-only audit

on:
  push:
    branches:
      - diagnostic/30th-cardmarket-price-audit-20260917

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Validate 30th standard Cardmarket products
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, re
          from pathlib import Path
          PU='https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json'
          GU='https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json'
          with urllib.request.urlopen(PU,timeout=60) as r: products=json.load(r)['products']
          with urllib.request.urlopen(GU,timeout=60) as r: guide=json.load(r)['priceGuides']
          cm=sorted([x for x in products if x.get('idExpansion')==6601], key=lambda x:int(x['idProduct']))
          print('CM6601_COUNT',len(cm),'FIRST',cm[0] if cm else None,'LAST',cm[-1] if cm else None)
          pby={int(x['idProduct']):x for x in guide}
          root=Path('../tcgdex-cards-database/data/Mega Evolution/30th Celebration')
          tcg=[]
          for n in range(1,129):
              p=root/f'{n:03d}.ts'
              src=p.read_text(encoding='utf-8')
              m=re.search(r'en:\s*["\']([^"\']+)["\']',src)
              name=m.group(1) if m else ''
              tcg.append((n,name))
          def base_name(s):
              return re.sub(r'\s*\[.*$','',str(s)).strip().lower().replace('’',"'")
          mismatches=[]; rows=[]
          for i,(num,tname) in enumerate(tcg):
              x=cm[i] if i<len(cm) else None
              if not x:
                  mismatches.append((num,tname,'MISSING'))
                  continue
              cname=base_name(x.get('name'))
              tn=base_name(tname)
              if cname!=tn: mismatches.append((num,tname,x.get('idProduct'),x.get('name')))
              g=pby.get(int(x['idProduct']),{})
              rows.append({'num':num,'tcg':tname,'pid':x['idProduct'],'cm':x.get('name'),'trend':g.get('trend'),'avg':g.get('avg'),'low':g.get('low')})
          print('MISMATCH_COUNT',len(mismatches))
          for m in mismatches[:50]: print('MISMATCH',m)
          real=[r for r in rows if isinstance(r.get('trend'),(int,float)) and r['trend']>0]
          print('FIRST128_REAL_TREND',len(real),'NO_TREND',128-len(real))
          for r in rows: print('ROW',json.dumps(r,ensure_ascii=False))
          # Verify the apparent contiguous product sequence explicitly, but do not turn it into a production formula.
          seq=[int(r['pid']) for r in rows]
          print('CONTIGUOUS',all(seq[i]==seq[0]+i for i in range(len(seq))),'START',seq[0] if seq else None,'END',seq[-1] if seq else None)
          PY
