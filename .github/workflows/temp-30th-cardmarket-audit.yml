name: TEMP 30th Cardmarket read-only audit

on:
  push:
    branches:
      - diagnostic/30th-cardmarket-price-audit-20260917

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect live 30th TCGdex cards
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          ids=['30th-001','30th-002','30th-010','30th-050','30th-100','30th-128']
          for cid in ids:
              try:
                  with urllib.request.urlopen('https://api.tcgdex.net/v2/en/cards/'+cid, timeout=20) as r:
                      d=json.load(r)
                  print('===',cid,'===')
                  print(json.dumps({
                    'id':d.get('id'),'name':d.get('name'),'localId':d.get('localId'),
                    'set':d.get('set'),'variants':d.get('variants'),'variants_detailed':d.get('variants_detailed'),
                    'pricing':d.get('pricing')
                  },ensure_ascii=False))
              except Exception as e:
                  print('===',cid,'ERROR===',repr(e))
          PY
      - name: Inspect live 30th Classic sample
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          for cid in ['30th-c-001','30th-c-1']:
              try:
                  with urllib.request.urlopen('https://api.tcgdex.net/v2/en/cards/'+cid, timeout=20) as r:
                      d=json.load(r)
                  print('===',cid,'===')
                  print(json.dumps({'id':d.get('id'),'name':d.get('name'),'localId':d.get('localId'),'set':d.get('set'),'variants':d.get('variants'),'variants_detailed':d.get('variants_detailed'),'pricing':d.get('pricing')},ensure_ascii=False))
              except Exception as e:
                  print('===',cid,'ERROR===',repr(e))
          PY
