name: TEMP Verify MEP Ambiguity Classification

on:
  push:
    branches:
      - audit/classify-verified-mep-stamps-20260920

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cardoryx
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout TCGdex cards database
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1

      - name: Run full Variant & Finish audit
        run: |
          python3 scripts/test_variant_finish_audit.py \
            --tcgdex-db tcgdex-cards-database \
            --output artifacts/variant_finish_audit_report.json

      - name: Enforce expected MEP-only impact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/variant_finish_audit_report.json").read_text())
          c=r["summary"]["classifications"]
          mep=r["mepGenericAmbiguityClassification"]
          assert r["summary"]["totalIdentitiesTested"] == 4254, r["summary"]
          assert c["CORRETTA"] == 3920, c
          assert c["AMBIGUA"] == 326, c
          assert c["FALSO POSITIVO"] == 0, c
          assert c["FALSO NEGATIVO"] == 0, c
          assert c["SOURCE CONFLICT"] == 8, c
          assert r["summary"]["pricingP0"] == 0, r["summary"]
          assert len(mep["classifiedCorrectIds"]) == 19, mep
          assert "mep-028" not in mep["classifiedCorrectIds"], mep
          assert mep["productionModified"] is False, mep
          print(json.dumps({"summary":r["summary"],"mep":mep},ensure_ascii=False,indent=2))
          PY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mep-ambiguity-classification-audit
          path: artifacts/variant_finish_audit_report.json
