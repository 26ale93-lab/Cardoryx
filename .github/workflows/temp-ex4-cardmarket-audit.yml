name: Temporary EX4 Cardmarket Identity Audit

on:
  push:
    branches:
      - diagnostic/ex4-cardmarket-identity-audit-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit EX4 against official Cardmarket catalogue
        run: |
          git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
          python -B - <<'PY'
          import json,re,unicodedata,urllib.request,importlib.util
          from pathlib import Path

          ROOT=Path.cwd()
          db=Path("${{ runner.temp }}")/'tcgdex-cards-database'
          spec=importlib.util.spec_from_file_location('vf',ROOT/'scripts/test_variant_finish_audit.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          cards,parse_errors,snapshot=mod.load_official_database(db)
          ex4=[c for c in cards if str((c.get('set') or {}).get('id') or '').lower()=='ex4']

          def download(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Cardoryx-EX4-Audit/1.1'})
              with urllib.request.urlopen(req,timeout=300) as r: return json.load(r)
          products=download('https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json').get('products',[])
          price_root=download('https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json')
          prices=price_root.get('priceGuides',price_root.get('priceGuide',[]))
          price={int(p['idProduct']):p for p in prices if p.get('idProduct') is not None}
          cm=[p for p in products if int(p.get('idExpansion') or 0)==1542]
          byid={int(p['idProduct']):p for p in products}

          def norm(x):
              s=unicodedata.normalize('NFKD',str(x or '')).encode('ascii','ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+','',s)
          def cmids(card):
              out=[]
              for row in card.get('variants_detailed') or []:
                  try: pid=int(((row.get('thirdParty') or {}).get('cardmarket')))
                  except Exception: continue
                  if pid not in out: out.append(pid)
              return out
          def compact(pid):
              p=price.get(pid) or {}
              return {k:p.get(k) for k in ('idProduct','trend','avg7','avg30','avg','low','trend-holo','avg7-holo','avg30-holo','avg-holo','low-holo') if k in p}

          rows=[]
          for c in sorted(ex4,key=lambda x:int(re.sub(r'\D','',str(x.get('localId') or '999')) or 999)):
              raw_name=c.get('name') or ''
              name=str(raw_name.get('en') or next(iter(raw_name.values()),'') if isinstance(raw_name,dict) else raw_name)
              matches=[p for p in cm if norm(name)==norm(str(p.get('name') or '').split(' [',1)[0])]
              current=cmids(c)
              exact=int(matches[0]['idProduct']) if len(matches)==1 else None
              current_primary=next((pid for pid in current if (byid.get(pid) or {}).get('idExpansion')!=1542), current[0] if current else None)
              current_trend=(price.get(current_primary) or {}).get('trend') if current_primary else None
              exact_trend=(price.get(exact) or {}).get('trend') if exact else None
              delta=(exact_trend-current_trend) if isinstance(current_trend,(int,float)) and isinstance(exact_trend,(int,float)) else None
              rows.append({
                  'tcgdexId':c.get('id'), 'localId':c.get('localId'), 'name':name,'rarity':c.get('rarity'),
                  'currentProductIds':current,'currentPrimaryProductId':current_primary,
                  'currentCatalogue':[byid.get(pid) for pid in current if pid in byid],
                  'exactNameExpansion1542Matches':matches,
                  'uniqueExactMatch': len(matches)==1,'exactProductId':exact,
                  'currentPriceGuide':compact(current_primary) if current_primary else None,
                  'exactPriceGuide':compact(exact) if exact else None,
                  'trendDelta':delta,
              })

          ranked=sorted([r for r in rows if r['uniqueExactMatch'] and isinstance(r['trendDelta'],(int,float))],key=lambda r:abs(r['trendDelta']),reverse=True)
          out={
              'setId':'ex4','expectedExpansionId':1542,'snapshot':snapshot,'parseErrors':len(parse_errors),
              'cards':len(ex4),'catalogueProducts1542':len(cm),'uniqueExactMatches':sum(r['uniqueExactMatch'] for r in rows),
              'currentIdsOutside1542':sum(any((byid.get(pid) or {}).get('idExpansion')!=1542 for pid in r['currentProductIds']) for r in rows),
              'topUniqueByTrendDelta':ranked[:20],'rows':rows,
          }
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/ex4_cardmarket_identity_audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k not in {'rows','topUniqueByTrendDelta'}},ensure_ascii=False,indent=2))
          print('TOP_UNIQUE_BY_TREND_DELTA')
          for r in ranked[:20]: print(json.dumps(r,ensure_ascii=False))
          PY
      - name: Verify production untouched
        run: |
          git diff --check
          git diff --exit-code HEAD -- index.html scripts/test_card_identity_cardmarket_audit.py data/retail_prices.json data/cardmarket_play_index.json sw.js manifest.webmanifest
      - uses: actions/upload-artifact@v4
        with:
          name: ex4-cardmarket-identity-audit
          path: artifacts/ex4_cardmarket_identity_audit.json
          if-no-files-found: error
