name: TEMP Residual Finish Baseline

on:
  push:
    branches:
      - audit/residual-finishes-20260922

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Run deterministic variant finish audit
        run: python scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/variant_finish_audit_report.json --workers 28
      - name: Print baseline
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/variant_finish_audit_report.json"))
          print("BASELINE",json.dumps(r["summary"],sort_keys=True))
          print("AMBIG_SET",json.dumps(r.get("ambiguousBySet") or {},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: residual-finish-baseline
          path: artifacts/variant_finish_audit_report.json
          if-no-files-found: error
