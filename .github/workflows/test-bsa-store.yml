name: Test BSA Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bsa-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Audit prezzi BSA Store
        run: python scripts/test_bsa_store.py
      - name: Carica report diagnostico
        uses: actions/upload-artifact@v4
        with:
          name: bsa-store-test-report
          path: bsa_store_test_report.json
