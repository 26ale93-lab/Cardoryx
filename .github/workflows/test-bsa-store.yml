name: Test BSA Store V2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-bsa-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Simula esclusione cluster BSA anomalo
        run: python scripts/test_bsa_store.py
      - uses: actions/upload-artifact@v4
        with:
          name: bsa-store-v2-report
          path: bsa_store_v2_report.json
