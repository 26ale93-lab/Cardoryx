name: Test BSA Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bsa-store:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test collegamento BSA Store
        run: python scripts/test_bsa_store.py
