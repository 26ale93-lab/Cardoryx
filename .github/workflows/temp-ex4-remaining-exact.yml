name: Temporary EX4 Remaining Exact Validation

on:
  push:
    branches:
      - fix/ex4-remaining-exact-cardmarket-identities

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.event.head_commit.message != 'Fix remaining exact EX4 Cardmarket identities'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Baseline full Cardmarket identity audit
        run: |
          python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
          cp artifacts/card_identity_cardmarket_audit_report.json "$RUNNER_TEMP/baseline_identity_report.json"
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
      - name: Apply only 30 independently verified EX4 identities
        run: |
          python -B -m py_compile scripts/temp_apply_ex4_remaining_exact.py
          rm -rf scripts/__pycache__
          python -B scripts/temp_apply_ex4_remaining_exact.py
          python -B -m py_compile scripts/test_card_identity_cardmarket_audit.py
          rm -rf scripts/__pycache__
      - name: Focused runtime regression
        run: python -B scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Post-patch full identity audit
        run: |
          python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
          cp artifacts/card_identity_cardmarket_audit_report.json "$RUNNER_TEMP/post_identity_report.json"
      - name: Require exact improvement with no P0 regression
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base=json.loads(Path(os.environ['RUNNER_TEMP'],'baseline_identity_report.json').read_text())
          post=json.loads(Path(os.environ['RUNNER_TEMP'],'post_identity_report.json').read_text())
          b=base['classificationTotals']; p=post['classificationTotals']
          assert b['P0_WRONG_PRODUCT']==0, b
          assert p['P0_WRONG_PRODUCT']==0, p
          assert b['P1_AMBIGUOUS_PRODUCT']-p['P1_AMBIGUOUS_PRODUCT']==30, (b,p)
          assert p['SAFE']-b['SAFE']==30, (b,p)
          assert p['EXACT_ALTERNATE_PRODUCT']==b['EXACT_ALTERNATE_PRODUCT'], (b,p)
          assert p['SOURCE_CONFLICT']==b['SOURCE_CONFLICT'], (b,p)
          print('P1',b['P1_AMBIGUOUS_PRODUCT'],'->',p['P1_AMBIGUOUS_PRODUCT'])
          print('SAFE',b['SAFE'],'->',p['SAFE'])
          print('P0',p['P0_WRONG_PRODUCT'])
          PY
      - name: Verify scope and protected files
        run: |
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git diff --check
          git diff --exit-code HEAD -- data/retail_prices.json data/cardmarket_play_index.json sw.js manifest.webmanifest
          test "$(git diff --name-only HEAD | sort | tr '\n' ' ')" = "index.html scripts/test_card_identity_cardmarket_audit.py "
      - name: Commit validated production patch
        run: |
          git config user.name "26ale93-lab"
          git config user.email "26ale93@gmail.com"
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m "Fix remaining exact EX4 Cardmarket identities"
          git push origin HEAD:fix/ex4-remaining-exact-cardmarket-identities
