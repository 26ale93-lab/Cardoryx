name: TEMP Post153 Retail Builder Simulation

on:
  push:
    branches:
      - audit/market-sources-post153-20260923
    paths:
      - .github/workflows/temp-post153-retail-builder-simulation.yml

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot production retail hash
        run: sha256sum data/retail_prices.json | tee /tmp/retail-before.sha
      - name: Simulate current retail builder
        run: python scripts/build_retail_index.py
      - name: Report simulated index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/retail_prices.json").read_text(encoding="utf-8"))
          print("SIMULATED_STATS", json.dumps(d.get("stats",{}),ensure_ascii=False))
          print("SIMULATED_RULES", json.dumps(d.get("rules",{}),ensure_ascii=False))
          for s in d.get("sources",[]):
              print("SOURCE", json.dumps(s,ensure_ascii=False))
          assert d.get("rules",{}).get("cardmarketExcluded") is True
          assert d.get("schema")==2
          assert d.get("rules",{}).get("referenceModel")=="each-verified-store-is-an-independent-reference"
          assert d.get("rules",{}).get("sourceFailurePolicy")=="exclude-failed-source-continue-valid-independent-sources"
          PY
      - name: Confirm simulation only
        run: |
          git status --short
          test -n "$(git status --short data/retail_prices.json)" || (echo "Expected workspace-only retail simulation change" && exit 1)
          echo "NO_COMMIT_NO_PUSH"
