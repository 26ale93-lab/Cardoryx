name: TEMP MEE 009-016 30th Finish Audit

on:
  push:
    branches:
      - audit/mee-009-016-30th-finishes-20260922

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MEE 009-016 production regression
        run: python scripts/test_mee_009_016_30th_finishes.py
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Full deterministic variant finish audit
        run: python scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/variant_finish_audit_report.json --workers 28
      - name: Verify final gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/variant_finish_audit_report.json"))
          s=r["summary"]; c=s["classifications"]
          expected={"CORRETTA":4254,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":0,"SOURCE CONFLICT":0}
          assert s["totalIdentitiesTested"]==4254,s
          assert c==expected,c
          assert s["pricingP0"]==0,s
          assert s["unavailableExplicitTargets"]==[f"mee-{n:03d}" for n in range(9,17)],s
          e=r["energyAudit"]["mee009To016ExternallyVerified"]
          assert len(e["identities"])==8,e
          assert e["finish"]=="Holo",e
          assert e["stamp"]=="30° Anniversario",e
          assert e["priceInferredFromFinishEvidence"] is False,e
          assert e["upstreamGapOnly"] is True,e
          print("GATES_OK",json.dumps(s,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mee-009-016-30th-finish-audit
          path: artifacts/variant_finish_audit_report.json
          if-no-files-found: error
