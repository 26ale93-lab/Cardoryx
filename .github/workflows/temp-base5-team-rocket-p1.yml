name: TEMP base5 Team Rocket exact page mapping
on:
  push:
    branches: [diagnostic/base5-team-rocket-p1-20260918]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Team Rocket numbered mappings
        run: |
          python3 - <<'PY'
          import urllib.request
          headers={'User-Agent':'Mozilla/5.0 Cardoryx-Identity-Audit/2.0'}
          pairs=[
            ('dark-alakazam',1,18,274054,274071),
            ('dark-arbok',2,19,274055,274072),
            ('dark-blastoise',3,20,274056,274073),
            ('dark-charizard',4,21,274057,274074),
            ('dark-dragonite',5,22,274058,274075),
            ('dark-dugtrio',6,23,274059,274076),
            ('dark-golbat',7,24,274060,274077),
            ('dark-gyarados',8,25,274061,274078),
            ('dark-hypno',9,26,274062,274079),
            ('dark-machamp',10,27,274063,274080),
            ('dark-magneton',11,28,274064,274081),
            ('dark-slowbro',12,29,274065,274082),
            ('dark-vileplume',13,30,274066,274083),
            ('dark-weezing',14,31,274067,274084),
            ('here-comes-team-rocket',15,71,274068,274124),
            ('rockets-sneak-attack',16,72,274069,274125),
            ('rainbow-energy',17,80,274070,274133),
          ]
          bad=[]
          for slug,a,b,p1,p2 in pairs:
              for num,expected,cands in ((a,p1,(p1,p2)),(b,p2,(p1,p2))):
                  urls=[
                    f'https://www.tcggo.com/pokemon/team-rocket/{slug}-{num}',
                    f'https://www.tcggo.com/pokemon/team-rocket/{slug}-{num}-1',
                  ]
                  hits=[]; okurl=None; errors=[]
                  for u in urls:
                      try:
                          with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=30) as r:
                              t=r.read().decode('utf-8','ignore')
                          hh=[p for p in cands if str(p) in t]
                          if hh:
                              hits=hh;okurl=u;break
                      except Exception as e: errors.append(repr(e))
                  ok=expected in hits and len(hits)==1
                  print('MAP',slug,num,'EXPECTED',expected,'HITS',hits,'URL',okurl,'OK' if ok else 'BAD')
                  if not ok: bad.append((slug,num,expected,hits,errors))
          print('BAD_COUNT',len(bad))
          if bad: print('BAD',bad)
          PY
