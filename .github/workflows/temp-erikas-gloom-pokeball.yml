name: TEMP Erika Gloom Pokeball

on:
  push:
    branches:
      - fix/erikas-gloom-italian-runtime-20260918
  workflow_dispatch:

jobs:
  exact-italian-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff check
        run: |
          git fetch origin main --depth=1
          git diff --check origin/main...HEAD
      - name: Exact Italian runtime regression
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          spec=importlib.util.spec_from_file_location('cardoryx_audit',p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          result=mod.runtime_cardmarket_regression()
          erika=result.get('erikasGloom') or {}
          assert erika.get('productId') == 870138, erika
          assert erika.get('value') == 0.13, erika
          print(erika)
          PY
