name: TEMP Verify Unanimous Special Finishes

on:
  push:
    branches:
      - audit/classify-unanimous-special-finish-rows-20260920

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cardoryx
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout TCGdex cards database
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Run full audit
        run: |
          python3 scripts/test_variant_finish_audit.py \
            --tcgdex-db tcgdex-cards-database \
            --output artifacts/variant_finish_audit_report.json
      - name: Enforce exact impact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/variant_finish_audit_report.json").read_text())
          c=r["summary"]["classifications"]
          x=r["unanimousSpecialFinishClassification"]
          issues={i["tcgdexId"]:i for i in r.get("issuesByPriority",[])}
          assert r["summary"]["totalIdentitiesTested"] == 4254, r["summary"]
          assert c["CORRETTA"] == 4071, c
          assert c["AMBIGUA"] == 175, c
          assert c["FALSO POSITIVO"] == 0, c
          assert c["FALSO NEGATIVO"] == 0, c
          assert c["SOURCE CONFLICT"] == 8, c
          assert r["summary"]["pricingP0"] == 0, r["summary"]
          assert len(x["bySet"]["mfb"]) == 28, x
          assert len(x["bySet"]["swshp"]) == 48, x
          assert len(x["bySet"]["svp"]) == 44, x
          assert len(x["classifiedIds"]) == 120, x
          assert "svp-225" not in x["classifiedIds"], x
          assert issues["svp-225"]["classification"] == "AMBIGUA", issues["svp-225"]
          assert all(cid in x["classifiedIds"] for cid in ("mfb-33","mfb-34","svp-101")), x
          assert x["productionModified"] is False, x
          print(json.dumps({"summary":r["summary"],"unanimous":x},ensure_ascii=False,indent=2))
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: unanimous-special-finish-audit
          path: artifacts/variant_finish_audit_report.json
