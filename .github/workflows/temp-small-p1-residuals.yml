name: TEMP archived residual P1 audit
on:
  push:
    branches: [diagnostic/small-p1-residuals-20260918]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone official TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Inspect archived pl3 and McDonalds 2018 identities
        run: |
          python3 - <<'PY'
          import json,importlib.util,urllib.request,tempfile,pathlib,collections
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('vfa','scripts/test_variant_finish_audit.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          cards,errors,sha=mod.load_official_database(Path('../tcgdex-cards-database'))
          ids=['pl3-AR1','pl3-AR2','pl3-AR3','pl3-AR4','pl3-AR5','pl3-AR6','pl3-AR7','pl3-AR8','pl3-AR9','2018sm-fr-38','2018sm-fr-39']
          byid={c.get('id'):c for c in cards}
          wanted=set()
          for cid in ids:
              c=byid.get(cid)
              if not c:
                  print('MISSING',cid);continue
              rows=[]
              for x in c.get('variants_detailed') or []:
                  pid=((x.get('thirdParty') or {}).get('cardmarket'))
                  cm=((x.get('pricing') or {}).get('cardmarket') or {})
                  if pid:wanted.add(int(pid))
                  rows.append({'type':x.get('type'),'foil':x.get('foil'),'stamp':x.get('stamp'),'size':x.get('size'),'firstEdition':x.get('firstEdition'),'pid':pid,'ppid':cm.get('idProduct') or cm.get('id_product')})
              top=((c.get('pricing') or {}).get('cardmarket') or {})
              if top.get('idProduct'):wanted.add(int(top['idProduct']))
              print('SNAPSHOT_CARD',json.dumps({'id':cid,'name':c.get('name'),'localId':c.get('localId'),'set':c.get('set'),'rarity':c.get('rarity'),'top':top,'rows':rows},ensure_ascii=False,sort_keys=True))
          print('SNAPSHOT_SHA',sha,'PARSE_ERRORS',len(errors),'SEED',sorted(wanted))
          headers={'User-Agent':'Cardoryx-Cardmarket-Identity-Audit/2.0'}
          def dl(section,name):
              p=pathlib.Path(tempfile.gettempdir())/name
              req=urllib.request.Request('https://downloads.s3.cardmarket.com/productCatalog/'+section+'/'+name,headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r,p.open('wb') as out:
                  while chunk:=r.read(1024*1024):out.write(chunk)
              return json.load(open(p))
          prod=dl('productList','products_singles_6.json');price=dl('priceGuide','price_guide_6.json')
          def rows(root,keys):
              if isinstance(root,list):return root
              for k in keys:
                  v=root.get(k) if isinstance(root,dict) else None
                  if isinstance(v,list):return v
              return []
          products=rows(prod,('products',));prices=rows(price,('priceGuides','priceGuide'))
          bypid={int(r.get('idProduct') or 0):r for r in products if r.get('idProduct')}
          seeds=[bypid[p] for p in wanted if p in bypid]
          expids={int(r.get('idExpansion') or 0) for r in seeds}
          metas={int(r.get('idMetacard') or 0) for r in seeds if int(r.get('idMetacard') or 0)}
          print('EXPANSIONS',sorted(expids),'METAS',sorted(metas))
          candidates=[r for r in products if int(r.get('idExpansion') or 0) in expids and int(r.get('idMetacard') or 0) in metas]
          cids={int(r.get('idProduct') or 0) for r in candidates}
          for r in sorted(candidates,key=lambda x:(int(x.get('idExpansion') or 0),int(x.get('idMetacard') or 0),int(x.get('idProduct') or 0))):
              print('CM_CANDIDATE',json.dumps(r,ensure_ascii=False,sort_keys=True))
          for r in prices:
              if int(r.get('idProduct') or 0) in cids:
                  keep={k:r.get(k) for k in ('idProduct','avg','low','trend','avg1','avg7','avg30','trend-holo','avg7-holo','avg30-holo')}
                  print('CM_PRICE',json.dumps(keep,sort_keys=True))
          PY
