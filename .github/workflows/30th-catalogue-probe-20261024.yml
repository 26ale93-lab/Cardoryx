name: Read-only 30th Celebration official catalogue probe
on:
  push:
    branches: [audit/30th-catalogue-probe-20261024]
    paths: [.github/workflows/30th-catalogue-probe-20261024.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and inspect official Cardmarket Pokémon Product Catalogue
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,collections,re,datetime
          url='https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json'
          req=urllib.request.Request(url,headers={'User-Agent':'Cardoryx-30th-Catalogue-Probe/1.0'})
          with urllib.request.urlopen(req,timeout=240) as r:
              last_modified=r.headers.get('Last-Modified')
              root=json.load(r)
          products=root.get('products',[]) if isinstance(root,dict) else root
          print('CHECKED_AT_UTC',datetime.datetime.now(datetime.timezone.utc).isoformat())
          print('SOURCE',url)
          print('SOURCE_LAST_MODIFIED',last_modified)
          print('TOTAL_PRODUCTS',len(products))
          def norm(x):return re.sub(r'[^a-z0-9]+','',str(x or '').lower())
          def num(x):
              s=str(x or '').strip().upper()
              m=re.search(r'(?:^|[^A-Z0-9])30C[ -]*0*(\d{1,3})(?:$|[^A-Z0-9])',s)
              if m:return int(m.group(1)),'30C'
              m=re.fullmatch(r'0*(\d{1,3})',s)
              return (int(m.group(1)),'PLAIN') if m else (None,None)
          c30=[p for p in products if '30c' in norm(p.get('number'))]
          print('NUMBER_CONTAINS_30C',len(c30))
          print('NUMBER_30C_EXPANSION_COUNTS',json.dumps(collections.Counter(str(p.get('idExpansion')) for p in c30).most_common(12)))
          print('NUMBER_30C_SAMPLES',json.dumps(c30[:12],ensure_ascii=False))
          sentinel=[('Exeggcute',1),('Alolan Exeggutor',2),('Volbeat',3),('Illumise',4),('Gengar ex',90)]
          hits={}
          for name,n in sentinel:
              matches=[p for p in products if norm(p.get('name'))==norm(name) and num(p.get('number'))[0]==n]
              hits[name]=matches
              print('SENTINEL',name,n,'MATCHES',len(matches),'SAMPLE',json.dumps(matches[:12],ensure_ascii=False))
          score=collections.Counter()
          for name,matches in hits.items():
              for p in matches:
                  if p.get('idExpansion') is not None:score[str(p['idExpansion'])]+=1
          print('SENTINEL_EXPANSION_SCORES',json.dumps(score.most_common(20)))
          qualifying=[]
          for exp,matched in score.most_common():
              rows=[p for p in products if str(p.get('idExpansion'))==exp]
              gengar=[p for p in hits['Gengar ex'] if str(p.get('idExpansion'))==exp]
              numbered=[p for p in rows if num(p.get('number'))[0] is not None]
              if gengar and matched>=4 and len(numbered)>=40:
                  qualifying.append({'idExpansion':exp,'sentinelMatches':matched,'products':len(rows),'numbered':len(numbered),'gengar':gengar[:5],'samples':rows[:8]})
          print('QUALIFYING_30TH_EXPANSIONS',json.dumps(qualifying,ensure_ascii=False))
          print('FINAL_STATUS', 'EXACT_SET_PRESENT' if qualifying else 'NOT_CONFIRMED_IN_OFFICIAL_DOWNLOAD')
          PY
