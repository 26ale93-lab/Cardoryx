name: TEMP Cardmarket P1 Refresh Audit

on:
  push:
    branches:
      - audit/cardmarket-p1-refresh-20260919
    paths:
      - .github/workflows/temp-cardmarket-p1-refresh-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download official Cardmarket catalogue
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          url="https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json"
          req=urllib.request.Request(url,headers={"User-Agent":"Cardoryx-P1-Audit/1.0"})
          with urllib.request.urlopen(req,timeout=300) as r:
              data=json.load(r)
          rows=data if isinstance(data,list) else data.get("products",[])
          wanted={398524,741988,741976,576747,576755,726923,740411}
          found={str(x["idProduct"]):x for x in rows if x.get("idProduct") in wanted}
          out={"source":url,"products":found}
          Path("temp_cardmarket_official_product_evidence.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Record official evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_cardmarket_official_product_evidence.json
          git commit -m "TEMP record official Cardmarket product evidence"
          git push
