name: TEMP Cardmarket P1 Refresh Audit

on:
  push:
    branches:
      - audit/cardmarket-p1-refresh-20260919
    paths:
      - .github/workflows/temp-cardmarket-p1-refresh-audit.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Extend diagnostic report in runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("scripts/test_card_identity_cardmarket_audit.py")
          s=p.read_text()
          old='"p1AmbiguousProductIds": [c["tcgdexId"] for c in p1],'
          new='"p1AmbiguousProductIds": [c["tcgdexId"] for c in p1],\n        "p1AmbiguousProducts": p1,'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY

      - name: Run current Cardmarket identity audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --workers 24

      - name: Build targeted evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/card_identity_cardmarket_audit_report.json").read_text())
          targets={"sm12-237","sm12-29","mfb-9","mfb-1","svp-101","cel25cc-CC020","cel25cc-CC021","cel25-2","cel25-10"}
          rows={x["tcgdexId"]:x for x in r.get("p1AmbiguousProducts",[]) if x.get("tcgdexId") in targets}
          for x in r.get("sourceConflicts",[]):
            if x.get("tcgdexId") in targets:
              rows[x["tcgdexId"]]=x
          # case data not included in p1/sourceConflict may still be useful
          case_ids={x.get("tcgdexId") for x in r.get("caseIndex",[])}
          out={
            "mainSha":r.get("mainSha"),
            "classificationTotals":r.get("classificationTotals"),
            "targets":rows,
            "caseIndex":[x for x in r.get("caseIndex",[]) if x.get("tcgdexId") in targets],
            "alreadyProtected":r.get("alreadyProtected"),
          }
          Path("temp_cardmarket_targeted_evidence.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Record targeted evidence
        if: github.event_name == 'push'
        run: |
          git checkout -- scripts/test_card_identity_cardmarket_audit.py artifacts/card_identity_cardmarket_audit_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_cardmarket_targeted_evidence.json
          git commit -m "TEMP record targeted Cardmarket evidence"
          git push
