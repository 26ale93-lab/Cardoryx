name: TEMP Cardmarket P1 Refresh Audit

on:
  push:
    branches:
      - audit/cardmarket-p1-refresh-20260919
    paths:
      - .github/workflows/temp-cardmarket-p1-refresh-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Run current Cardmarket identity audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --workers 24

      - name: Build compact P1 summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/card_identity_cardmarket_audit_report.json")
          r=json.loads(p.read_text())
          cases={x["tcgdexId"]:x for x in r.get("caseIndex",[])}
          p1=r.get("p1AmbiguousProductIds",[])
          src=r.get("sourceConflicts",[])
          out={
            "mainSha":r.get("mainSha"),
            "generatedAt":r.get("generatedAt"),
            "snapshot":r.get("snapshot",{}),
            "coverage":r.get("coverage",{}),
            "classificationTotals":r.get("classificationTotals",{}),
            "p1Count":len(p1),
            "p1Ids":p1,
            "sourceConflictIds":[x.get("tcgdexId") for x in src],
            "unmappedExactProduct":[x.get("tcgdexId") for x in r.get("unmappedExactProduct",[])],
            "liveExactBaseEvidence":r.get("liveExactBaseEvidence",{}),
            "riskExtremes":r.get("riskExtremes",{}),
          }
          Path("temp_cardmarket_p1_audit_summary.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Record successful audit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_cardmarket_p1_audit_summary.json
          git commit -m "TEMP record current Cardmarket P1 audit"
          git push
