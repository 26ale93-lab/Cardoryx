name: TEMP Exact Checklist Finish Batch 2

on:
  push:
    branches:
      - fix/exact-checklist-finishes-batch2-20260922

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Run full deterministic finish audit
        run: python scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/variant_finish_audit_report.json --workers 28
      - name: Verify batch gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/variant_finish_audit_report.json"))
          s=r["summary"]; c=s["classifications"]
          expected={"CORRETTA":4220,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":26,"SOURCE CONFLICT":8}
          assert s["totalIdentitiesTested"]==4254,s
          assert c==expected,c
          assert s["pricingP0"]==0,s
          b=r["verifiedChecklistBatch2FinishAudit"]
          assert b["expectedIdentities"]==59,b
          assert len(b["normalIdentities"])==45,b
          assert len(b["reverseIdentities"])==50,b
          print("GATES_OK",s)
          print("BATCH2_OK",b)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-checklist-batch2-audit
          path: artifacts/variant_finish_audit_report.json
          if-no-files-found: error
