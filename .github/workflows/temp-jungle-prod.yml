name: TEMP apply Jungle exact checklist products
on:
  push:
    branches: [fix/base2-jungle-cardmarket-20260918]
permissions:
  contents: write
jobs:
  apply-test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/base2-jungle-cardmarket-20260918
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch exact Jungle mappings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,urllib.request,tempfile
          pairs=[
            ('Clefable',1,17,273798,273814),('Electrode',2,18,273799,273815),
            ('Flareon',3,19,273800,273816),('Jolteon',4,20,273801,273817),
            ('Kangaskhan',5,21,273802,273818),('Mr. Mime',6,22,273803,273819),
            ('Nidoqueen',7,23,273804,273820),('Pidgeot',8,24,273805,273821),
            ('Pinsir',9,25,273806,273822),('Scyther',10,26,273807,273823),
            ('Snorlax',11,27,273808,273824),('Vaporeon',12,28,273809,273825),
            ('Venomoth',13,29,273810,273826),('Victreebel',14,30,273811,273827),
            ('Vileplume',15,31,273812,273828),('Wigglytuff',16,32,273813,273829),
          ]
          # Fetch current official Cardmarket Price Guide rows for exact products.
          headers={'User-Agent':'Cardoryx-Cardmarket-Identity-Audit/2.0'}
          p=Path(tempfile.gettempdir())/'jungle_price_guide_6.json'
          req=urllib.request.Request('https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json',headers=headers)
          with urllib.request.urlopen(req,timeout=300) as r,p.open('wb') as out:
              while chunk:=r.read(1024*1024): out.write(chunk)
          root=json.load(open(p))
          rows=root if isinstance(root,list) else (root.get('priceGuides') or root.get('priceGuide') or [])
          wanted={x for pair in pairs for x in (pair[3],pair[4])}
          guides={}
          for row in rows:
              pid=int(row.get('idProduct') or 0)
              if pid in wanted:
                  guides[str(pid)]={k:row.get(k) for k in ('idProduct','avg','low','trend','avg1','avg7','avg30') if k in row}
          if set(map(str,wanted))!=set(guides):
              raise SystemExit('Missing Jungle Price Guide rows: '+repr(sorted(set(map(str,wanted))-set(guides))))
          # index.html registry
          ip=Path('index.html'); s=ip.read_text()
          if '"base2-1":' in s: raise SystemExit('Jungle mappings already present')
          start=s.index('const VERIFIED_LEGACY_CHECKLIST_PRODUCTS={')
          end=s.index('\n};',start)
          entries=[]
          for name,h,n,hpid,npid in pairs:
              entries.append(f'  "base2-{h}":{{setId:"base2",localId:"{h}",name:{json.dumps(name)},finish:"Holo",productId:{hpid},sourceProduct:{hpid},expansionId:1525,pairId:"base2-{n}"}},')
              entries.append(f'  "base2-{n}":{{setId:"base2",localId:"{n}",name:{json.dumps(name)},finish:"Normal",productId:{npid},sourceProduct:{hpid},expansionId:1525,pairId:"base2-{h}"}},')
          # remove comma from last existing line concern by prepend comma only if needed
          block=s[start:end]
          stripped=block.rstrip()
          if not stripped.endswith(','):
              # Existing final object entry has no trailing comma.
              last_nl=s.rfind('\n',start,end)
              s=s[:end].rstrip()+',\n'+'\n'.join(entries)[:-1]+s[end:]
          else:
              s=s[:end]+'\n'.join(entries)[:-1]+s[end:]
          # Re-find price registry after first edit.
          pstart=s.index('const VERIFIED_LEGACY_CHECKLIST_PRICE_GUIDES=')
          pend=s.index(';\n\nfunction verifiedLegacyChecklistCardmarketPrice',pstart)
          prefix='const VERIFIED_LEGACY_CHECKLIST_PRICE_GUIDES='
          literal=s[pstart+len(prefix):pend]
          existing=json.loads(literal)
          for pid,row in guides.items():
              if pid in existing: raise SystemExit('Unexpected existing Jungle guide '+pid)
              existing[pid]=row
          s=s[:pstart]+prefix+json.dumps(existing,separators=(',',':'))+s[pend:]
          ip.write_text(s)
          # Python audit registry
          tp=Path('scripts/test_card_identity_cardmarket_audit.py'); t=tp.read_text()
          if "'base2-1': ('base2'" in t: raise SystemExit('Jungle audit mappings already present')
          tstart=t.index('LEGACY_CHECKLIST_PRODUCTS = {')
          tend=t.index('\n}\n\nBATCH2_SHARED_PRODUCT_OWNERS',tstart)
          pyentries=[]
          for name,h,n,hpid,npid in pairs:
              pyentries.append(f"    'base2-{h}': ('base2', '{h}', {name!r}, 'Holo', {hpid}, {hpid}, 1525, 'base2-{n}'),")
              pyentries.append(f"    'base2-{n}': ('base2', '{n}', {name!r}, 'Normal', {npid}, {hpid}, 1525, 'base2-{h}'),")
          t=t[:tend]+'\n'+'\n'.join(pyentries)+t[tend:]
          tp.write_text(t)
          print('PATCHED_JUNGLE',len(pairs)*2,'GUIDES',len(guides))
          PY
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full audit and exact gates
        run: |
          python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/card_identity_cardmarket_audit_report.json'))
          summary=d.get('summary') or {}
          print('SUMMARY',summary)
          print('TOP_LEVEL_CLASSIFICATIONS',{k:d.get(k) for k in ('SAFE','EXACT_ALTERNATE_PRODUCT','P0_WRONG_PRODUCT','P1_AMBIGUOUS_PRODUCT','SOURCE_CONFLICT','UNMAPPED_EXACT_PRODUCT')})
          p1=d.get('p1AmbiguousProductIds') or []
          residual=[x for x in p1 if x.startswith('base2-')]
          print('BASE2_RESIDUAL',residual)
          if residual: raise SystemExit('Jungle P1 residuals remain')
          expected={'SAFE':1885,'EXACT_ALTERNATE_PRODUCT':162,'P0_WRONG_PRODUCT':0,'P1_AMBIGUOUS_PRODUCT':150,'SOURCE_CONFLICT':7,'UNMAPPED_EXACT_PRODUCT':0}
          candidates=[
              d,
              d.get('counts') or {},
              d.get('classificationCounts') or {},
              summary,
              summary.get('classificationCounts') or {},
          ]
          counts=next((x for x in candidates if all(k in x for k in expected)),None)
          if counts is None:
              raise SystemExit('Classification counters not found in audit report')
          for k,v in expected.items():
              actual=counts.get(k)
              if actual!=v: raise SystemExit(f'{k}: expected {v}, got {actual}')
          PY
      - name: Diff safety
        run: |
          git diff --check
          git status --short
          test -z "$(git status --short | grep -v -E '^( M|M ) (index.html|scripts/test_card_identity_cardmarket_audit.py)$' || true)"
      - name: Commit verified production changes only
        run: |
          git rm .github/workflows/temp-jungle-prod.yml
          git config user.name "26ale93-lab"
          git config user.email "26ale93@gmail.com"
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m "Resolve exact Jungle Cardmarket checklist products"
          git push origin HEAD:fix/base2-jungle-cardmarket-20260918
