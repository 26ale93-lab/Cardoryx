name: Temporary 30th Cardmarket price audit

on:
  push:
    branches:
      - audit/30th-cardmarket-prices-20261011
    paths:
      - scripts/test_30th_anniversary_finish_stamp.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 30th Anniversary price audit
        run: python scripts/test_30th_anniversary_finish_stamp.py --price-audit --report artifacts/30th_cardmarket_price_audit_report.json
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: 30th-cardmarket-price-audit
          path: artifacts/30th_cardmarket_price_audit_report.json
