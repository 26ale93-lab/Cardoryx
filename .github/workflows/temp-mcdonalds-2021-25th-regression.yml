name: TEMP McDonalds 2021 25th Production Regression

on:
  push:
    branches:
      - feature/mcdonalds-2021-25th-20260920
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Static checks
        run: |
          git diff --check origin/main...HEAD
          python3 -m py_compile scripts/test_variant_finish_audit.py

      - name: Run full variant finish audit
        run: |
          python3 scripts/test_variant_finish_audit.py \
            --tcgdex-db ../tcgdex-cards-database \
            --output /tmp/temp_mcd2021_variant_report.json \
            --workers 24

      - name: Verify 25th Anniversary regression
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/temp_mcd2021_variant_report.json").read_text())
          a=r["mcdonalds2021AnniversaryAudit"]
          assert a["verifiedCards"] == 25, a
          assert a["physicalRows"] == 50, a
          assert a["registryProducts"] == 50, a
          assert len(a["sourceProductConflicts"]) == 4, a
          assert a["runtime"]["testedCards"] == 25, a
          assert a["runtime"]["testedPrices"] == 50, a
          assert a["runtime"]["priceParity"] is True, a
          assert a["runtime"]["migrationPreservesFinish"] is True, a
          assert r["summary"]["classifications"]["FALSO POSITIVO"] == 0, r["summary"]
          assert r["summary"]["classifications"]["FALSO NEGATIVO"] == 0, r["summary"]
          assert r["summary"]["pricingP0"] == 0, r["summary"]
          print(json.dumps({
            "summary":r["summary"],
            "mcdonalds2021":{
              "verifiedCards":a["verifiedCards"],
              "physicalRows":a["physicalRows"],
              "registryProducts":a["registryProducts"],
              "sourceProductConflicts":a["sourceProductConflicts"],
              "runtime":a["runtime"],
            }
          },ensure_ascii=False))
          PY

      - name: Run Cardmarket identity audit
        run: |
          rm -rf scripts/__pycache__
          python3 scripts/test_card_identity_cardmarket_audit.py \
            --tcgdex-db ../tcgdex-cards-database \
            --workers 24

      - name: Verify all 25 Cardmarket pairs remain exact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/card_identity_cardmarket_audit_report.json").read_text())
          rows=[x for x in r.get("caseIndex",[]) if str(x.get("tcgdexId") or "").startswith("2021swsh-")]
          assert len(rows)==25, len(rows)
          bad=[x for x in rows if x.get("classification")!="EXACT_ALTERNATE_PRODUCT"]
          assert not bad, bad
          assert r["classificationTotals"]["P0_WRONG_PRODUCT"] == 0, r["classificationTotals"]
          print(json.dumps({
            "checked":len(rows),
            "exactAlternate":sum(x["classification"]=="EXACT_ALTERNATE_PRODUCT" for x in rows),
            "p0":r["classificationTotals"]["P0_WRONG_PRODUCT"],
          }))
          PY

      - name: Record successful validation
        if: github.event_name == 'push'
        run: |
          cat > temp_mcdonalds_2021_25th_validation.txt <<'EOF'
          PASS
          cards=25
          physicalRows=50
          registryProducts=50
          sourceProductConflicts=4
          pricingP0=0
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_mcdonalds_2021_25th_validation.txt
          git commit -m "TEMP record McDonalds 2021 25th validation"
          git push
