name: TEMP Verify Official Checklist Holo Batch
on:
  push:
    branches: [audit/official-checklist-holo-batch-20260920]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - run: python3 scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/report.json
      - run: |
          python3 - <<'PY'
          import json
          r=json.load(open("artifacts/report.json")); c=r["summary"]["classifications"]; print(r["summary"])
          assert r["summary"]["totalIdentitiesTested"]==4254
          assert c=={"CORRETTA":4127,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":119,"SOURCE CONFLICT":8},c
          assert r["summary"]["pricingP0"]==0
          print("OFFICIAL_CHECKLIST_HOLO_GATES_OK")
          PY
