name: Temporary SVP Set Logo Staff Runtime

on:
  push:
    branches:
      - feature/exact-svp-set-logo-staff-20260916

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply candidate runtime patch
        run: python -B scripts/temp_apply_svp_set_logo_staff_fix.py
      - name: Repair temporary patch-helper for current audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/temp_patch_cardmarket_audit_svp_stamps.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("fn=r'''def runtime_svp_set_logo_staff_regression():\n    \"\"\"Verify exact live SVP Set Stamp/Staff product separation in production JS.\"\"\"",
                      'fn=r"""def runtime_svp_set_logo_staff_regression():\n    # Verify exact live SVP Set Stamp/Staff product separation in production JS.')
          s=s.replace("    return result\n\n\n'''\nif anchor not in s:", '    return result\n\n\n"""\nif anchor not in s:')
          s=s.replace('        elif live_exact_base_evidence:\n',
                      '        elif live_exact_base_evidence and not snapshot_exact_alternate_product:\n')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply permanent audit regression patch
        run: python -B scripts/temp_patch_cardmarket_audit_svp_stamps.py
      - name: Exact live SVP stamp runtime test
        run: python -B scripts/temp_test_svp_set_logo_staff_runtime.py
      - name: Cardmarket runtime regression including SVP stamps
        run: python -B scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Run full Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Assert residual classification movement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          c=r['classificationTotals']
          assert c['P0_WRONG_PRODUCT']==0, c
          assert c['SOURCE_CONFLICT']==7, c
          assert c['P1_AMBIGUOUS_PRODUCT']==440, c
          assert c['EXACT_ALTERNATE_PRODUCT']==72, c
          cases={x['tcgdexId']:x for x in r['caseIndex']}
          for cid in ('svp-005','svp-006','svp-007'):
              assert cases[cid]['classification']=='EXACT_ALTERNATE_PRODUCT', (cid,cases[cid])
          for cid in ('svp-045','svp-067','svp-101','svp-150'):
              assert cases[cid]['classification']=='P1_AMBIGUOUS_PRODUCT', (cid,cases[cid])
          print(json.dumps(c,indent=2))
          PY
      - name: Existing Numel Ditto regression
        run: python -B scripts/test_variant_finish_audit.py --numel-ditto-only
      - name: Existing Quilava Play regression
        run: python -B scripts/test_variant_finish_audit.py --quilava-play-only
      - name: Restore generated and temporary files
        run: |
          git checkout -- artifacts/variant_finish_audit_report.json
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git checkout -- scripts/temp_patch_cardmarket_audit_svp_stamps.py
      - name: Diff safety
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -z "$changed" || test "$changed" = "scripts/test_card_identity_cardmarket_audit.py"
      - name: Commit validated permanent regression
        run: |
          if git diff --quiet -- scripts/test_card_identity_cardmarket_audit.py; then
            echo "Permanent regression already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test_card_identity_cardmarket_audit.py
          git commit -m "Audit exact SVP Set Stamp and Staff products"
          git push
