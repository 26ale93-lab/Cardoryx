name: Temporary SVP Set Logo Staff Runtime

on:
  push:
    branches:
      - feature/exact-svp-set-logo-staff-20260916

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply candidate runtime patch
        run: python -B scripts/temp_apply_svp_set_logo_staff_fix.py
      - name: Exact live SVP stamp runtime test
        run: python -B scripts/temp_test_svp_set_logo_staff_runtime.py
      - name: Existing Cardmarket runtime regression
        run: python -B scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Existing Numel Ditto regression
        run: python -B scripts/test_variant_finish_audit.py --numel-ditto-only
      - name: Existing Quilava Play regression
        run: python -B scripts/test_variant_finish_audit.py --quilava-play-only
      - name: Restore generated reports
        run: git checkout -- artifacts/variant_finish_audit_report.json
      - name: Diff safety
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -z "$changed" || test "$changed" = "index.html"
      - name: Commit validated candidate
        run: |
          if git diff --quiet -- index.html; then
            echo "Candidate already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Support exact SVP Set Stamp and Staff products"
          git push
