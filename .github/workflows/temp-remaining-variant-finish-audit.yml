name: TEMP Remaining Variant Finish Audit

on:
  push:
    branches:
      - audit/variant-finish-remaining-20260920
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Run full current variant finish audit
        run: |
          python3 scripts/test_variant_finish_audit.py             --tcgdex-db ../tcgdex-cards-database             --output /tmp/remaining_variant_finish_report.json             --workers 24

      - name: Extract remaining ambiguity families
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          r=json.loads(Path("/tmp/remaining_variant_finish_report.json").read_text())
          issues=[x for x in r.get("issuesByPriority",[]) if x.get("classification")=="AMBIGUA"]

          by_set=Counter()
          by_reason=Counter()
          rows=[]
          for x in issues:
              by_set[x.get("set") or "NONE"]+=1
              by_reason[x.get("reason") or "NONE"]+=1
              rows.append({
                  "tcgdexId":x.get("tcgdexId"),
                  "set":x.get("set"),
                  "localId":x.get("localId"),
                  "name":x.get("name"),
                  "reason":x.get("reason"),
              })

          out={
            "summary":r.get("summary"),
            "ambiguousCount":len(issues),
            "topSets":by_set.most_common(40),
            "topReasons":by_reason.most_common(40),
            "rows":rows,
          }
          Path("temp_remaining_variant_finish_summary.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({
            "summary":out["summary"],
            "ambiguousCount":out["ambiguousCount"],
            "topSets":out["topSets"][:25],
            "topReasons":out["topReasons"][:15],
          },ensure_ascii=False))
          PY

      - name: Verify Celebrations Classic finish evidence
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path

          def load(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Cardoryx-Celebrations-Finish-Audit/1.0"})
              with urllib.request.urlopen(req,timeout=120) as r:
                  return json.load(r)

          cards={}
          for cid in ("cel25cc-CC020","cel25cc-CC021"):
              cards[cid]=load(f"https://api.tcgdex.net/v2/en/cards/{cid}")

          pr=load("https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json")
          pg=load("https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json")
          products=pr if isinstance(pr,list) else pr.get("products",[])
          prices=pg if isinstance(pg,list) else (pg.get("priceGuides") or pg.get("priceGuide") or [])
          wanted={576790,576791}
          out={
              "cards":cards,
              "products":{str(x["idProduct"]):x for x in products if x.get("idProduct") in wanted},
              "prices":{str(x["idProduct"]):x for x in prices if x.get("idProduct") in wanted},
          }
          Path("temp_celebrations_classic_finish_evidence.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({
              "cards":{
                  cid:{
                      "name":card.get("name"),
                      "localId":card.get("localId"),
                      "variants":card.get("variants"),
                      "variants_detailed":card.get("variants_detailed"),
                  } for cid,card in cards.items()
              },
              "products":out["products"],
              "prices":out["prices"],
          },ensure_ascii=False))
          PY

      - name: Record Celebrations finish evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_celebrations_classic_finish_evidence.json
          git commit -m "TEMP record Celebrations Classic finish evidence"
          git push

      - name: Record summary
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_remaining_variant_finish_summary.json
          git commit -m "TEMP record remaining variant finish audit"
          git push
