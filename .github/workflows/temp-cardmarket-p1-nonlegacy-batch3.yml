name: TEMP Cardmarket P1 nonlegacy batch3 audit

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-nonlegacy-batch3-20260917

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect suspicious exact products and same-metacard groups
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json',timeout=90) as r:
              products=json.load(r)['products']
          with urllib.request.urlopen('https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json',timeout=90) as r:
              prices=json.load(r)['priceGuides']
          bypid={int(x['idProduct']):x for x in products}; pby={int(x['idProduct']):x for x in prices}
          for pid in [576747,576755,576790,576791,398524,761970,760671,799718,794346,851144,851262]:
              x=bypid.get(pid); print('PID',pid,json.dumps(x,ensure_ascii=False),'PRICE',json.dumps(pby.get(pid),ensure_ascii=False))
              if x and x.get('idMetacard'):
                  grp=sorted([r for r in products if r.get('idMetacard')==x['idMetacard']],key=lambda z:int(z['idProduct']))
                  print('META_GROUP',pid,json.dumps(grp,ensure_ascii=False))
          PY
