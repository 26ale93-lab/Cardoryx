name: TEMP Cardmarket P1 nonlegacy batch3 audit

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-nonlegacy-batch3-20260917

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Run full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Inspect report schema and residual P1
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/card_identity_cardmarket_audit_report.json')
          d=json.loads(p.read_text())
          print('TOP_KEYS', sorted(d.keys()))
          def walk(x,path=''):
              if isinstance(x,dict):
                  cls=str(x.get('classification') or x.get('status') or '')
                  if cls=='P1_AMBIGUOUS_PRODUCT':
                      keep={k:x.get(k) for k in ('tcgdexId','id','name','setId','localId','classification','reason','currentProductId','alternateProductIds','allProductIds','baseRowProductIdsAccordingToTcgdex','sharedProductWithTcgdexIds','cardmarketProductCatalog','realPriceGuideValues','currentCardoryxValue','trendDeltaVersusCurrent') if k in x}
                      print('P1',path,json.dumps(keep,ensure_ascii=False))
                  for k,v in x.items(): walk(v,f'{path}/{k}')
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}/{i}')
          walk(d)
          PY
