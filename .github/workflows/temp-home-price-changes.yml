name: TEMP Home Price Changes Regression

on:
  push:
    branches:
      - fix/home-price-changes-action-20260919
    paths:
      - index.html
      - scripts/test_price_refresh_changes.py
      - .github/workflows/temp-home-price-changes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  home-price-changes-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git diff check
        run: git diff --check origin/main...HEAD
      - name: Price refresh regression
        run: python3 scripts/test_price_refresh_changes.py
      - name: Record successful validation
        run: |
          printf 'PASS\ncommit=%s\n' "$GITHUB_SHA" > temp_home_price_changes_validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_home_price_changes_validation.txt
          git commit -m "TEMP record Home price changes validation"
          git push
