name: TEMP snapshot audit residual legacy specials
on:
  push:
    branches: [diagnostic/residual-p1-after-pr66-20260918]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Inspect exact snapshot sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('../tcgdex-cards-database')
          needles=['2018sm-fr','AR1','AR2','AR3','AR4','AR5','AR6','AR7','AR8','AR9']
          hits=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.ts','.json','.js'}: continue
              sp=str(p)
              if any(n.lower() in sp.lower() for n in needles):
                  hits.append(p)
          print('PATH_HITS',len(hits))
          for p in hits[:300]:
              t=p.read_text(encoding='utf-8',errors='ignore')
              if ('2018sm-fr' in t or re.search(r'\bAR[1-9]\b',t,re.I) or any(n.lower() in str(p).lower() for n in needles)):
                  print('FILE_BEGIN',p)
                  print(t[:16000])
                  print('FILE_END',p)
          # semantic fallback: exact IDs anywhere in database
          ids=['2018sm-fr-38','2018sm-fr-39']+[f'pl3-AR{i}' for i in range(1,10)]
          for cid in ids:
              found=[]
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.ts','.json','.js'}: continue
                  try:t=p.read_text(encoding='utf-8',errors='ignore')
                  except:continue
                  if cid.lower() in t.lower():
                      found.append(str(p))
              print('ID_HITS',cid,json.dumps(found[:20]))
          PY
