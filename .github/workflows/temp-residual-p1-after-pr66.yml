name: TEMP residual P1 after PR66
on:
  push:
    branches: [diagnostic/residual-p1-after-pr66-20260918]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Run full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Summarize residual P1
        run: |
          python3 - <<'PY'
          import json,collections
          d=json.load(open('artifacts/card_identity_cardmarket_audit_report.json'))
          ids=d.get('p1AmbiguousProductIds') or []
          print('P1_TOTAL',len(ids))
          groups=collections.defaultdict(list)
          for x in ids: groups[x.rsplit('-',1)[0]].append(x)
          print('BY_SET',json.dumps(sorted(((k,len(v)) for k,v in groups.items()),key=lambda x:(-x[1],x[0]))))
          for k,v in sorted(groups.items(),key=lambda kv:(len(kv[1]),kv[0])):
              print('SET',k,'COUNT',len(v),'IDS',json.dumps(sorted(v)))
          PY
