name: Aggiorna indice prezzi retail

on:
  workflow_dispatch:

  schedule:
    - cron: '35 7 * * *'

permissions:
  contents: write

jobs:
  update-retail-prices:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Genera indice prezzi retail
        run: python scripts/build_retail_index.py

      - name: Verifica file generato
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/retail_prices.json")

          if not path.exists():
              raise SystemExit("ERRORE: retail_prices.json non creato")

          data = json.loads(path.read_text(encoding="utf-8"))

          if "cards" not in data:
              raise SystemExit("ERRORE: campo cards mancante")

          if "rules" not in data:
              raise SystemExit("ERRORE: campo rules mancante")

          if data["rules"].get("cardmarketExcluded") is not True:
              raise SystemExit("ERRORE: separazione Cardmarket non confermata")

          print("Indice retail valido")
          print("Carte:", len(data["cards"]))
          PY

      - name: Commit indice aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/retail_prices.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Aggiorna indice prezzi retail"
            git push
          fi
