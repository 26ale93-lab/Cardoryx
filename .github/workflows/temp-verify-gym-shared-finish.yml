name: TEMP verify Gym shared finish products
on:
  push:
    branches: [fix/gym-leader-shared-finish-products-20260917]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Gym shared-finish patch
        run: |
          python3 .github/scripts/temp_gym_shared_finish_patch.py
          git diff --check
      - name: Commit production patch and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/temp_gym_shared_finish_patch.py .github/workflows/temp-verify-gym-shared-finish.yml
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m 'Resolve Gym Leader shared finish products'
          git push origin HEAD:fix/gym-leader-shared-finish-products-20260917
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Assert exact Gym delta
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/card_identity_cardmarket_audit_report.json'))
          cls=d['classificationTotals']
          expected={'SAFE':1793,'EXACT_ALTERNATE_PRODUCT':162,'P0_WRONG_PRODUCT':0,'P1_AMBIGUOUS_PRODUCT':242,'SOURCE_CONFLICT':7,'UNMAPPED_EXACT_PRODUCT':0}
          if cls!=expected: raise SystemExit(f'classification mismatch: {cls} != {expected}')
          fixed={
            'gym1-15','gym1-98','gym1-16','gym1-100','gym1-17','gym1-101','gym1-18','gym1-102',
            'gym2-17','gym2-100','gym2-18','gym2-104','gym2-19','gym2-106','gym2-20','gym2-110'
          }
          p1=set(d.get('p1AmbiguousProductIds') or [])
          if p1 & fixed: raise SystemExit('verified Gym ids still P1: '+repr(sorted(p1 & fixed)))
          idx={x.get('tcgdexId'):x for x in d.get('caseIndex',[]) if x.get('tcgdexId')}
          bad={x:idx.get(x) for x in fixed if (idx.get(x) or {}).get('classification')!='SAFE'}
          if bad: raise SystemExit('Gym ids not SAFE: '+repr(bad))
          print('Gym audit delta PASS',cls)
          PY
          git diff --check
