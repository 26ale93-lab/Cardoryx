name: TEMP SWSH Promo 25th Audit

on:
  push:
    branches:
      - audit/swshp-25th-promos-20260920
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Build exact SWSH 25th evidence
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path

          targets={
            "swshp-SWSH062","swshp-SWSH132","swshp-SWSH133","swshp-SWSH134",
            "swshp-SWSH135","swshp-SWSH136","swshp-SWSH137","swshp-SWSH138",
            "swshp-SWSH143","swshp-SWSH144","swshp-SWSH145","swshp-SWSH146",
          }

          import importlib.util
          spec=importlib.util.spec_from_file_location("finish_audit","scripts/test_variant_finish_audit.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          cards,parse_errors,db_sha=mod.load_official_database(Path("../tcgdex-cards-database"))
          found={card["id"]:{"path":"normalized","card":card} for card in cards if card.get("id") in targets}
          assert set(found)==targets, (targets-set(found))

          def load(url):
            req=urllib.request.Request(url,headers={"User-Agent":"Cardoryx-SWSH25-Audit/1.0"})
            with urllib.request.urlopen(req,timeout=300) as r:
              return json.load(r)

          prod_raw=load("https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json")
          price_raw=load("https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json")
          products=prod_raw if isinstance(prod_raw,list) else prod_raw.get("products",[])
          prices=price_raw if isinstance(price_raw,list) else (price_raw.get("priceGuides") or price_raw.get("priceGuide") or [])

          pids=set()
          rows=[]
          for cid in sorted(targets):
            card=found[cid]["card"]
            detailed=[]
            for row in card.get("variants_detailed") or []:
              stamps=row.get("stamp") or []
              typ=str(row.get("type") or "")
              pid=int(((row.get("thirdParty") or {}).get("cardmarket")) or 0)
              cm=(row.get("pricing") or {}).get("cardmarket") or {}
              if [str(x).lower() for x in stamps]==["25th-celebration"]:
                detailed.append({
                  "type":typ,
                  "stamp":stamps,
                  "languages":row.get("languages"),
                  "size":row.get("size"),
                  "thirdPartyProductId":pid,
                  "pricingProductId":int(cm.get("idProduct") or cm.get("id_product") or 0),
                  "pricing":cm,
                  "raw":row,
                })
                if pid: pids.add(pid)
            rows.append({
              "tcgdexId":cid,
              "name":(card.get("name") or {}).get("en") if isinstance(card.get("name"),dict) else card.get("name"),
              "localId":card.get("localId"),
              "rarity":card.get("rarity"),
              "detailed":detailed,
            })

          bypid={int(x["idProduct"]):x for x in products if x.get("idProduct") in pids}
          priceby={int(x["idProduct"]):x for x in prices if x.get("idProduct") in pids}

          for row in rows:
            for d in row["detailed"]:
              pid=d["thirdPartyProductId"]
              d["cardmarketProduct"]=bypid.get(pid)
              d["officialPriceGuide"]=priceby.get(pid)

          out={
            "targets":len(targets),
            "rows":rows,
            "distinctSourceProductIds":len(pids),
            "allSourceProductIds":sorted(pids),
          }
          Path("temp_swshp_25th_evidence.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({
            "targets":out["targets"],
            "distinctSourceProductIds":out["distinctSourceProductIds"],
            "rows":[
              {
                "id":x["tcgdexId"],"name":x["name"],
                "variants":[
                  {
                    "type":d["type"],
                    "languages":d["languages"],
                    "pid":d["thirdPartyProductId"],
                    "pricingPid":d["pricingProductId"],
                    "catalog":d["cardmarketProduct"],
                  } for d in x["detailed"]
                ],
              } for x in rows
            ]
          },ensure_ascii=False))
          PY

      - name: Verify live standard-size pricing
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          evidence=json.loads(Path("temp_swshp_25th_evidence.json").read_text())
          out=[]
          failures=[]
          for item in evidence["rows"]:
              cid=item["tcgdexId"]
              standard=[x for x in item["detailed"] if str(x.get("size") or "standard").lower()!="jumbo"]
              if len(standard)!=1:
                  failures.append({"id":cid,"reason":"standard_row_count","count":len(standard)})
                  continue
              expected=int(standard[0]["thirdPartyProductId"])
              data=None
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(
                          f"https://api.tcgdex.net/v2/en/cards/{cid}",
                          headers={"User-Agent":"Cardoryx-SWSH25-Live/1.0"},
                      )
                      with urllib.request.urlopen(req,timeout=60) as r:
                          data=json.load(r)
                      break
                  except Exception:
                      time.sleep(1+attempt)
              if not data:
                  failures.append({"id":cid,"reason":"api_unavailable"});continue
              rows=[]
              for row in data.get("variants_detailed") or []:
                  stamps=[str(x).lower() for x in (row.get("stamp") or [])]
                  if stamps!=["25th-celebration"] or str(row.get("type") or "").lower()!="holo":
                      continue
                  if str(row.get("size") or "standard").lower()=="jumbo":
                      continue
                  pid=int((row.get("thirdParty") or {}).get("cardmarket") or 0)
                  cm=(row.get("pricing") or {}).get("cardmarket") or {}
                  ppid=int(cm.get("idProduct") or cm.get("id_product") or 0)
                  rows.append({"pid":pid,"pricingPid":ppid,"pricing":cm})
              if len(rows)!=1:
                  failures.append({"id":cid,"reason":"live_standard_row_count","rows":rows});continue
              row=rows[0]
              if row["pid"]!=expected:
                  failures.append({"id":cid,"reason":"live_product_mismatch","expected":expected,"actual":row["pid"]});continue
              usable=any(isinstance(row["pricing"].get(k),(int,float)) and row["pricing"].get(k)>0 for k in ("trend","avg7","avg30","avg","low"))
              top=(data.get("pricing") or {}).get("cardmarket") or {}
              out.append({
                  "id":cid,
                  "expectedProductId":expected,
                  "rowPricingProductId":row["pricingPid"],
                  "rowUsablePrice":usable,
                  "topLevelProductId":int(top.get("idProduct") or top.get("id_product") or 0),
                  "topLevelUsablePrice":any(isinstance(top.get(k),(int,float)) and top.get(k)>0 for k in ("trend","avg7","avg30","avg","low")),
              })
          summary={"checked":len(out),"failures":failures,"rows":out}
          Path("temp_swshp_25th_live.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps(summary,ensure_ascii=False))
          assert len(out)==12 and not failures, summary
          PY

      - name: Record audit
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_swshp_25th_evidence.json
          git commit -m "TEMP record SWSH promo 25th evidence"
          git push
