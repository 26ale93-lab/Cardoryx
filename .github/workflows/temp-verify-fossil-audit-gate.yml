name: TEMP verify Fossil audit gate
on:
  push:
    branches: [fix/fossil-exact-checklist-products-20260918]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Fossil-only audit source-row gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          t=p.read_text()
          old='base_ok=(str(row.get("type") or "").lower()==expected_type and not row.get("foil") and str(row.get("size") or "standard").lower()=="standard")'
          new='base_ok=(str(row.get("type") or "").lower()==expected_type and (not row.get("foil") or (owner_set=="base3" and str(row.get("foil") or "").lower()=="galaxy")) and str(row.get("size") or "standard").lower()=="standard")'
          if t.count(old)!=1:
              raise SystemExit(f'expected one audit gate anchor, found {t.count(old)}')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
          git diff --check
      - name: Commit audit gate and remove temporary workflow
        run: |
          rm .github/workflows/temp-verify-fossil-audit-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test_card_identity_cardmarket_audit.py .github/workflows/temp-verify-fossil-audit-gate.yml
          git diff --cached --check
          git commit -m "Scope Fossil legacy audit to galaxy source rows"
          git push
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Assert exact Fossil delta
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/card_identity_cardmarket_audit_report.json'))
          s=d.get('classificationTotals') or {}
          expected={
            'SAFE':1853,
            'EXACT_ALTERNATE_PRODUCT':162,
            'P0_WRONG_PRODUCT':0,
            'P1_AMBIGUOUS_PRODUCT':182,
            'SOURCE_CONFLICT':7,
            'UNMAPPED_EXACT_PRODUCT':0,
          }
          print('CLASSIFICATIONS',json.dumps(s,ensure_ascii=False,sort_keys=True))
          for k,v in expected.items():
              if int(s.get(k,-1))!=v:
                  raise SystemExit(f'{k}: expected {v}, got {s.get(k)}')
          p1=set(d.get('p1AmbiguousProductIds') or [])
          residual=sorted(x for x in p1 if x.startswith('base3-'))
          if residual:
              raise SystemExit(f'Fossil residual P1: {residual}')
          print('FOSSIL_DELTA_PASS')
          PY
          git diff HEAD^^ --check
