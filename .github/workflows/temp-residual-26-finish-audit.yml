name: TEMP Residual 26 Finish Audit

on:
  push:
    branches:
      - audit/residual-26-20260922

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Run deterministic audit
        run: python scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/variant_finish_audit_report.json --workers 28
      - name: Build residual inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.test_variant_finish_audit import load_official_database

          report=json.load(open("artifacts/variant_finish_audit_report.json"))
          issues=[x for x in report["issuesByPriority"] if x.get("classification")=="AMBIGUA"]
          ids={x["tcgdexId"] for x in issues}
          cards,errors,sha=load_official_database(Path("tcgdex-cards-database"))
          byid={c.get("id"):c for c in cards}
          rows=[]
          for issue in issues:
              c=byid.get(issue["tcgdexId"]) or {}
              rows.append({
                  "tcgdexId":issue["tcgdexId"],
                  "setId":(c.get("set") or {}).get("id"),
                  "setName":(c.get("set") or {}).get("name"),
                  "localId":c.get("localId"),
                  "name":c.get("name"),
                  "rarity":c.get("rarity"),
                  "category":c.get("category"),
                  "thirdParty":c.get("thirdParty"),
                  "variants":c.get("variants"),
                  "variants_detailed":c.get("variants_detailed") or [],
                  "reason":issue.get("reason"),
              })
          out={"count":len(rows),"tcgdexDatabaseSha":sha,"parseErrors":len(errors),"rows":rows}
          Path("artifacts/residual_26_inventory.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("RESIDUAL_COUNT",len(rows))
          for r in rows:
              name=r["name"].get("en") if isinstance(r["name"],dict) else r["name"]
              setn=r["setName"].get("en") if isinstance(r["setName"],dict) else r["setName"]
              print("ROW",r["tcgdexId"],"|",setn,"|",r["localId"],"|",name,"|",r["rarity"],"|",json.dumps(r["variants_detailed"],ensure_ascii=False))
          PY
      - name: Verify baseline
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/variant_finish_audit_report.json"))
          s=r["summary"]; c=s["classifications"]
          expected={"CORRETTA":4220,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":26,"SOURCE CONFLICT":8}
          assert s["totalIdentitiesTested"]==4254,s
          assert c==expected,c
          assert s["pricingP0"]==0,s
          inv=json.load(open("artifacts/residual_26_inventory.json"))
          assert inv["count"]==26,inv
          print("BASELINE_OK",s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: residual-26-finish-audit
          path: |
            artifacts/variant_finish_audit_report.json
            artifacts/residual_26_inventory.json
          if-no-files-found: error
