name: TEMP SWSH Set Logo Staff Audit

on:
  push:
    branches:
      - audit/swshp-set-logo-staff-20260920
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Audit Set Logo plus Staff source collisions
        run: |
          python3 - <<'PY'
          import importlib.util,json,urllib.request
          from collections import Counter
          from pathlib import Path

          spec=importlib.util.spec_from_file_location("finish_audit","scripts/test_variant_finish_audit.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          cards,errors,sha=mod.load_official_database(Path("../tcgdex-cards-database"))

          targets=[]
          for card in cards:
              if ((card.get("set") or {}).get("id")!="swshp"):
                  continue
              rows=card.get("variants_detailed") or []
              set_logo=[]
              staff=[]
              for r in rows:
                  stamps=[str(x).lower().replace("-","").replace("_","") for x in (r.get("stamp") or [])]
                  if "setlogo" in stamps:
                      if "staff" in stamps: staff.append(r)
                      else: set_logo.append(r)
              if len(set_logo)==1 and len(staff)==1:
                  targets.append((card,set_logo[0],staff[0]))

          assert len(targets)==44,len(targets)

          def load(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Cardoryx-SWSH-SetLogoStaff-Audit/1.0"})
              with urllib.request.urlopen(req,timeout=300) as r:
                  return json.load(r)

          prod_raw=load("https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json")
          products=prod_raw if isinstance(prod_raw,list) else prod_raw.get("products",[])
          by_pid={int(x["idProduct"]):x for x in products if x.get("idProduct")}
          by_exp_meta={}
          for x in products:
              exp=x.get("idExpansion");meta=x.get("idMetacard")
              if exp is not None and meta is not None:
                  by_exp_meta.setdefault((exp,meta),[]).append(x)

          out=[]
          for card,base,staff in targets:
              base_pid=int((base.get("thirdParty") or {}).get("cardmarket") or 0)
              staff_pid=int((staff.get("thirdParty") or {}).get("cardmarket") or 0)
              cat=by_pid.get(base_pid) or {}
              candidates=sorted(by_exp_meta.get((cat.get("idExpansion"),cat.get("idMetacard")),[]),key=lambda x:int(x["idProduct"]))
              out.append({
                  "tcgdexId":card["id"],
                  "localId":card.get("localId"),
                  "name":(card.get("name") or {}).get("en") if isinstance(card.get("name"),dict) else card.get("name"),
                  "baseProductId":base_pid,
                  "staffProductId":staff_pid,
                  "sourceSharesProduct":base_pid==staff_pid,
                  "catalogExpansion":cat.get("idExpansion"),
                  "catalogMetacard":cat.get("idMetacard"),
                  "catalogCandidates":[
                      {"idProduct":x.get("idProduct"),"name":x.get("name"),"dateAdded":x.get("dateAdded")}
                      for x in candidates
                  ],
              })

          summary={
              "tcgdexSha":sha,
              "cards":len(out),
              "sourceSharedProductCount":sum(x["sourceSharesProduct"] for x in out),
              "sourceDistinctProductCount":sum(not x["sourceSharesProduct"] for x in out),
              "candidateCountHistogram":dict(Counter(len(x["catalogCandidates"]) for x in out)),
              "rows":out,
          }
          Path("temp_swshp_set_logo_staff_audit.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps({
              "cards":summary["cards"],
              "sourceSharedProductCount":summary["sourceSharedProductCount"],
              "sourceDistinctProductCount":summary["sourceDistinctProductCount"],
              "candidateCountHistogram":summary["candidateCountHistogram"],
              "sample":out[:12],
          },ensure_ascii=False))
          PY

      - name: Record audit
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_swshp_set_logo_staff_audit.json
          git commit -m "TEMP record SWSH set-logo Staff audit"
          git push
