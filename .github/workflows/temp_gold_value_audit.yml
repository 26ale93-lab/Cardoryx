name: TEMP Gold value audit
on:
  push:
    branches:
      - audit/gold-values-20260921

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit all exact Gold values
        shell: python
        run: |
          import csv, json, math, urllib.request

          TARGETS=json.loads(r'''{"151":[["205","Mew-ex"],["206","Scambio"],["207","Energia base Psiche"]],"Astral Radiance":[["208","Palkia Originale V ASTRO"],["209","Samurott di Hisui V ASTRO"],["210","Dialga Originale V ASTRO"],["211","Cinturascelta"],["212","Villaggio Giubilo"],["213","Sentiero Biancacima"],["214","Tempio di Sinnoh"],["215","Scarpe da trekking"],["216","Energia Turbo Doppia"]],"Astral Radiance Trainer Gallery":[["TG29","Calyrex Cavaliere Glaciale VMAX"],["TG30","Calyrex Cavaliere Spettrale VMAX"]],"Battle Styles":[["178","Octillery"],["179","Houndoom"],["180","Condividi Esperienza"],["181","Level Ball"],["182","Energia Colpo Rapido"],["183","Energia Colpo Singolo"]],"Brilliant Stars":[["181","Articuno di Galar V"],["182","Zapdos di Galar V"],["183","Moltres di Galar V"],["184","Arceus V ASTRO"],["185","Bacino di Magma"],["186","Ultra Ball"]],"Chaos Rising":[["122","Mega Greninja-ex"]],"Chilling Reign":[["222","Electrode"],["223","Bronzong"],["224","Snorlax"],["225","Corno Echeggiante"],["226","Ventaglio delle Onde"],["227","Cristallo di Bruma"],["228","Robustelmo"],["229","Urna del Vigore"],["230","Lanterna di Benvenuto"],["231","Energia Acqua"],["232","Energia Psiche"],["233","Energia Combattimento"]],"Darkness Ablaze":[["197","Rillaboom"],["198","Coalossal"],["199","Parasole Grande"],["200","Distintivo Turbo"],["201","Energia Cattura"]],"Destined Rivals":[["239","Ho-Oh-ex di Armonio"],["240","Mewtwo-ex del Team Rocket"],["241","Garchomp-ex di Camilla"],["242","Crobat-ex del Team Rocket"],["243","Torre di Interferenza"],["244","Leudapoli"]],"Evolving Skies":[["226","Froslass"],["227","Inteleon"],["228","Cresselia"],["229","Frullato Energizzante"],["230","Caverna dei Cristalli"],["231","Difesa Integrale"],["232","Montagne Tempestose"],["233","Acchiappa-Pokémon Giocattolo"],["234","Stadio di Turffield"],["235","Energia Lampo"],["236","Energia Oscurità"],["237","Energia Metallo"]],"Fusion Strike":[["280","Flaaffy"],["281","Compressa Energetica"],["282","Cortile di Allenamento"],["283","Energia Erba"],["284","Energia Fuoco"]],"Journey Together":[["188","Bellibolt-ex di Kissara"],["189","Zoroark-ex di N"]],"Lost Origin":[["212","Giratina V ASTRO"],["213","Zoroark di Hisui V ASTRO"],["214","Scatola del Disastro"],["215","Macerie dello Stadio"],["216","Distintivo Oscuro"],["217","Aspiratore Perduto"]],"Lost Origin Trainer Gallery":[["TG29","Pikachu VMAX"],["TG30","Mew VMAX"]],"Phantasmal Flames":[["130","Mega Charizard X-ex"]],"Pokémon GO":[["086","Mewtwo V ASTRO"],["087","Incubatrice Uova"],["088","Modulo Esca"]],"Prismatic Evolutions":[["176","Fogliaferrea-ex"],["177","Ogerpon Maschera Turchese-ex"],["178","Acquecrespe-ex"],["179","Pikachu-ex"],["180","Terapagos-ex"]],"Rebel Clash":[["204","Frosmoth"],["205","Perrserker di Galar"],["206","Amuleto Grande"],["207","Retino di Recupero"],["208","Scartaoggetti"],["209","Energia Duplice"]],"Shrouded Fable":[["095","Pecharunt-ex"],["096","Anfora Terrestre"],["097","Clessidra Energetica"],["098","Energia base Oscurità"],["099","Energia base Metallo"]],"Silver Tempest":[["210","Serperior V ASTRO"],["211","Lugia V ASTRO"],["212","Scambio di Energia"],["213","Palude Boccalarga"],["214","Fogliaponcho Mimetico"],["215","Energia Difesa V"]],"Silver Tempest Trainer Gallery":[["TG29","Rayquaza VMAX"],["TG30","Duraludon VMAX"]],"Stellar Crown":[["174","Grande Abisso Zero"],["175","Amuleto del Coraggio"]],"Surging Sparks":[["247","Pikachu-ex"],["248","Exeggutor di Alola-ex"],["249","Contrappeso"],["250","Monte Gravità"],["251","Barella Notturna"],["252","Energia Jet"]],"Temporal Forces":[["213","Fogliaferrea-ex"],["214","Vampeaguzze-ex"],["215","Acquecrespe-ex"],["216","Capoferreo-ex"],["217","Massoferreo-ex"],["218","Furiatonante-ex"]],"Twilight Masquerade":[["221","Ogerpon Maschera Turchese-ex"],["222","Ursaluna Luna Cremisi-ex"],["223","Poffin del Cuore"],["224","Supermartello"],["225","Skateboard di Salvataggio"],["226","Energia Luminosa"]],"Vivid Voltage":[["198","Obstagoon di Galar"],["199","Oranguru"],["200","Mantello della Tenacia"],["201","Medaglia dell'Eroe"],["202","Capsula della Memoria"],["203","Vista Telescopica"]]}''')

          def get(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.load(r)

          def positive(x):
              try:
                  n=float(x or 0)
              except Exception:
                  return 0.0
              return n if math.isfinite(n) and n>0 else 0.0

          sets=get("https://api.tcgdex.net/v2/en/sets")
          setmap={s["name"]:s["id"] for s in sets}
          rows=[]
          missing_sets=[]
          for set_name, targets in TARGETS.items():
              sid=setmap.get(set_name)
              if not sid:
                  missing_sets.append(set_name)
                  for local,name_it in targets:
                      rows.append({"set":set_name,"number":local,"name":name_it,"status":"SET_NOT_FOUND"})
                  continue
              sd=get(f"https://api.tcgdex.net/v2/en/sets/{sid}")
              by_local={str(c.get("localId")):c for c in sd.get("cards",[])}
              for local,name_it in targets:
                  brief=by_local.get(str(local))
                  if not brief:
                      rows.append({"set":set_name,"number":local,"name":name_it,"status":"CARD_NOT_FOUND","setId":sid})
                      continue
                  card=get(f"https://api.tcgdex.net/v2/en/cards/{brief['id']}")
                  exact=[]
                  for vr in card.get("variants_detailed") or []:
                      typ=str(vr.get("type") or "").strip().lower()
                      foil=str(vr.get("foil") or "").strip().lower()
                      size=str(vr.get("size") or "standard").strip().lower()
                      stamps=vr.get("stamp") or []
                      if typ=="holo" and foil=="gold" and size=="standard" and not stamps:
                          exact.append(vr)
                  if len(exact)!=1:
                      rows.append({
                          "set":set_name,"number":local,"name":name_it,"tcgdexId":brief["id"],
                          "status":"EXACT_GOLD_ROWS_"+str(len(exact))
                      })
                      continue
                  vr=exact[0]
                  cm=(vr.get("pricing") or {}).get("cardmarket") or {}
                  third=(vr.get("thirdParty") or {})
                  row_pid=int(third.get("cardmarket") or 0)
                  price_pid=int(cm.get("idProduct") or cm.get("id_product") or 0)
                  usable={k:positive(cm.get(k)) for k in ["trend","avg7","avg30","avg","low"]}
                  chosen=next((usable[k] for k in ["trend","avg7","avg30","avg","low"] if usable[k]>0),0.0)
                  status="OK" if row_pid>0 and price_pid==row_pid and chosen>0 else "PRICE_UNAVAILABLE"
                  anomaly=[]
                  if usable["trend"] and usable["avg7"]:
                      ratio=usable["trend"]/usable["avg7"]
                      if ratio<0.5 or ratio>2.0:
                          anomaly.append("TREND_VS_AVG7")
                  if usable["trend"] and usable["avg30"]:
                      ratio=usable["trend"]/usable["avg30"]
                      if ratio<0.5 or ratio>2.0:
                          anomaly.append("TREND_VS_AVG30")
                  rows.append({
                      "set":set_name,"number":local,"name":name_it,"tcgdexId":brief["id"],
                      "status":status,"cardmarketProductId":row_pid,"pricingProductId":price_pid,
                      "cardoryxValue":round(chosen,2) if chosen else None,
                      "trend":round(usable["trend"],2) if usable["trend"] else None,
                      "avg7":round(usable["avg7"],2) if usable["avg7"] else None,
                      "avg30":round(usable["avg30"],2) if usable["avg30"] else None,
                      "avg":round(usable["avg"],2) if usable["avg"] else None,
                      "low":round(usable["low"],2) if usable["low"] else None,
                      "updated":cm.get("updated"),
                      "anomaly":";".join(anomaly) if anomaly else ""
                  })

          ok=[r for r in rows if r.get("status")=="OK"]
          unavailable=[r for r in rows if r.get("status")!="OK"]
          anomalies=[r for r in ok if r.get("anomaly")]
          summary={
              "targetCount":sum(len(v) for v in TARGETS.values()),
              "rows":len(rows),
              "ok":len(ok),
              "unavailable":len(unavailable),
              "anomalies":len(anomalies),
              "missingSets":missing_sets,
              "totalCardoryxValue":round(sum(r.get("cardoryxValue") or 0 for r in ok),2),
              "totalTrend":round(sum(r.get("trend") or 0 for r in ok),2),
              "totalAvg7":round(sum(r.get("avg7") or 0 for r in ok),2),
              "totalAvg30":round(sum(r.get("avg30") or 0 for r in ok),2),
              "updatedMin":min((r.get("updated") for r in ok if r.get("updated")),default=None),
              "updatedMax":max((r.get("updated") for r in ok if r.get("updated")),default=None),
          }
          with open("gold_values.json","w",encoding="utf-8") as f:
              json.dump({"summary":summary,"rows":rows},f,ensure_ascii=False,indent=2)
          fields=["set","number","name","tcgdexId","status","cardmarketProductId","pricingProductId","cardoryxValue","trend","avg7","avg30","avg","low","updated","anomaly"]
          with open("gold_values.csv","w",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields,extrasaction="ignore")
              w.writeheader(); w.writerows(rows)
          print("SUMMARY",json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print("TOP20",json.dumps(sorted(ok,key=lambda r:r.get("cardoryxValue") or 0,reverse=True)[:20],ensure_ascii=False))
          print("ANOMALIES",json.dumps(anomalies,ensure_ascii=False))
          print("UNAVAILABLE",json.dumps(unavailable,ensure_ascii=False))
      - name: Upload audit files
        uses: actions/upload-artifact@v4
        with:
          name: gold-values
          path: |
            gold_values.json
            gold_values.csv
