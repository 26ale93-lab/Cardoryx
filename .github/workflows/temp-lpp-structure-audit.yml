name: TEMP LPP Structure Audit

on:
  push:
    branches:
      - audit/lpp-structure-20260923

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run LPP structure audit
        run: python scripts/test_lpp_structure_audit.py
