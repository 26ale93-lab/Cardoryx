name: TEMP Residual 144 Family Patterns
on:
  push:
    branches: [diagnostic/residual-144-family-patterns-20260920]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - run: python3 scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/report.json
      - name: Compare residual samples to same-set cards
        run: |
          python3 - <<'PY'
          import importlib.util,json
          from collections import Counter,defaultdict
          from pathlib import Path
          r=json.load(open("artifacts/report.json"))
          spec=importlib.util.spec_from_file_location("v","scripts/test_variant_finish_audit.py")
          v=importlib.util.module_from_spec(spec); spec.loader.exec_module(v)
          cards,errs,sha=v.load_official_database(Path("tcgdex-cards-database"))
          by={c["id"]:c for c in cards}
          amb=[x for x in r["issuesByPriority"] if x["classification"]=="AMBIGUA" and not (by.get(x["tcgdexId"],{}).get("variants_detailed") or [])]
          groups=defaultdict(list)
          for x in amb: groups[x["tcgdexId"].split("-",1)[0]].append(x["tcgdexId"])
          out={}
          for prefix,ids in sorted(groups.items()):
            same=[c for c in cards if c["id"].split("-",1)[0]==prefix]
            detailed=[c for c in same if c.get("variants_detailed")]
            patterns=Counter()
            for c in detailed:
              sig=tuple(sorted((v.canonical_finish_type_label(q.get("type")),v.canonical_finish_foil_label(q.get("foil")),tuple(sorted(q.get("stamp") or [])),str(q.get("size") or "standard").lower()) for q in c.get("variants_detailed") or []))
              patterns[str(sig)]+=1
            out[prefix]={
              "residualIds":ids,"residualCount":len(ids),"setCards":len(same),
              "sameSetDetailedCards":len(detailed),"sameSetNoDetailed":len(same)-len(detailed),
              "sameSetDetailedPatterns":patterns.most_common(12)
            }
          print(json.dumps({"summary":r["summary"],"families":out},ensure_ascii=False,indent=2))
          PY
