name: TEMP verify Fossil exact checklist products
on:
  push:
    branches: [fix/fossil-exact-checklist-products-20260918]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact Fossil checklist patch
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, tempfile

          ROOT=pathlib.Path('.')
          index=ROOT/'index.html'
          audit=ROOT/'scripts/test_card_identity_cardmarket_audit.py'
          headers={'User-Agent':'Cardoryx-Cardmarket-Identity-Audit/2.0'}

          pairs=[
            ('Aerodactyl',1,273862,16,273877),
            ('Articuno',2,273863,17,273878),
            ('Ditto',3,273864,18,273879),
            ('Dragonite',4,273865,19,273880),
            ('Gengar',5,273866,20,273881),
            ('Haunter',6,273867,21,273882),
            ('Hitmonlee',7,273868,22,273883),
            ('Hypno',8,273869,23,273884),
            ('Kabutops',9,273870,24,273885),
            ('Lapras',10,273871,25,273886),
            ('Magneton',11,273872,26,273887),
            ('Moltres',12,273873,27,273888),
            ('Muk',13,273874,28,273889),
            ('Raichu',14,273875,29,273890),
            ('Zapdos',15,273876,30,273891),
          ]

          def dl(section,name):
              p=pathlib.Path(tempfile.gettempdir())/name
              req=urllib.request.Request('https://downloads.s3.cardmarket.com/productCatalog/'+section+'/'+name,headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r,p.open('wb') as f:
                  while chunk:=r.read(1024*1024): f.write(chunk)
              return json.load(open(p,encoding='utf-8'))

          def rows(root,keys):
              if isinstance(root,list): return root
              for k in keys:
                  v=root.get(k) if isinstance(root,dict) else None
                  if isinstance(v,list): return v
              return []

          prod=dl('productList','products_singles_6.json')
          guide=dl('priceGuide','price_guide_6.json')
          products={int(r['idProduct']):r for r in rows(prod,('products',)) if r.get('idProduct')}
          prices={int(r['idProduct']):r for r in rows(guide,('priceGuides','priceGuide')) if r.get('idProduct')}

          rules={}
          price_rows={}
          for name,hnum,hpid,nnum,npid in pairs:
              hp, np = products.get(hpid), products.get(npid)
              if not hp or not np:
                  raise AssertionError(f'missing catalogue product {name}: {hpid}/{npid}')
              if int(hp.get('idExpansion') or 0)!=1526 or int(np.get('idExpansion') or 0)!=1526:
                  raise AssertionError(f'wrong Fossil expansion {name}')
              hm,nm=int(hp.get('idMetacard') or 0),int(np.get('idMetacard') or 0)
              if not hm or hm!=nm:
                  raise AssertionError(f'metacard mismatch {name}: {hm}/{nm}')
              if str(hp.get('name') or '')!=str(np.get('name') or ''):
                  raise AssertionError(f'catalogue name mismatch {name}')
              if hpid==npid:
                  raise AssertionError(f'products must be distinct {name}')
              for pid in (hpid,npid):
                  row=prices.get(pid)
                  if not row:
                      raise AssertionError(f'missing Price Guide {pid}')
                  clean={'idProduct':pid}
                  for k in ('avg','low','trend','avg1','avg7','avg30'):
                      v=row.get(k)
                      if isinstance(v,(int,float)):
                          clean[k]=v
                  if not any(isinstance(clean.get(k),(int,float)) and clean.get(k)>0 for k in ('trend','avg7','avg30','avg','low')):
                      raise AssertionError(f'no usable standard Price Guide fields {pid}')
                  price_rows[str(pid)]=clean
              hid=f'base3-{hnum}'; nid=f'base3-{nnum}'
              rules[hid]={'setId':'base3','localId':str(hnum),'name':name,'finish':'Holo','productId':hpid,'sourceProduct':hpid,'expansionId':1526,'pairId':nid}
              rules[nid]={'setId':'base3','localId':str(nnum),'name':name,'finish':'Normal','productId':npid,'sourceProduct':hpid,'expansionId':1526,'pairId':hid}

          # Patch production registry without rewriting unrelated entries.
          t=index.read_text(encoding='utf-8')
          reg='const VERIFIED_LEGACY_CHECKLIST_PRODUCTS='
          rs=t.index(reg)
          re_=t.index('\n};\nconst VERIFIED_LEGACY_CHECKLIST_PRICE_GUIDES=',rs)
          existing=t[rs:re_]
          for cid in rules:
              if f'"{cid}"' in existing or f"'{cid}'" in existing:
                  raise AssertionError(f'Fossil identity already present: {cid}')
          add=[]
          for cid,r in rules.items():
              add.append('  '+json.dumps(cid)+':'+json.dumps(r,ensure_ascii=False,separators=(',',':')))
          prefix=t[:re_].rstrip()
          if not prefix.endswith('}'):
              raise AssertionError('unexpected checklist registry tail')
          t=prefix+',\n'+',\n'.join(add)+t[re_:]

          # Merge exact Price Guide snapshots.
          marker='const VERIFIED_LEGACY_CHECKLIST_PRICE_GUIDES='
          ps=t.index(marker)+len(marker)
          decoder=json.JSONDecoder()
          current,used=decoder.raw_decode(t[ps:])
          overlap=set(current).intersection(price_rows)
          if overlap:
              raise AssertionError(f'Fossil price products already present: {sorted(overlap)}')
          current.update(price_rows)
          t=t[:ps]+json.dumps(current,ensure_ascii=False,separators=(',',':'))+t[ps+used:]
          index.write_text(t,encoding='utf-8')

          # Extend permanent audit registry only; existing runtime/classification logic remains unchanged.
          a=audit.read_text(encoding='utf-8')
          am='LEGACY_CHECKLIST_PRODUCTS = {'
          astart=a.index(am)
          aend=a.index('\n}\n\nBATCH2_SHARED_PRODUCT_OWNERS',astart)
          existing_a=a[astart:aend]
          for cid in rules:
              if repr(cid) in existing_a or json.dumps(cid) in existing_a:
                  raise AssertionError(f'audit Fossil identity already present: {cid}')
          alines=[]
          for cid,r in rules.items():
              alines.append(
                  f"    {cid!r}: ({r['setId']!r}, {r['localId']!r}, {r['name']!r}, {r['finish']!r}, "
                  f"{r['productId']}, {r['sourceProduct']}, {r['expansionId']}, {r['pairId']!r}),"
              )
          a=a[:aend]+'\n'+'\n'.join(alines)+a[aend:]
          audit.write_text(a,encoding='utf-8')

          print('FOSSIL_RULES',len(rules))
          print('FOSSIL_PRODUCTS',len(price_rows))
          PY
          git diff --check
          node --check <(sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d') 2>/dev/null || true
      - name: Commit production patch and remove temporary workflow
        run: |
          rm .github/workflows/temp-verify-fossil-checklist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/test_card_identity_cardmarket_audit.py .github/workflows/temp-verify-fossil-checklist.yml
          git diff --cached --check
          git commit -m "Resolve exact Fossil Holo and Non-Holo products"
          git push
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Assert exact Fossil delta
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/card_identity_cardmarket_audit_report.json'))
          s=d.get('summary') or {}
          expected={
            'SAFE':1853,
            'EXACT_ALTERNATE_PRODUCT':162,
            'P0_WRONG_PRODUCT':0,
            'P1_AMBIGUOUS_PRODUCT':182,
            'SOURCE_CONFLICT':7,
            'UNMAPPED_EXACT_PRODUCT':0,
          }
          print('SUMMARY',json.dumps(s,ensure_ascii=False,sort_keys=True))
          for k,v in expected.items():
              if int(s.get(k,-1))!=v:
                  raise SystemExit(f'{k}: expected {v}, got {s.get(k)}')
          p1=set(d.get('p1AmbiguousProductIds') or [])
          residual=sorted(x for x in p1 if x.startswith('base3-'))
          if residual:
              raise SystemExit(f'Fossil residual P1: {residual}')
          print('FOSSIL_DELTA_PASS')
          PY
          git diff HEAD^ --check
