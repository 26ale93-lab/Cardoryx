name: TEMP Verify Scanner Select Deterministic
on:
  push:
    branches: [fix/scanner-select-trigger-all-ios-20260920]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Static and JS gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text()
          assert ".scanner-select-trigger{display:block" in s
          assert "#scanView select.scanner-sheet-native{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}" in s
          assert "@media(pointer:coarse){#scanView select.scanner-sheet-native" not in s
          for x in ["variant","stamp","playSeries","status","condition"]:
              assert ("'"+x+"'") in s
          assert "function openScannerSelectSheet(select)" in s
          assert "function installScannerSelectSheets()" in s
          print("SCANNER_SELECT_STATIC_OK")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path("/tmp/cardoryx.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/cardoryx.js
