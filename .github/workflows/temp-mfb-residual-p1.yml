name: TEMP mfb residual P1 audit
on:
  push:
    branches: [diagnostic/mfb-residual-p1-20260917]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact runtime anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          needles=['function canonicalStamp(','function stampExistsForCard(','function verifiedStampPrice(','Worlds 2024</option>','VERIFIED_PRIMARY_WORLDS_STAMPS']
          lines=s.splitlines()
          for needle in needles:
              print('\n===',needle,'===')
              hits=[i for i,l in enumerate(lines) if needle in l]
              print('hits',hits)
              for i in hits[:4]:
                  a=max(0,i-10); b=min(len(lines),i+45)
                  for n in range(a,b): print(f'{n+1}: {lines[n]}')
          PY
