name: TEMP P1 modern exact verification

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-residual-batch6-20260917

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print live TCGdex evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          for cid in ['sv09-055','me01-073']:
              with urllib.request.urlopen('https://api.tcgdex.net/v2/en/cards/'+cid,timeout=60) as r:
                  c=json.load(r)
              def pid(row):
                  x=(row.get('thirdParty') or {}).get('cardmarket')
                  if isinstance(x,dict): x=x.get('idProduct') or x.get('id_product')
                  return x
              print('CARD',json.dumps({
                  'id':c.get('id'),'name':c.get('name'),'localId':c.get('localId'),'set':c.get('set'),
                  'topCardmarket':(c.get('pricing') or {}).get('cardmarket'),
                  'variants':[{
                      'type':x.get('type'),'foil':x.get('foil'),'stamp':x.get('stamp'),'size':x.get('size'),'subtype':x.get('subtype'),
                      'pid':pid(x),'pricing':(x.get('pricing') or {}).get('cardmarket')
                  } for x in (c.get('variants_detailed') or [])]
              },ensure_ascii=False,sort_keys=True))
          PY
      - name: Show production Cardmarket resolver anchors
        shell: bash
        run: |
          grep -n -E 'VERIFIED_BASE_CARDMARKET_PRODUCT_OVERRIDES|verifiedBaseCardmarket|cardmarketValueForVariant|pricing\.cardmarket|idProduct' index.html | head -n 180
