name: TEMP P1 residual batch6 audit

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-residual-batch6-20260917

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Patch diagnostic report only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          s=p.read_text()
          old='''        "p1AmbiguousProductIds": [c["tcgdexId"] for c in p1],\n'''
          new='''        "p1AmbiguousProductIds": [c["tcgdexId"] for c in p1],\n        "p1AmbiguousProducts": p1,\n'''
          if old not in s: raise SystemExit('diagnostic report anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Print residual P1 candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          p1=r.get('p1AmbiguousProducts') or []
          print('P1_COUNT',len(p1))
          def score(x):
              vals=x.get('trendDeltaVersusCurrent') or {}
              nums=[]
              for v in vals.values():
                  try: nums.append(abs(float(v)))
                  except: pass
              return (max(nums) if nums else 0, -len(x.get('allProductIds') or []))
          for x in sorted(p1,key=score,reverse=True)[:140]:
              out={k:x.get(k) for k in (
                  'tcgdexId','name','setId','localId','currentProductId','allProductIds',
                  'physicalVariantsByProductId','cardmarketProductCatalog','realPriceGuideValues',
                  'trendDeltaVersusCurrent','reason','recommendedAction','sharedWithTcgdexIds',
                  'liveExactBaseEvidence','snapshotExactAlternateProductProtected'
              )}
              print('P1',json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
