name: TEMP Cardmarket Final 16 Audit

on:
  push:
    branches:
      - audit/cardmarket-final16-20260919
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Expose P1 details in runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("scripts/test_card_identity_cardmarket_audit.py")
          s=p.read_text()
          old='"p1AmbiguousProductIds": [c["tcgdexId"] for c in p1],'
          new='"p1AmbiguousProductIds": [c["tcgdexId"] for c in p1],\n        "p1AmbiguousProducts": p1,'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY

      - name: Run current full audit
        run: |
          for attempt in 1 2 3; do
            python3 scripts/test_card_identity_cardmarket_audit.py --workers 24 && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Build final-16 evidence pack
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          report=json.loads(Path("artifacts/card_identity_cardmarket_audit_report.json").read_text())
          p1=report.get("p1AmbiguousProducts",[])
          assert len(p1)==16, len(p1)

          targets={x["tcgdexId"] for x in p1}
          names={x["tcgdexId"]:x.get("name") for x in p1}
          source_cards={}

          root=Path("../tcgdex-cards-database")
          for path in root.rglob("*.json"):
            try:
              data=json.loads(path.read_text(encoding="utf-8"))
            except Exception:
              continue
            objs=[]
            if isinstance(data,dict):
              objs=[data]
            elif isinstance(data,list):
              objs=[x for x in data if isinstance(x,dict)]
            for obj in objs:
              cid=obj.get("id")
              if cid in targets and cid not in source_cards:
                source_cards[cid]={"path":str(path.relative_to(root)),"data":obj}
            if len(source_cards)==len(targets):
              break

          url="https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json"
          req=urllib.request.Request(url,headers={"User-Agent":"Cardoryx-Final16-Audit/1.0"})
          with urllib.request.urlopen(req,timeout=300) as r:
            catalog=json.load(r)
          rows=catalog if isinstance(catalog,list) else catalog.get("products",[])

          current_pids={int(x["currentProductId"]) for x in p1 if x.get("currentProductId")}
          alt_pids={int(pid) for x in p1 for pid in (x.get("alternateProductIds") or [])}
          relevant_pids=current_pids|alt_pids

          exact_products={str(row["idProduct"]):row for row in rows if row.get("idProduct") in relevant_pids}

          candidate_products={}
          for x in p1:
            nm=(x.get("name") or "").strip()
            if not nm:
              candidate_products[x["tcgdexId"]]=[]
              continue
            candidates=[]
            for row in rows:
              rn=str(row.get("name") or "")
              if rn.lower().startswith(nm.lower()+" [") or rn.lower()==nm.lower():
                candidates.append(row)
            candidate_products[x["tcgdexId"]]=candidates[:200]

          out={
            "mainSha":report.get("mainSha"),
            "generatedAt":report.get("generatedAt"),
            "classificationTotals":report.get("classificationTotals"),
            "p1":p1,
            "tcgdexSourceCards":source_cards,
            "exactCardmarketProducts":exact_products,
            "sameNameCardmarketCandidates":candidate_products,
          }
          Path("temp_cardmarket_final16_evidence.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({
            "classificationTotals":out["classificationTotals"],
            "p1Ids":[x["tcgdexId"] for x in p1],
            "sourceCardsFound":len(source_cards),
            "exactProductsFound":len(exact_products)
          },ensure_ascii=False))
          PY

      - name: Verify Celebrations Classic exact Cardmarket products
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          urls={
            "products":"https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json",
            "prices":"https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json",
          }
          data={}
          for key,url in urls.items():
            req=urllib.request.Request(url,headers={"User-Agent":"Cardoryx-Celebrations-Audit/1.0"})
            with urllib.request.urlopen(req,timeout=300) as r:
              data[key]=json.load(r)
          products=data["products"] if isinstance(data["products"],list) else data["products"].get("products",[])
          prices=data["prices"] if isinstance(data["prices"],list) else (data["prices"].get("priceGuides") or data["prices"].get("priceGuide") or [])
          wanted={576747,576755,576790,576791}
          out={
            "products":{str(x["idProduct"]):x for x in products if x.get("idProduct") in wanted},
            "prices":{str(x["idProduct"]):x for x in prices if x.get("idProduct") in wanted},
          }
          assert set(out["products"])=={str(x) for x in wanted}, out["products"].keys()
          Path("temp_celebrations_classic_cardmarket_evidence.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Record Celebrations evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_celebrations_classic_cardmarket_evidence.json
          git commit -m "TEMP record Celebrations Classic Cardmarket evidence"
          git push

      - name: Record evidence
        run: |
          git checkout -- scripts/test_card_identity_cardmarket_audit.py artifacts/card_identity_cardmarket_audit_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_cardmarket_final16_evidence.json
          git commit -m "TEMP record final 16 Cardmarket evidence"
          git push
