name: TEMP Historical Exact Finish Audit

on:
  push:
    branches:
      - fix/historical-exact-finish-registry-20260922

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Production / audit exact registry binding
        run: python scripts/test_historical_exact_finish_registry.py
      - name: Scanner single-finish regression
        run: python scripts/test_scanner_single_finish_autoselect.py
      - name: Catalog allocation regression
        run: python scripts/test_catalog_filters.py
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Full deterministic variant finish audit
        run: python scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/variant_finish_audit_report.json --workers 28
      - name: Verify exact gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/variant_finish_audit_report.json"))
          s=r["summary"]; c=s["classifications"]
          expected={"CORRETTA":4220,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":26,"SOURCE CONFLICT":8}
          assert s["totalIdentitiesTested"]==4254,s
          assert c==expected,c
          assert s["pricingP0"]==0,s
          h=r["verifiedHistoricalChecklistFinishAudit"]
          assert h["expectedIdentities"]==59,h
          assert len(h["normalIdentities"])==45,h
          assert len(h["reverseIdentities"])==50,h
          assert h["outsideListInheritedRule"] is False,h
          assert h["priceFieldsPresent"] is False,h
          print("GATES_OK",s,h)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: historical-exact-finish-audit
          path: artifacts/variant_finish_audit_report.json
          if-no-files-found: error
