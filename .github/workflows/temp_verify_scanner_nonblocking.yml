name: TEMP Verify Scanner Nonblocking Confirm
on:
  push:
    branches: [fix/scanner-nonblocking-confirm-20260920]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Static regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text()
          start=s.index("async function chooseCard")
          end=s.index("function inferCategory",start)
          choose=s[start:end]
          marker="// V2.1.1 — aggiorna SEMPRE le Prize Pack Series quando cambia carta."
          tail=choose[choose.index(marker):]
          assert "await refreshOfficialPlayAvailability(selectedCard,false,false);" not in tail
          assert "refreshOfficialPlayAvailability(selectedCard,false);" in tail
          assert "renderScanValue(selectedCard);" in tail
          assert "if(!edit && physical.length===1)" in s
          assert "sel.value=physical[0].value;" in s
          assert "sel.dispatchEvent(new Event('change'" not in s[s.index("function syncVariantAvailability"):s.index("function syncVariantAvailability")+2200]
          print("SCANNER_NONBLOCKING_STATIC_OK")
          PY
      - name: JS syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text()
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path("/tmp/cardoryx.js").write_text("\n".join(blocks))
          PY
          node --check /tmp/cardoryx.js
