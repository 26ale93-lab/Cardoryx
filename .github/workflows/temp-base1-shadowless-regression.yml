name: TEMP Base Set Shadowless Regression

on:
  push:
    branches:
      - audit/base1-shadowless-pairs-20260919
    paths:
      - scripts/test_card_identity_cardmarket_audit.py
      - .github/workflows/temp-base1-shadowless-regression.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Git diff check
        run: git diff --check origin/main...HEAD
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --workers 24
      - name: Verify Base Set classification
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/card_identity_cardmarket_audit_report.json").read_text())
          totals=r["classificationTotals"]
          assert totals["P0_WRONG_PRODUCT"] == 0, totals
          assert totals["P1_AMBIGUOUS_PRODUCT"] == 16, totals
          assert totals["SAFE"] == 1921, totals
          assert totals["EXACT_ALTERNATE_PRODUCT"] == 260, totals
          base=[x for x in r["caseIndex"] if x["tcgdexId"].startswith("base1-")]
          exact=[x for x in base if x["classification"]=="EXACT_ALTERNATE_PRODUCT"]
          assert len(exact) == 98, len(exact)
          print(json.dumps({"classificationTotals":totals,"base1ExactAlternate":len(exact)}))
          PY
      - name: Record successful validation
        run: |
          printf 'PASS\ncommit=%s\n' "$GITHUB_SHA" > temp_base1_shadowless_validation.txt
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_base1_shadowless_validation.txt
          git commit -m "TEMP record Base Set Shadowless validation"
          git push
