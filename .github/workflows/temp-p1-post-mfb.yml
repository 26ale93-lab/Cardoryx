name: TEMP P1 post-MFB distribution audit
on:
  push:
    branches: [diagnostic/cardmarket-p1-post-mfb-20260917]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact shared-product resolver anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          needles=['VERIFIED_SHARED_CARDMARKET_PRODUCT_OWNERS','function verifiedSharedCardmarketProductOwner','function resolvedCardmarketPricingForCard','function cardPriceInfo','function cardmarketValueForVariant']
          for needle in needles:
              print('\n===',needle,'===')
              hits=[i for i,l in enumerate(s) if needle in l]
              print('hits',hits)
              for i in hits[:4]:
                  for n in range(max(0,i-20),min(len(s),i+80)):
                      print(f'{n+1}: {s[n]}')
          a=Path('scripts/test_card_identity_cardmarket_audit.py').read_text().splitlines()
          for needle in ['BATCH2_SHARED_PRODUCT_OWNERS = {','elif card_id in BATCH2_SHARED_PRODUCT_OWNERS:']:
              print('\n=== AUDIT',needle,'===')
              hits=[i for i,l in enumerate(a) if needle in l]
              print('hits',hits)
              for i in hits[:3]:
                  for n in range(max(0,i-15),min(len(a),i+70)):
                      print(f'{n+1}: {a[n]}')
          PY
