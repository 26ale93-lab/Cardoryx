name: TEMP Retail Finish Baseline

on:
  push:
    branches:
      - feature/retail-independent-stores-20260923
    paths:
      - .github/workflows/temp-retail-finish-baseline.yml

permissions:
  contents: read

jobs:
  branch-finish-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run branch full deterministic finish audit
        run: python scripts/test_variant_finish_audit.py --output /tmp/branch_finish.json

  main-finish-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run main full deterministic finish audit
        run: python scripts/test_variant_finish_audit.py --output /tmp/main_finish.json
