name: TEMP Celebrations Classic Cardmarket Regression

on:
  push:
    branches:
      - fix/celebrations-classic-cardmarket-20260919
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Git diff check
        run: git diff --check origin/main...HEAD

      - name: Runtime regression
        run: |
          for attempt in 1 2 3; do
            python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Full Cardmarket audit
        run: |
          for attempt in 1 2 3; do
            python3 scripts/test_card_identity_cardmarket_audit.py --workers 24 && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Verify Celebrations Classic corrections
        run: |
          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path

          r=json.loads(Path("artifacts/card_identity_cardmarket_audit_report.json").read_text())
          totals=r["classificationTotals"]
          assert totals["P0_WRONG_PRODUCT"] == 0, totals

          cases={str(x["tcgdexId"]).lower():x for x in r["caseIndex"]}
          print("TARGET_CASE_KEYS", [k for k in cases if k.startswith("cel25cc")])
          for cid in ("cel25cc-cc020","cel25cc-cc021"):
            assert cases[cid]["classification"] == "SAFE", cases[cid]

          spec=importlib.util.spec_from_file_location("auditmod","scripts/test_card_identity_cardmarket_audit.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          source=Path("index.html").read_text()
          overrides=mod.extract_js_object(source,"VERIFIED_BASE_CARDMARKET_PRODUCT_OVERRIDES")
          guides=mod.extract_js_object(source,"VERIFIED_EXACT_CARDMARKET_PRICE_GUIDES")

          expected={
            "cel25cc-cc020":(576747,576790),
            "cel25cc-cc021":(576755,576791),
          }
          values={}
          for cid,(wrong,correct) in expected.items():
            rule=overrides[cid]
            guide=guides[cid]
            assert int(rule["conflictingProduct"]) == wrong, rule
            assert int(rule["baseProduct"]) == correct, rule
            assert int(guide["productId"]) == correct, guide
            assert float(guide["pricing"]["trend"]) > 20, guide
            values[cid]=guide["pricing"]["trend"]

          registry=r["p0Regression"]["registry"]
          for cid in expected:
            assert cid in registry, cid

          print(json.dumps({
            "classificationTotals":totals,
            "resolvedGuides":values,
            "exactOverridesApplied":r["p0Regression"]["exactOverridesApplied"]
          }))
          PY

      - name: Record successful validation
        if: github.event_name == 'push'
        run: |
          printf 'PASS\ncommit=%s\n' "$GITHUB_SHA" > temp_celebrations_classic_validation.txt
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_celebrations_classic_validation.txt
          git commit -m "TEMP record Celebrations Classic validation"
          git push
