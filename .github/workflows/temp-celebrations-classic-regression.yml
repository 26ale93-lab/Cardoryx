name: TEMP Celebrations Classic Cardmarket Regression

on:
  push:
    branches:
      - fix/celebrations-classic-cardmarket-20260919
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Git diff check
        run: git diff --check origin/main...HEAD

      - name: Runtime regression
        run: |
          for attempt in 1 2 3; do
            python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Full Cardmarket audit
        run: |
          for attempt in 1 2 3; do
            python3 scripts/test_card_identity_cardmarket_audit.py --workers 24 && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Verify Celebrations Classic corrections
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/card_identity_cardmarket_audit_report.json").read_text())
          totals=r["classificationTotals"]
          assert totals["P0_WRONG_PRODUCT"] == 0, totals
          assert totals["P1_AMBIGUOUS_PRODUCT"] == 14, totals
          cases={x["tcgdexId"]:x for x in r["caseIndex"]}
          assert cases["cel25cc-CC020"]["classification"] == "SAFE", cases["cel25cc-CC020"]
          assert cases["cel25cc-CC021"]["classification"] == "SAFE", cases["cel25cc-CC021"]
          cards={x["tcgdexId"]:x for x in r.get("cards",[]) if x.get("tcgdexId") in {"cel25cc-CC020","cel25cc-CC021"}}
          for cid,pid in {"cel25cc-CC020":576790,"cel25cc-CC021":576791}.items():
            row=cards[cid]
            assert row["resolvedProductId"] == pid, row
            assert row["resolvedCardoryxValue"] and row["resolvedCardoryxValue"] > 20, row
            guards=row["baseOverrideGuardTests"]
            assert guards["exactIdentityAccepted"] is True, guards
            assert guards["wrongTcgdexIdRejected"] is True, guards
            assert guards["wrongSetIdRejected"] is True, guards
            assert guards["wrongLocalIdRejected"] is True, guards
            assert guards["correctedFutureProductRejected"] is True, guards
          print(json.dumps({
            "classificationTotals":totals,
            "Reshiram":cards["cel25cc-CC020"]["resolvedCardoryxValue"],
            "Zekrom":cards["cel25cc-CC021"]["resolvedCardoryxValue"]
          }))
          PY

      - name: Record successful validation
        if: github.event_name == 'push'
        run: |
          printf 'PASS\ncommit=%s\n' "$GITHUB_SHA" > temp_celebrations_classic_validation.txt
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_celebrations_classic_validation.txt
          git commit -m "TEMP record Celebrations Classic validation"
          git push
