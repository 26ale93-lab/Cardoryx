name: Temporary Cardmarket Audit Live Evidence Validation

on:
  push:
    branches:
      - fix/cardmarket-audit-live-shared-evidence

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Baseline full Cardmarket identity audit
        run: |
          python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
          cp artifacts/card_identity_cardmarket_audit_report.json "$RUNNER_TEMP/baseline_identity_report.json"
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
      - name: Apply audit-only live evidence patch
        run: |
          python -B scripts/temp_patch_cardmarket_audit_live_evidence.py
          python -B -m py_compile scripts/test_card_identity_cardmarket_audit.py
          rm -rf scripts/__pycache__
      - name: Existing runtime regression
        run: python -B scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Post-patch full Cardmarket identity audit
        run: |
          python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
          cp artifacts/card_identity_cardmarket_audit_report.json "$RUNNER_TEMP/post_identity_report.json"
      - name: Require evidence-only P1 recovery and zero regression
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base=json.loads(Path(os.environ['RUNNER_TEMP'],'baseline_identity_report.json').read_text())
          post=json.loads(Path(os.environ['RUNNER_TEMP'],'post_identity_report.json').read_text())
          b=base['classificationTotals']; p=post['classificationTotals']
          evidence=post['liveExactBaseEvidence']
          recovered=b['P1_AMBIGUOUS_PRODUCT']-p['P1_AMBIGUOUS_PRODUCT']
          safe_gain=p['SAFE']-b['SAFE']
          assert b['P0_WRONG_PRODUCT']==0 and p['P0_WRONG_PRODUCT']==0, (b,p)
          assert p['SOURCE_CONFLICT']==b['SOURCE_CONFLICT'], (b,p)
          assert p['EXACT_ALTERNATE_PRODUCT']==b['EXACT_ALTERNATE_PRODUCT'], (b,p)
          assert p['UNMAPPED_EXACT_PRODUCT']==b['UNMAPPED_EXACT_PRODUCT'], (b,p)
          assert recovered>0, (b,p)
          assert recovered==safe_gain, (recovered,safe_gain)
          assert evidence['count']>=recovered, (evidence['count'],recovered)
          assert p['P1_AMBIGUOUS_PRODUCT']>=0
          print('P1',b['P1_AMBIGUOUS_PRODUCT'],'->',p['P1_AMBIGUOUS_PRODUCT'])
          print('SAFE',b['SAFE'],'->',p['SAFE'])
          print('live evidence',evidence['count'],'recovered',recovered)
          print('P0',p['P0_WRONG_PRODUCT'],'SOURCE_CONFLICT',p['SOURCE_CONFLICT'])
          PY
      - name: Verify scope and protected files
        run: |
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git diff --check
          git diff --exit-code HEAD -- index.html data/retail_prices.json data/cardmarket_play_index.json sw.js manifest.webmanifest
          test "$(git diff --name-only HEAD | sort | tr '\n' ' ')" = "scripts/test_card_identity_cardmarket_audit.py "
      - name: Commit validated audit correction
        run: |
          git config user.name "26ale93-lab"
          git config user.email "26ale93@gmail.com"
          git add scripts/test_card_identity_cardmarket_audit.py
          git commit -m "Fix Cardmarket P1 audit with exact live base evidence"
          git push origin HEAD:fix/cardmarket-audit-live-shared-evidence
