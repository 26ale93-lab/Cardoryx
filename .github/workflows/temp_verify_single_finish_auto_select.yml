name: TEMP Verify Single Finish Auto Select
on:
  push:
    branches: [fix/auto-select-single-finish-search-20260920]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Static regression
        run: |
          python3 - <<'PY'
          s=open("index.html").read()
          assert "if(!edit && selectable.length===1)" in s
          assert "await refreshOfficialPlayAvailability(selectedCard,false);" in s
          assert "syncVariantAvailability(selectedCard,false);" in s
          assert "const selectable=[...sel.options].filter" in s
          print("AUTO_SELECT_STATIC_OK")
          PY
      - name: Full variant regression
        run: python3 scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/report.json
      - name: Safety gates
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("artifacts/report.json")); c=r["summary"]["classifications"]
          print(r["summary"])
          assert r["summary"]["totalIdentitiesTested"]==4254
          assert c=={"CORRETTA":4131,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":115,"SOURCE CONFLICT":8},c
          assert r["summary"]["pricingP0"]==0
          print("AUTO_SELECT_GATES_OK")
          PY
