name: TEMP verify exact Regirock SWSH039 primary rows

on:
  push:
    branches:
      - fix/ex5-regirock-swsh039-exact-primary-20260917

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch exact production resolvers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # 1) Regirock ex HL98: exact Cracked Ice row is the standard Holo printing.
          anchor="""  // V2.1.32 — standard Mega Evolution Energies MEE001–008 are the non-stamped\n"""
          insert="""  // Exact EX Hidden Legends Regirock ex 98/101: the standard card is the\n  // Cracked Ice Holo printing. Keep this identity-specific; do not generalize\n  // Cracked Ice to other cards or promo reprints.\n  if(String(card?.tcgdexId||card?.id||'').trim().toLowerCase()==='ex5-98' &&\n     cardSetId(card)==='ex5' && exactLocalIdKey(card?.localId||'')==='98' &&\n     normText(card?.name||'')==='regirockex' && stamp==='None'){\n    const rows=tcgdexVariantDetails(card).filter(row=>{\n      const stamps=Array.isArray(row?.stamp)?row.stamp:[];\n      const pid=Number(row?.thirdParty?.cardmarket||row?.pricing?.cardmarket?.idProduct||row?.pricing?.cardmarket?.id_product||0);\n      const pricingPid=Number(row?.pricing?.cardmarket?.idProduct||row?.pricing?.cardmarket?.id_product||0);\n      return canonicalFinishTypeLabel(row?.type)==='holo' && canonicalFinishFoilLabel(row?.foil)==='crackedice' &&\n             !stamps.length && String(row?.size||'standard').toLowerCase()==='standard' &&\n             pid===276172 && pricingPid===276172;\n    });\n    if(rows.length===1)return new Set(['Holo','Speciale / Altro','Non so']);\n  }\n\n"""
          if anchor not in s: raise SystemExit('documentedVariants anchor missing')
          s=s.replace(anchor,insert+anchor,1)

          # 2) Exact primary special-row resolver for Regirock HL98 + Pikachu SWSH039.
          anchor2="""function cardmarketValueForCardVariant(card,variant){\n"""
          helper="""const VERIFIED_EXACT_PRIMARY_SPECIAL_CARDMARKET_ROWS={\n  'ex5-98':{setId:'ex5',localId:'98',name:'Regirock ex',finish:'Holo',type:'holo',foil:'crackedice',productId:276172},\n  'swshp-SWSH039':{setId:'swshp',localId:'SWSH039',name:'Pikachu',finish:'Cosmos Holo',type:'holo',foil:'cosmos',productId:491189}\n};\nfunction verifiedExactPrimarySpecialCardmarketVariant(card,variant){\n  const id=String(card?.tcgdexId||card?.id||'').trim();\n  const rule=VERIFIED_EXACT_PRIMARY_SPECIAL_CARDMARKET_ROWS[id];\n  if(!rule)return null;\n  if(cardSetId(card)!==rule.setId || exactLocalIdKey(card?.localId||'')!==exactLocalIdKey(rule.localId) ||\n     normText(card?.name||'')!==normText(rule.name) || canonicalVariant(variant||'Normal')!==rule.finish){\n    return {handled:true,matched:false,kind:'needs-exact-variant'};\n  }\n  const rows=tcgdexVariantDetails(card).filter(row=>{\n    const stamps=Array.isArray(row?.stamp)?row.stamp:[];\n    const rowPid=Number(row?.thirdParty?.cardmarket||row?.pricing?.cardmarket?.idProduct||row?.pricing?.cardmarket?.id_product||0);\n    const pricing=row?.pricing?.cardmarket||{};\n    const pricingPid=Number(pricing?.idProduct||pricing?.id_product||0);\n    const usable=['trend','avg7','avg30','avg','low'].some(k=>Number(pricing?.[k]||0)>0);\n    return canonicalFinishTypeLabel(row?.type)===rule.type && canonicalFinishFoilLabel(row?.foil)===rule.foil &&\n           !stamps.length && String(row?.size||'standard').trim().toLowerCase()==='standard' &&\n           rowPid===rule.productId && pricingPid===rule.productId && usable;\n  });\n  if(rows.length!==1)return {handled:true,matched:false,kind:'base-product-price-unavailable'};\n  return {handled:true,matched:true,productId:rule.productId,pricing:rows[0].pricing.cardmarket,finish:rule.finish,\n    source:`Cardmarket · riga fisica primaria esatta ${rule.productId}`};\n}\n\n"""
          if anchor2 not in s: raise SystemExit('value resolver anchor missing')
          s=s.replace(anchor2,helper+anchor2,1)

          old="""function cardmarketValueForCardVariant(card,variant){\n  const dualBase=verifiedDualBaseCardmarketVariant(card,variant);\n"""
          new="""function cardmarketValueForCardVariant(card,variant){\n  const exactPrimary=verifiedExactPrimarySpecialCardmarketVariant(card,variant);\n  if(exactPrimary?.handled){\n    if(!exactPrimary.matched)return {value:0,kind:exactPrimary.kind||'needs-exact-variant'};\n    const p=exactPrimary.pricing||{};\n    const value=['trend','avg7','avg30','avg','low'].map(k=>Number(p[k]||0)).find(x=>Number.isFinite(x)&&x>0)||0;\n    return {value,kind:'exact-primary-special-cardmarket',exact:true,productId:exactPrimary.productId,source:exactPrimary.source};\n  }\n  const dualBase=verifiedDualBaseCardmarketVariant(card,variant);\n"""
          if old not in s: raise SystemExit('value insertion anchor missing')
          s=s.replace(old,new,1)

          old2="""function cardmarketStatsForCardVariant(card,variant){\n  const dualBase=verifiedDualBaseCardmarketVariant(card,variant);\n"""
          new2="""function cardmarketStatsForCardVariant(card,variant){\n  const exactPrimary=verifiedExactPrimarySpecialCardmarketVariant(card,variant);\n  if(exactPrimary?.handled){\n    if(!exactPrimary.matched)return {low:null,trend:null,avg7:null,avg30:null};\n    const p=exactPrimary.pricing||{};\n    return {low:p.low??null,trend:p.trend??null,avg7:p.avg7??null,avg30:p.avg30??null};\n  }\n  const dualBase=verifiedDualBaseCardmarketVariant(card,variant);\n"""
          if old2 not in s: raise SystemExit('stats insertion anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git diff --check

      - name: Patch exact audit evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          s=p.read_text()

          const_anchor="""VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS = {\n"""
          const="""VERIFIED_PRIMARY_SPECIAL_CARDMARKET_ROWS = {\n    "ex5-98": {"setId":"ex5","localId":"98","name":"Regirock ex","primary":276172,"primaryType":"holo","primaryFoil":"cracked-ice","primaryStamp":[],"alternate":869536,"alternateType":"normal","alternateFoil":"","alternateStamp":["jason-klaczynski"]},\n    "swshp-SWSH039": {"setId":"swshp","localId":"SWSH039","name":"Pikachu","primary":491189,"primaryType":"holo","primaryFoil":"cosmos","primaryStamp":[],"alternate":549406,"alternateType":"holo","alternateFoil":"","alternateStamp":["25th-celebration"]},\n}\n"""
          if const_anchor not in s: raise SystemExit('constant anchor missing')
          s=s.replace(const_anchor,const+const_anchor,1)

          old_live="""                    set(VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS) |\n                    {\"sv09-055\", \"me01-073\"} |\n"""
          new_live="""                    set(VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS) | set(VERIFIED_PRIMARY_SPECIAL_CARDMARKET_ROWS) |\n                    {\"sv09-055\", \"me01-073\"} |\n"""
          if old_live not in s: raise SystemExit('live target anchor missing')
          s=s.replace(old_live,new_live,1)

          anchor="""        exact_standard_jumbo_pair = False\n"""
          block="""        exact_primary_special_pair = False\n        exact_primary_special_products = None\n        if card_id in VERIFIED_PRIMARY_SPECIAL_CARDMARKET_ROWS:\n            rule = VERIFIED_PRIMARY_SPECIAL_CARDMARKET_ROWS[card_id]\n            identity_ok = bool(\n                (card.get(\"set\") or {}).get(\"id\") == rule[\"setId\"] and\n                norm_local(card.get(\"localId\")) == norm_local(rule[\"localId\"]) and\n                card_identity(card).get(\"name\") == rule[\"name\"]\n            )\n            def exact_special_row(pid, row_type, foil, stamp):\n                matches=[]\n                for row in live_card_detail.get(\"variants_detailed\") or []:\n                    row_stamp=row.get(\"stamp\") or []\n                    if isinstance(row_stamp,str): row_stamp=[row_stamp]\n                    pricing_cm=((row.get(\"pricing\") or {}).get(\"cardmarket\") or {})\n                    try: pricing_pid=int(pricing_cm.get(\"idProduct\") or pricing_cm.get(\"id_product\"))\n                    except (TypeError,ValueError): pricing_pid=None\n                    usable=any(isinstance(pricing_cm.get(k),(int,float)) and pricing_cm.get(k)>0 for k in (\"trend\",\"avg7\",\"avg30\",\"avg\",\"low\"))\n                    if (cm_id(row)==pid and pricing_pid==pid and usable and\n                        str(row.get(\"type\") or \"\").strip().lower()==row_type and\n                        str(row.get(\"foil\") or \"\").strip().lower()==foil and\n                        sorted(map(str,row_stamp))==sorted(map(str,stamp)) and\n                        str(row.get(\"size\") or \"standard\").strip().lower()==\"standard\"):\n                        matches.append(row)\n                return matches\n            primary_rows=exact_special_row(rule[\"primary\"],rule[\"primaryType\"],rule[\"primaryFoil\"],rule[\"primaryStamp\"])\n            alternate_rows=exact_special_row(rule[\"alternate\"],rule[\"alternateType\"],rule[\"alternateFoil\"],rule[\"alternateStamp\"])\n            pp,pa=products.get(rule[\"primary\"]),products.get(rule[\"alternate\"])\n            gp,ga=prices.get(rule[\"primary\"]),prices.get(rule[\"alternate\"])\n            catalogue_ok=bool(pp and pa and pp.get(\"idMetacard\")==pa.get(\"idMetacard\") and pp.get(\"name\")==pa.get(\"name\"))\n            guides_ok=bool(gp and ga and int(gp.get(\"idProduct\") or 0)==rule[\"primary\"] and int(ga.get(\"idProduct\") or 0)==rule[\"alternate\"])\n            exact_primary_special_pair=bool(\n                identity_ok and current_pid==rule[\"primary\"] and set(ids)=={rule[\"primary\"],rule[\"alternate\"]} and\n                len(primary_rows)==1 and len(alternate_rows)==1 and catalogue_ok and guides_ok\n            )\n            if exact_primary_special_pair:\n                exact_primary_special_products={\"primary\":rule[\"primary\"],\"alternate\":rule[\"alternate\"]}\n\n"""
          if anchor not in s: raise SystemExit('evidence anchor missing')
          s=s.replace(anchor,block+anchor,1)

          class_anchor="""        elif card_id in VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS:\n"""
          class_block="""        elif card_id in VERIFIED_PRIMARY_SPECIAL_CARDMARKET_ROWS:\n            if exact_primary_special_pair and \"VERIFIED_EXACT_PRIMARY_SPECIAL_CARDMARKET_ROWS\" in source:\n                rule=VERIFIED_PRIMARY_SPECIAL_CARDMARKET_ROWS[card_id]\n                classification, priority, confidence = \"SAFE\", None, \"HIGH\"\n                resolved_pid=rule[\"primary\"]\n                resolved_value=(prices.get(rule[\"primary\"]) or {}).get(\"trend\")\n                reason=(\"TCGdex live separa la stampa primaria non timbrata dalla ristampa/promozionale esplicita; \"\n                        \"entrambe hanno productId e Price Guide propri e il runtime risolve solo la riga fisica primaria esatta.\")\n                action=\"Mantenere il resolver esatto per la riga primaria; nessun fallback verso la stampa alternativa.\"\n            else:\n                classification, priority, confidence = \"P1_AMBIGUOUS_PRODUCT\", \"P1\", \"LOW\"\n                reason=\"La coppia primaria/promozionale registrata non supera più tutti i gate esatti.\"\n                action=\"Fail-closed e nuova verifica delle fonti; nessuna euristica di finitura o ristampa.\"\n        elif card_id in VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS:\n"""
          if class_anchor not in s: raise SystemExit('classification anchor missing')
          s=s.replace(class_anchor,class_block,1)

          report_anchor='''            "verifiedStandardJumboPair": exact_standard_jumbo_pair,\n'''
          report_new='''            "verifiedPrimarySpecialPair": exact_primary_special_pair,\n            "verifiedPrimarySpecialProducts": exact_primary_special_products,\n            "verifiedStandardJumboPair": exact_standard_jumbo_pair,\n'''
          if report_anchor not in s: raise SystemExit('report anchor missing')
          s=s.replace(report_anchor,report_new,1)
          p.write_text(s)
          PY
          git diff --check

      - name: Commit production and audit change, remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-verify-ex5-regirock-swsh039.yml
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m 'Resolve exact primary Regirock and Pikachu promo rows'
          git push origin HEAD:fix/ex5-regirock-swsh039-exact-primary-20260917

      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only

      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database

      - name: Focused exact-row runtime assertions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, subprocess
          from pathlib import Path
          src=Path('index.html').read_text()
          def fn(name):
              m=re.search(rf'\bfunction\s+{re.escape(name)}\s*\(',src)
              if not m: raise SystemExit('missing '+name)
              b=src.find('{',m.end()); d=0; q=None; esc=False
              for i in range(b,len(src)):
                  ch=src[i]
                  if q:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==q: q=None
                      continue
                  if ch in "'\"`": q=ch
                  elif ch=='{': d+=1
                  elif ch=='}':
                      d-=1
                      if d==0:return src[m.start():i+1]
              raise SystemExit('unclosed '+name)
          names=['normText','cardSetId','exactLocalIdKey','canonicalVariant','canonicalFinishTypeLabel','canonicalFinishFoilLabel','tcgdexVariantDetails','verifiedExactPrimarySpecialCardmarketVariant']
          js='\n'.join(fn(n) for n in names)
          cards={}
          for cid in ('ex5-98','swshp-SWSH039'):
              with urllib.request.urlopen('https://api.tcgdex.net/v2/en/cards/'+cid,timeout=60) as r: cards[cid]=json.load(r)
          harness=r'''
          const cards=JSON.parse(process.argv[1]);
          function fail(m){throw new Error(m)}
          const r=verifiedExactPrimarySpecialCardmarketVariant(cards['ex5-98'],'Holo');
          if(!r?.matched||Number(r.productId)!==276172||Number(r.pricing?.trend||0)<=0)fail('Regirock exact primary resolver failed');
          if(verifiedExactPrimarySpecialCardmarketVariant(cards['ex5-98'],'Normal')?.matched)fail('Regirock wrong finish accepted');
          const p=verifiedExactPrimarySpecialCardmarketVariant(cards['swshp-SWSH039'],'Cosmos Holo');
          if(!p?.matched||Number(p.productId)!==491189||Number(p.pricing?.trend||0)<=0)fail('SWSH039 Cosmos resolver failed');
          if(verifiedExactPrimarySpecialCardmarketVariant(cards['swshp-SWSH039'],'Holo')?.matched)fail('SWSH039 generic Holo accepted');
          process.stdout.write(JSON.stringify({regirock:{pid:r.productId,trend:r.pricing.trend},pikachu:{pid:p.productId,trend:p.pricing.trend}}));
          '''
          out=subprocess.check_output(['node','-e',js+'\n'+harness,json.dumps(cards)],text=True)
          print(out)
          PY

      - name: Assert exact audit delta and scope
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          expected={'SAFE':1774,'EXACT_ALTERNATE_PRODUCT':156,'P0_WRONG_PRODUCT':0,'P1_AMBIGUOUS_PRODUCT':267,'SOURCE_CONFLICT':7,'UNMAPPED_EXACT_PRODUCT':0}
          if r['classificationTotals']!=expected: raise SystemExit(f"unexpected totals {r['classificationTotals']} != {expected}")
          idx={x['tcgdexId']:x for x in r['caseIndex']}
          for cid in ('ex5-98','swshp-SWSH039'):
              if idx.get(cid,{}).get('classification')!='SAFE': raise SystemExit(f'{cid} not SAFE: {idx.get(cid)}')
          print(json.dumps({'totals':r['classificationTotals'],'verified':['ex5-98','swshp-SWSH039']},indent=2))
          PY
          git diff --check
