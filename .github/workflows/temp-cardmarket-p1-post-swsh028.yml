name: Temporary Gym Challenge Taxonomy Audit

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-post-swsh028-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Audit Gym Challenge taxonomy
        env:
          TCGDEX_DB: ${{ runner.temp }}/tcgdex-cards-database
        run: python -B scripts/temp_gym_challenge_taxonomy_audit.py
      - name: Read-only safety
        run: git diff --exit-code
