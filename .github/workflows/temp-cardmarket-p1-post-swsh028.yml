name: Temporary Cardmarket P1 Post-SWSH028 Audit

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-post-swsh028-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Full Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Audit EX Hidden Legends residuals
        run: python -B scripts/temp_ex5_cardmarket_audit.py
      - name: Group residual P1 by set
        run: python -B scripts/temp_cardmarket_p1_cluster_audit.py
      - name: Restore generated report
        run: git checkout -- artifacts/card_identity_cardmarket_audit_report.json
      - name: Read-only safety
        run: |
          git diff --exit-code
