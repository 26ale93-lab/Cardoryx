name: TEMP Residual 119 Next
on:
  push:
    branches: [diagnostic/residual-119-next-20260920]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - run: python3 scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/report.json
      - name: Residual groups
        run: |
          python3 - <<'PY'
          import json,collections
          r=json.load(open("artifacts/report.json"))
          print("SUMMARY",r["summary"])
          ex=(r.get("normalHoloReverseAudit") or {}).get("exceptions") or []
          amb=[x for x in ex if x.get("classification")=="AMBIGUA"]
          print("NHR_AMBIG",len(amb))
          g=collections.defaultdict(list)
          for x in amb:g[x["tcgdexId"].split("-")[0]].append(x["tcgdexId"])
          for k,v in sorted(g.items()):print("GROUP",k,len(v),v)
          PY
