name: TEMP pl3 AR exact source audit
on:
  push:
    branches: [diagnostic/residual-base1-after-pr66-20260918]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Inspect Platinum Arceus AR1-AR9 exact source
        run: |
          python3 - <<'PY'
          import pathlib,re,json,urllib.request,tempfile,collections
          root=pathlib.Path('../tcgdex-cards-database/data/Platinum/Arceus')
          cards=[]
          for i in range(1,10):
              fn=root/f'AR{i}.ts'
              txt=fn.read_text(encoding='utf-8')
              def grab(p):
                  m=re.search(p,txt,re.M|re.S)
                  return m.group(1).strip() if m else None
              name=grab(r"name:\s*['\"]([^'\"]+)['\"]")
              local=grab(r"localId:\s*['\"]([^'\"]+)['\"]")
              rarity=grab(r"rarity:\s*['\"]([^'\"]+)['\"]")
              pids=sorted({int(x) for x in re.findall(r'idProduct:\s*(\d+)',txt)} | {int(x) for x in re.findall(r'cardmarket:\s*(\d+)',txt)})
              print('AR_SOURCE',json.dumps({'file':str(fn),'name':name,'localId':local,'rarity':rarity,'productIds':pids,'raw':txt},ensure_ascii=False))
              cards.append((name,pids))
          pids={p for _,ps in cards for p in ps}
          headers={'User-Agent':'Cardoryx-Cardmarket-Identity-Audit/2.1'}
          def dl(section,name):
              p=pathlib.Path(tempfile.gettempdir())/name
              req=urllib.request.Request('https://downloads.s3.cardmarket.com/productCatalog/'+section+'/'+name,headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r,p.open('wb') as out:
                  while True:
                      ch=r.read(1024*1024)
                      if not ch: break
                      out.write(ch)
              return json.load(open(p))
          prod=dl('productList','products_singles_6.json'); price=dl('priceGuide','price_guide_6.json')
          prows=prod if isinstance(prod,list) else prod.get('products',[])
          selected=[r for r in prows if int(r.get('idProduct') or 0) in pids]
          expids=collections.Counter(int(r.get('idExpansion') or 0) for r in selected)
          print('EXPANSIONS',json.dumps(expids))
          for r in selected: print('CM_PRODUCT',json.dumps(r,ensure_ascii=False,sort_keys=True))
          names={n.casefold() for n,_ in cards if n}
          for r in prows:
              if int(r.get('idExpansion') or 0) in expids:
                  base=str(r.get('name') or '').split(' [',1)[0].casefold()
                  if base in names:
                      print('CM_NAME_CANDIDATE',json.dumps(r,ensure_ascii=False,sort_keys=True))
          bymeta=collections.defaultdict(list)
          for r in prows:
              if int(r.get('idExpansion') or 0) in expids:
                  mid=int(r.get('idMetacard') or 0)
                  if mid: bymeta[mid].append(r)
          touched=set(pids)
          for mid,vals in bymeta.items():
              if any(int(v.get('idProduct') or 0) in touched for v in vals):
                  print('DUP_META',mid,json.dumps([{'idProduct':v.get('idProduct'),'name':v.get('name')} for v in vals],ensure_ascii=False))
                  touched.update(int(v.get('idProduct') or 0) for v in vals)
          price_rows=price if isinstance(price,list) else price.get('priceGuides',price.get('priceGuide',[]))
          for r in price_rows:
              if int(r.get('idProduct') or 0) in touched:
                  print('CM_PRICE',json.dumps(r,sort_keys=True))
          PY
