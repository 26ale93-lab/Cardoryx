name: TEMP pl3 Arceus catalogue audit
on:
  push:
    branches: [diagnostic/residual-base1-after-pr66-20260918]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact Arceus catalogue candidates
        run: |
          python3 - <<'PY'
          import json, pathlib, tempfile, urllib.request
          headers={'User-Agent':'Cardoryx-Cardmarket-Identity-Audit/2.0'}
          def dl(section,name):
              p=pathlib.Path(tempfile.gettempdir())/name
              req=urllib.request.Request('https://downloads.s3.cardmarket.com/productCatalog/'+section+'/'+name,headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r,p.open('wb') as out:
                  while chunk:=r.read(1024*1024): out.write(chunk)
              return json.load(open(p))
          def rows(root,keys):
              if isinstance(root,list): return root
              for k in keys:
                  v=root.get(k) if isinstance(root,dict) else None
                  if isinstance(v,list): return v
              return []
          prod=dl('productList','products_singles_6.json')
          price=dl('priceGuide','price_guide_6.json')
          products=rows(prod,('products',))
          candidates=[r for r in products if int(r.get('idExpansion') or 0)==1565 and 'arceus' in str(r.get('name') or '').casefold()]
          print('ARCEUS_CANDIDATE_COUNT',len(candidates))
          pids={int(r['idProduct']) for r in candidates}
          for r in candidates:
              print('ARCEUS_CM_PRODUCT',json.dumps(r,ensure_ascii=False,sort_keys=True))
          for r in rows(price,('priceGuides','priceGuide')):
              if int(r.get('idProduct') or 0) in pids:
                  keep={k:r.get(k) for k in ('idProduct','avg','low','trend','avg1','avg7','avg30','avg-holo','low-holo','trend-holo','avg1-holo','avg7-holo','avg30-holo')}
                  print('ARCEUS_CM_PRICE',json.dumps(keep,sort_keys=True))
          if len(candidates)<9:
              raise SystemExit('FAIL_CLOSED: fewer than 9 Arceus candidates in expansion 1565')
          PY
