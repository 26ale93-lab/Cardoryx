name: TEMP pl3 AR Cardmarket exact catalog
on:
  push:
    branches: [diagnostic/residual-base1-after-pr66-20260918]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact Cardmarket Arceus products in expansion 1565
        run: |
          python3 - <<'PY'
          import json, urllib.request, tempfile, pathlib
          headers={'User-Agent':'Cardoryx-Cardmarket-Identity-Audit/2.2'}
          def dl(section,name):
              p=pathlib.Path(tempfile.gettempdir())/name
              req=urllib.request.Request('https://downloads.s3.cardmarket.com/productCatalog/'+section+'/'+name,headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r,p.open('wb') as out:
                  while True:
                      ch=r.read(1024*1024)
                      if not ch: break
                      out.write(ch)
              return json.load(open(p))
          prod=dl('productList','products_singles_6.json')
          price=dl('priceGuide','price_guide_6.json')
          prows=prod if isinstance(prod,list) else prod.get('products',[])
          rows=[r for r in prows if int(r.get('idExpansion') or 0)==1565 and 'arceus' in str(r.get('name') or '').casefold()]
          print('COUNT',len(rows))
          ids=set()
          for r in rows:
              ids.add(int(r.get('idProduct') or 0))
              print('CM_ARCEUS',json.dumps(r,ensure_ascii=False,sort_keys=True))
          prices=price if isinstance(price,list) else price.get('priceGuides',price.get('priceGuide',[]))
          for r in prices:
              if int(r.get('idProduct') or 0) in ids:
                  keep={k:r.get(k) for k in ('idProduct','avg','low','trend','avg1','avg7','avg30','avg-holo','low-holo','trend-holo','avg1-holo','avg7-holo','avg30-holo')}
                  print('CM_PRICE',json.dumps(keep,sort_keys=True))
          PY
