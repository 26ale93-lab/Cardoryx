name: TEMP pl3 AR set identity diagnostic
on:
  push:
    branches: [fix/pl3-ar-cardmarket-products-20260918]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Print Platinum set ids and AR4 sources
        run: |
          echo "===== SET DEFINITIONS ====="
          grep -nE "id:|name:|serie:" "../tcgdex-cards-database/data/Platinum/Arceus.ts" || true
          grep -nE "id:|name:|serie:" "../tcgdex-cards-database/data/Platinum/Supreme Victors.ts" || true
          echo "===== ARCEUS/AR4 ====="
          cat "../tcgdex-cards-database/data/Platinum/Arceus/AR4.ts"
          echo "===== SUPREME VICTORS/AR4 ====="
          cat "../tcgdex-cards-database/data/Platinum/Supreme Victors/AR4.ts"
