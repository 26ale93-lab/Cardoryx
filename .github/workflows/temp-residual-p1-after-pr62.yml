name: TEMP base3 exact page mapping
on:
  push:
    branches: [diagnostic/residual-p1-after-pr62-20260918]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Fossil card-number to Cardmarket product mapping
        run: |
          python3 - <<'PY'
          import urllib.request
          headers={'User-Agent':'Mozilla/5.0 Cardoryx-Identity-Audit/2.0'}
          names=['aerodactyl','articuno','ditto','dragonite','gengar','haunter','hitmonlee','hypno','kabutops','lapras','magneton','moltres','muk','raichu','zapdos']
          expected=[]
          for i,slug in enumerate(names,1):
              expected.append((slug,i,273861+i))
              expected.append((slug,i+15,273876+i))
          bad=[]
          for slug,num,pid in expected:
              u=f'https://www.tcggo.com/pokemon/fossil/{slug}-{num}'
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=30) as r:
                      t=r.read().decode('utf-8','ignore')
                  # Search every product id from the paired metacard, not only expected.
                  pair=(pid+15 if num<=15 else pid-15)
                  cands={pid,pair}
                  if slug=='aerodactyl': cands.add(275573)
                  hits=sorted(p for p in cands if str(p) in t)
                  ok=hits==[pid]
                  print('PAGE_MAP',slug,num,'expected',pid,'hits',hits,'OK' if ok else 'BAD')
                  if not ok: bad.append((u,pid,hits))
              except Exception as e:
                  print('PAGE_MAP_ERROR',u,repr(e));bad.append((u,pid,[]))
          print('PAGE_MAP_BAD_COUNT',len(bad))
          if bad: print('PAGE_MAP_BAD',bad)
          PY
