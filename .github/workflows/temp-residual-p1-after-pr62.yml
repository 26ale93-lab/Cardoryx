name: TEMP base3 exact page verification
on:
  push:
    branches: [diagnostic/residual-p1-after-pr62-20260918]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Fossil numbered cards and Aerodactyl extra product
        run: |
          python3 - <<'PY'
          import urllib.request
          headers={'User-Agent':'Mozilla/5.0 Cardoryx-Identity-Audit/2.0'}
          pairs=[
            ('aerodactyl',1,16,273862,273877),
            ('articuno',2,17,273863,273878),
            ('ditto',3,18,273864,273879),
            ('dragonite',4,19,273865,273880),
            ('gengar',5,20,273866,273881),
            ('haunter',6,21,273867,273882),
            ('hitmonlee',7,22,273868,273883),
            ('hypno',8,23,273869,273884),
            ('kabutops',9,24,273870,273885),
            ('lapras',10,25,273871,273886),
            ('magneton',11,26,273872,273887),
            ('moltres',12,27,273873,273888),
            ('muk',13,28,273874,273889),
            ('raichu',14,29,273875,273890),
            ('zapdos',15,30,273876,273891),
          ]
          bad=[]
          for slug,a,b,p1,p2 in pairs:
              for num,expected,cands in ((a,p1,(p1,p2)),(b,p2,(p1,p2))):
                  u=f'https://www.tcggo.com/pokemon/fossil/{slug}-{num}'
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=30) as r:t=r.read().decode('utf-8','ignore')
                      hits=[p for p in cands if str(p) in t]
                      ok=expected in hits and len(hits)==1
                      print('PAGE_MAP',slug,num,'expected',expected,'hits',hits,'OK' if ok else 'BAD')
                      if not ok: bad.append((u,expected,hits))
                  except Exception as e:
                      print('PAGE_MAP_ERROR',u,repr(e)); bad.append((u,expected,[]))
          print('PAGE_MAP_BAD_COUNT',len(bad))
          if bad: print('PAGE_MAP_BAD',bad)
          for u in [
            'https://www.tcggo.com/pokemon/fossil/aerodactyl-1',
            'https://www.tcggo.com/pokemon/wizards-black-star-promos/aerodactyl-1',
          ]:
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=30) as r:t=r.read().decode('utf-8','ignore')
                  print('AERODACTYL_PAGE',u,'275573' if '275573' in t else 'NO_275573','len',len(t))
              except Exception as e: print('AERODACTYL_PAGE_ERROR',u,repr(e))
          PY
