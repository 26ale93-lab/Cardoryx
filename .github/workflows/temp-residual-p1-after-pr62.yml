name: TEMP pl3 residual audit
on:
  push:
    branches: [diagnostic/residual-base1-after-pr66-20260918]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Run full audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Audit all pl3 residuals
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, urllib.request, tempfile, collections, os
          report=json.load(open('artifacts/card_identity_cardmarket_audit_report.json'))
          ids=sorted(x for x in (report.get('p1AmbiguousProductIds') or []) if x.startswith('pl3-'))
          print('PL3_COUNT',len(ids)); print('PL3_IDS',json.dumps(ids))
          root='../tcgdex-cards-database'
          pids=set(); names=set()
          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for v in obj.values(): yield from walk(v)
              elif isinstance(obj,list):
                  for v in obj: yield from walk(v)
          for cid in ids:
              cp=subprocess.run(['grep','-R','-l','--include=*.json',cid,root],capture_output=True,text=True)
              files=[x for x in cp.stdout.splitlines() if x.strip()]
              print('LOCAL_FILES',cid,json.dumps(files[:20]))
              found=[]
              for fn in files[:20]:
                  try: data=json.load(open(fn,encoding='utf-8'))
                  except Exception: continue
                  for o in walk(data):
                      if str(o.get('id') or '')==cid:
                          found.append((fn,o))
              if not found:
                  print('LOCAL_NOT_FOUND',cid)
                  continue
              for fn,c in found:
                  name=c.get('name')
                  if isinstance(name,dict): name=name.get('en') or next(iter(name.values()),None)
                  names.add(str(name or ''))
                  top=((c.get('pricing') or {}).get('cardmarket') or {})
                  if top.get('idProduct'): pids.add(int(top['idProduct']))
                  rows=[]
                  for x in c.get('variants_detailed') or []:
                      cm=((x.get('pricing') or {}).get('cardmarket') or {})
                      pid=((x.get('thirdParty') or {}).get('cardmarket'))
                      if pid: pids.add(int(pid))
                      rows.append({'type':x.get('type'),'subtype':x.get('subtype'),'foil':x.get('foil'),'stamp':x.get('stamp'),'size':x.get('size'),'firstEdition':x.get('firstEdition'),'pid':pid,'ppid':cm.get('idProduct') or cm.get('id_product')})
                  print('LOCAL_CARD',json.dumps({'file':fn,'id':cid,'name':name,'localId':c.get('localId'),'set':c.get('set'),'rarity':c.get('rarity'),'top':top.get('idProduct'),'variants':c.get('variants'),'rows':rows},ensure_ascii=False,sort_keys=True))
          headers={'User-Agent':'Cardoryx-Cardmarket-Identity-Audit/2.0'}
          def dl(section,name):
              p=pathlib.Path(tempfile.gettempdir())/name
              req=urllib.request.Request('https://downloads.s3.cardmarket.com/productCatalog/'+section+'/'+name,headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r,p.open('wb') as out:
                  while chunk:=r.read(1024*1024): out.write(chunk)
              return json.load(open(p))
          def rows(root,keys):
              if isinstance(root,list): return root
              for k in keys:
                  v=root.get(k) if isinstance(root,dict) else None
                  if isinstance(v,list): return v
              return []
          prod=dl('productList','products_singles_6.json'); price=dl('priceGuide','price_guide_6.json')
          products=rows(prod,('products',))
          selected=[r for r in products if int(r.get('idProduct') or 0) in pids]
          expids=collections.Counter(int(r.get('idExpansion') or 0) for r in selected)
          print('EXPANSIONS',json.dumps(expids))
          for r in selected: print('CM_PRODUCT',json.dumps(r,ensure_ascii=False,sort_keys=True))
          exps=set(expids)
          exp_rows=[r for r in products if int(r.get('idExpansion') or 0) in exps]
          # names from local DB: expose every exact-name catalogue candidate in touched expansions
          norm=lambda s:' '.join(str(s or '').casefold().split())
          nset={norm(x) for x in names if x}
          for r in exp_rows:
              base=str(r.get('name') or '').split(' [',1)[0]
              if norm(base) in nset and int(r.get('idProduct') or 0) not in pids:
                  print('CM_NAME_CANDIDATE',json.dumps(r,ensure_ascii=False,sort_keys=True))
                  pids.add(int(r.get('idProduct') or 0))
          bymeta=collections.defaultdict(list)
          for r in exp_rows:
              mid=int(r.get('idMetacard') or 0)
              if mid: bymeta[mid].append(r)
          for mid,vals in sorted(bymeta.items()):
              if len(vals)>1 and any(int(v.get('idProduct') or 0) in pids for v in vals):
                  print('DUP_META',mid,json.dumps([{'idProduct':v.get('idProduct'),'idExpansion':v.get('idExpansion'),'name':v.get('name')} for v in vals],ensure_ascii=False,sort_keys=True))
                  for v in vals: pids.add(int(v.get('idProduct') or 0))
          for r in rows(price,('priceGuides','priceGuide')):
              pid=int(r.get('idProduct') or 0)
              if pid in pids:
                  keep={k:r.get(k) for k in ('idProduct','avg','low','trend','avg1','avg7','avg30','avg-holo','low-holo','trend-holo','avg1-holo','avg7-holo','avg30-holo')}
                  print('CM_PRICE',json.dumps(keep,sort_keys=True))
          PY
