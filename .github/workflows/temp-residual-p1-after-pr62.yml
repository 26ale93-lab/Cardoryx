name: TEMP pl3 AR production regression
on:
  push:
    branches: [fix/pl3-ar-cardmarket-products-20260918]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Runtime-only Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only --tcgdex-db ../tcgdex-cards-database
      - name: Restore generated audit report
        run: git restore artifacts/card_identity_cardmarket_audit_report.json 2>/dev/null || true
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Print protected counters and pl3 residuals
        run: |
          python3 - <<'PY'
          import json
          p='artifacts/card_identity_cardmarket_audit_report.json'
          d=json.load(open(p))
          print('SUMMARY',json.dumps(d.get('summary') or {},sort_keys=True))
          rows=d.get('cases') or d.get('cards') or []
          pl3=[r for r in rows if str(r.get('tcgdexId') or r.get('id') or '').lower().startswith('pl3-') and r.get('classification')=='P1_AMBIGUOUS_PRODUCT']
          print('PL3_P1_COUNT',len(pl3))
          print('PL3_P1_IDS',[r.get('tcgdexId') or r.get('id') for r in pl3])
          ar=[r for r in rows if str(r.get('tcgdexId') or r.get('id') or '').lower().startswith('pl3-ar')]
          print('PL3_AR_CASES',json.dumps(ar,ensure_ascii=False,sort_keys=True))
          PY
      - name: 30th anniversary regression
        run: python3 scripts/test_30th_anniversary_finish_stamp.py
      - name: Diff check
        run: git diff --check
