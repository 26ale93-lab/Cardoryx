name: TEMP pl3 AR source locator
on:
  push:
    branches: [diagnostic/residual-base1-after-pr66-20260918]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Locate AR1-AR9 source files
        run: |
          for n in 1 2 3 4 5 6 7 8 9; do
            echo "===== AR${n} PATHS ====="
            find ../tcgdex-cards-database/data -type f -name "AR${n}.ts" -print
          done
