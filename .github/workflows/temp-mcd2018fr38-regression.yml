name: TEMP McDonalds 2018 FR 38 Regression

on:
  push:
    branches:
      - fix/mcdonalds-2018-fr-38-cardmarket-20260919
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Git diff check
        run: git diff --check origin/main...HEAD

      - name: Runtime regression
        run: |
          for attempt in 1 2 3; do
            python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Full Cardmarket audit
        run: |
          for attempt in 1 2 3; do
            python3 scripts/test_card_identity_cardmarket_audit.py --workers 24 && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Verify exact McDonalds identities
        run: |
          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path

          report=json.loads(Path("artifacts/card_identity_cardmarket_audit_report.json").read_text())
          totals=report["classificationTotals"]
          assert totals["P0_WRONG_PRODUCT"] == 0, totals
          cases={str(x["tcgdexId"]).lower():x for x in report["caseIndex"]}

          for cid in ("2018sm-fr-38","2018sm-fr-39"):
              assert cid in cases, cid
              assert cases[cid]["classification"] == "SAFE", cases[cid]

          c38=cases["2018sm-fr-38"]
          c39=cases["2018sm-fr-39"]
          assert int(c38.get("resolvedProductId") or 0) == 362809, c38
          assert int(c39.get("resolvedProductId") or c39.get("currentProductId") or 0) == 362810, c39

          spec=importlib.util.spec_from_file_location("auditmod","scripts/test_card_identity_cardmarket_audit.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          source=Path("index.html").read_text()
          overrides=mod.extract_js_object(source,"VERIFIED_BASE_CARDMARKET_PRODUCT_OVERRIDES")
          owners=mod.extract_js_object(source,"VERIFIED_SHARED_CARDMARKET_PRODUCT_OWNERS")
          guides=mod.extract_js_object(source,"VERIFIED_EXACT_CARDMARKET_PRICE_GUIDES")

          rule=overrides["2018sm-fr-38"]
          assert int(rule["conflictingProduct"]) == 362810, rule
          assert int(rule["baseProduct"]) == 362809, rule
          assert int(guides["2018sm-fr-38"]["productId"]) == 362809
          assert float(guides["2018sm-fr-38"]["pricing"]["trend"]) == 0.46
          assert int(owners["2018sm-fr-39"]["productId"]) == 362810

          print(json.dumps({
              "classificationTotals":totals,
              "lillipup":{"classification":c38["classification"],"resolvedProductId":c38.get("resolvedProductId")},
              "fletchling":{"classification":c39["classification"],"resolvedProductId":c39.get("resolvedProductId") or c39.get("currentProductId")}
          }))
          PY

      - name: Record successful validation
        if: github.event_name == 'push'
        run: |
          printf 'PASS\ncommit=%s\n' "$GITHUB_SHA" > temp_mcd2018fr38_validation.txt
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_mcd2018fr38_validation.txt
          git commit -m "TEMP record McDonalds 2018 FR validation"
          git push
