name: TEMP Verify ex5-98 Cracked Ice Finish

on:
  push:
    branches:
      - audit/classify-ex5-98-cracked-ice-20260920

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cardoryx
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout TCGdex cards database
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Run full audit
        run: |
          python3 scripts/test_variant_finish_audit.py \
            --tcgdex-db tcgdex-cards-database \
            --output artifacts/variant_finish_audit_report.json
      - name: Enforce ex5-98-only impact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/variant_finish_audit_report.json").read_text())
          c=r["summary"]["classifications"]
          x=r["exactPrimarySpecialFinishClassification"]
          assert r["summary"]["totalIdentitiesTested"] == 4254, r["summary"]
          assert c["CORRETTA"] == 3944, c
          assert c["AMBIGUA"] == 302, c
          assert c["FALSO POSITIVO"] == 0, c
          assert c["FALSO NEGATIVO"] == 0, c
          assert c["SOURCE CONFLICT"] == 8, c
          assert r["summary"]["pricingP0"] == 0, r["summary"]
          assert x["classifiedCorrect"] is True, x
          assert x["tcgdexId"] == "ex5-98", x
          assert x["finish"] == "Holo" and x["foil"] == "cracked-ice", x
          assert x["productId"] == 276172, x
          assert x["productionModified"] is False, x
          print(json.dumps({"summary":r["summary"],"ex5":x},ensure_ascii=False,indent=2))
          PY
