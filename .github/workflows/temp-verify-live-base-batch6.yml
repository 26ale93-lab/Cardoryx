name: TEMP verify live base refresh batch6

on:
  push:
    branches:
      - fix/cardmarket-live-base-refresh-batch6-20260917

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add exact modern live refresh targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          s=p.read_text()
          old='''                    set(VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS) |\n                    {"sm12-29", "sm12-54", "sm12-237"} | PROTECTED_REVERSE)'''
          new='''                    set(VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS) |\n                    {"sv09-055", "me01-073"} |\n                    {"sm12-29", "sm12-54", "sm12-237"} | PROTECTED_REVERSE)'''
          if old not in s: raise SystemExit('live_targets anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit audit-only change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-verify-live-base-batch6.yml
          git add scripts/test_card_identity_cardmarket_audit.py
          git commit -m 'Refresh exact live Cardmarket base evidence for two modern cards'
          git push origin HEAD:fix/cardmarket-live-base-refresh-batch6-20260917
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Assert exact delta
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          expected={'SAFE':1772,'EXACT_ALTERNATE_PRODUCT':156,'P0_WRONG_PRODUCT':0,'P1_AMBIGUOUS_PRODUCT':269,'SOURCE_CONFLICT':7,'UNMAPPED_EXACT_PRODUCT':0}
          if r['classificationTotals'] != expected:
              raise SystemExit(f"unexpected totals {r['classificationTotals']} != {expected}")
          idx={x['tcgdexId']:x for x in r['caseIndex']}
          for cid in ('sv09-055','me01-073'):
              if idx.get(cid,{}).get('classification')!='SAFE':
                  raise SystemExit(f'{cid} did not resolve SAFE: {idx.get(cid)}')
          print(json.dumps({'totals':r['classificationTotals'],'verified':['sv09-055','me01-073']},indent=2))
          PY
          git diff --check
