name: Candidate Disambiguation Implementation Test

on:
  push:
    branches:
      - diagnostic/candidate-disambiguation-implementation-test-20260902
    paths:
      - scripts/test_candidate_disambiguation_impl.py
      - diagnostic/candidate-disambiguation-test.html
      - .github/workflows/candidate-disambiguation-impl-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-implementation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify main and diagnostic isolation
        run: |
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          echo "CARDORYX_MAIN_SHA=$main_sha" >> "$GITHUB_ENV"
          echo "MAIN_BEFORE=$main_sha" >> "$GITHUB_ENV"
          test "$(git merge-base HEAD origin/main)" = "845e463928f57ae1b5f139b289dd5c9120cd4f61"
          changed_main="$(git diff --name-only 845e463928f57ae1b5f139b289dd5c9120cd4f61 origin/main)"
          unexpected_main="$(printf '%s\n' "$changed_main" | grep -Ev '^(data/cardmarket_play_index\.json|data/retail_prices\.json)$' || true)"
          test -z "$unexpected_main"
          expected_branch="$(git diff --name-only 845e463928f57ae1b5f139b289dd5c9120cd4f61...HEAD | sort)"
          test "$expected_branch" = "$(printf '%s\n' .github/workflows/candidate-disambiguation-impl-test.yml diagnostic/candidate-disambiguation-test.html scripts/test_candidate_disambiguation_impl.py | sort)"
          protected=(index.html data/retail_prices.json data/cardmarket_play_index.json scripts/build_retail_index.py .github/workflows/update-retail-prices.yml .github/workflows/update-cardmarket-play-index.yml)
          git diff --exit-code 845e463928f57ae1b5f139b289dd5c9120cd4f61...HEAD -- "${protected[@]}"

      - name: Validate Python and real-photo diagnostic JavaScript
        run: |
          python -m py_compile scripts/test_candidate_disambiguation_impl.py
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("diagnostic/candidate-disambiguation-test.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",html,re.S|re.I)
          Path("/tmp/cardoryx-diagnostic-inline.js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/cardoryx-diagnostic-inline.js
          test -f diagnostic/candidate-disambiguation-test.html
          grep -Fq 'candidate_disambiguation_real_scans.json' diagnostic/candidate-disambiguation-test.html
          grep -Fq 'candidateTargetedOcrDiagnosticRuntime' diagnostic/candidate-disambiguation-test.html
          grep -Fq 'DIAGNOSTIC_NAME_CROP_MATRIX' diagnostic/candidate-disambiguation-test.html
          grep -Fq 'legacy-schema2-raw-unavailable' diagnostic/candidate-disambiguation-test.html
          grep -Fq 'metadata:{schema:3' diagnostic/candidate-disambiguation-test.html
          grep -Fq 'Diagnostica OCR avanzata' diagnostic/candidate-disambiguation-test.html
          grep -Fq 'Mostra altri usato senza nuove query.' diagnostic/candidate-disambiguation-test.html
          grep -Fq 'Salvataggio collezione disattivato' diagnostic/candidate-disambiguation-test.html
          ! grep -Fq 'onclick="saveSelected()"' diagnostic/candidate-disambiguation-test.html

      - name: Snapshot protected production files
        run: |
          sha256sum index.html data/retail_prices.json data/cardmarket_play_index.json scripts/build_retail_index.py .github/workflows/update-retail-prices.yml .github/workflows/update-cardmarket-play-index.yml > /tmp/cardoryx-protected.before

      - name: Run diagnostic implementation test
        run: python scripts/test_candidate_disambiguation_impl.py

      - name: Verify report, fail-safe and read-only state
        run: |
          sha256sum index.html data/retail_prices.json data/cardmarket_play_index.json scripts/build_retail_index.py .github/workflows/update-retail-prices.yml .github/workflows/update-cardmarket-play-index.yml > /tmp/cardoryx-protected.after
          diff -u /tmp/cardoryx-protected.before /tmp/cardoryx-protected.after
          git diff --exit-code
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN_BEFORE"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("artifacts/candidate_disambiguation_impl_report.json")
          if not p.exists(): raise SystemExit("Required report missing")
          r=json.loads(p.read_text(encoding="utf-8"))
          if r.get("sourceMain")!=os.environ["CARDORYX_MAIN_SHA"]: raise SystemExit("Unexpected main")
          if r.get("priorReports",{}).get("discrepancies"): raise SystemExit("Prior audit discrepancy")
          checks=r.get("implementation",{}).get("checks",{})
          required_runtime_checks=(
            "cameraCapture","advancedPanel","sevenControlledNameVariants","preprocessingMatrix",
            "currentRuleAThresholdPreserved","tokenSequenceConsecutive","significantSuffixPreserved",
            "ruleBMetricOnly","ruleCMetricOnly","classificationDiagnosticOnly",
            "identityBeforeClassification","collectorRawCaptured","schema3Export","schema2Migration",
            "imagesExcluded","targetedNoFuzzy","targetedNoNamedHardcoding","collectionSaveDisabled",
            "noCollectionPersistence","loadMore","localGroundTruth","performanceTiming"
          )
          for key in required_runtime_checks:
              if checks.get(key) is not True: raise SystemExit(f"Real-photo page check failed: {key}")
          unit_tests=r.get("implementation",{}).get("unitTests",{})
          if not unit_tests or not all(unit_tests.values()): raise SystemExit(f"Targeted unit test failure: {unit_tests}")
          features=r.get("photoValidation",{}).get("features",{})
          if not features or not all(features.values()): raise SystemExit("Real-photo feature incomplete")
          if r.get("photoValidation",{}).get("diagnosticLogDownload")!="candidate_disambiguation_real_scans.json":
              raise SystemExit("Unexpected export filename")
          q=r.get("quality",{})
          if q.get("simulatedFalsePositives")!=0 or q.get("candidateIdsLost")!=0: raise SystemExit("Candidate safety failure")
          if q.get("regressions")!=0 or q.get("apiNetworkErrors")!=0: raise SystemExit("Regression or network error")
          replay=r.get("realPhotoReplay",{})
          if replay.get("totalTests")!=27 or replay.get("photoScans")!=19 or replay.get("ambiguousPhotoScans")!=8:
              raise SystemExit("Real-photo export baseline mismatch")
          if replay.get("ruleAFalsePositives")!=0 or replay.get("ruleBFalsePositives")!=0:
              raise SystemExit("Real-photo replay false positive")
          g=r.get("genesect067of086",{})
          if g.get("ruleA",{}).get("resolved") or g.get("ruleB",{}).get("resolved") or g.get("ruleC",{}).get("theoretical"):
              raise SystemExit("Significant suffix fail-safe failure")
          if r.get("photoValidation",{}).get("newPhotosExecutedInWorkflow")!=0: raise SystemExit("Unexpected new-photo claim")
          if r.get("collectorCode",{}).get("parserChanged") is not False: raise SystemExit("Collector parser changed")
          safety=r.get("safety",{})
          for key in ("mainModified","indexProductionModified","retailModified","cardmarketModified","collectionDataModified","newIdentitiesCreated","pricesModified"):
              if safety.get(key) is not False: raise SystemExit(f"Safety violation: {key}")
          if r.get("finalAssessment")!="PRONTO PER SECONDO TEST FOTO REALI": raise SystemExit("Not ready for second photo test")
          print(json.dumps({
            "name":r.get("name"),"realPhotoReplay":replay,"genesect":g,
            "photoValidation":r.get("photoValidation"),"collectorCode":r.get("collectorCode"),
            "classificationPhoto":r.get("classificationPhoto"),"performance":r.get("performance"),
            "quality":q,"safety":safety,"finalAssessment":r.get("finalAssessment")
          },ensure_ascii=False,indent=2))
          PY

      - name: Upload diagnostic implementation package
        uses: actions/upload-artifact@v4
        with:
          name: candidate-disambiguation-implementation-test
          path: |
            artifacts/candidate_disambiguation_impl_report.json
            diagnostic/candidate-disambiguation-test.html
          if-no-files-found: error
          retention-days: 14
