name: Temporary EX4 Residual Audit

on:
  push:
    branches:
      - diagnostic/ex4-residual-verification-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Run residual audit
        run: |
          python -B -m py_compile scripts/temp_ex4_residual_audit.py
          rm -rf scripts/__pycache__
          python -B scripts/temp_ex4_residual_audit.py "$RUNNER_TEMP/tcgdex-cards-database" | tee "$RUNNER_TEMP/ex4_residual_audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ex4-residual-audit
          path: ${{ runner.temp }}/ex4_residual_audit.json
          if-no-files-found: error
