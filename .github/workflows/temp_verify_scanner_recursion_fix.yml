name: TEMP Verify Scanner Recursion Fix
on:
  push:
    branches: [fix/scanner-single-finish-recursion-20260920]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: JS syntax and recursion gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text()
          body=s[s.index("function syncVariantAvailability"):s.index("// Prezzi Cardmarket",s.index("function syncVariantAvailability"))]
          assert "const changed=sel.value!==nextValue;" in body
          assert "if(changed)sel.dispatchEvent(new Event('change',{bubbles:true}));" in body
          assert "sel.dispatchEvent(new Event('change',{bubbles:true}));" not in body.replace("if(changed)sel.dispatchEvent(new Event('change',{bubbles:true}));","")
          print("RECURSION_GATE_OK")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path("index.html").read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          js="\n".join(x for x in scripts if x.strip())
          Path("/tmp/cardoryx.js").write_text(js)
          subprocess.run(["node","--check","/tmp/cardoryx.js"],check=True)
          print("JS_SYNTAX_OK")
          PY
