name: Temp prefixed promo search

on:
  push:
    branches:
      - fix/prefixed-promo-manual-search-20260911

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prefixed-promo-manual-search-20260911
          fetch-depth: 0
      - name: Apply surgical manual-search patch
        run: python scripts/_temp_apply_prefixed_promo_search.py
      - name: Run focused regression
        run: python scripts/test_manual_prefixed_promo_search.py
      - name: Commit verified fix and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-prefixed-promo-search.yml scripts/_temp_apply_prefixed_promo_search.py
          git add index.html scripts/test_manual_prefixed_promo_search.py
          git commit -m "Support prefixed promo codes in manual search"
          git push origin HEAD:fix/prefixed-promo-manual-search-20260911
