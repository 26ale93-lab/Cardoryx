name: TEMP XY Exact Finish Audit

on:
  push:
    branches:
      - fix/xy-exact-finishes-20260922

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Run deterministic variant finish audit
        run: python scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/variant_finish_audit_report.json --workers 28
      - name: Verify exact XY gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/variant_finish_audit_report.json"))
          s=r["summary"]; c=s["classifications"]
          expected={"CORRETTA":4194,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":52,"SOURCE CONFLICT":8}
          assert s["totalIdentitiesTested"]==4254,s
          assert c==expected,c
          assert s["pricingP0"]==0,s
          a=r["verifiedXy1ChecklistFinishAudit"]
          assert a["expectedIdentities"]==16,a
          assert len(a["normalIdentities"])==14,a
          assert len(a["holoIdentities"])==2,a
          assert len(a["reverseIdentities"])==14,a
          print("GATES_OK",s)
          print("XY1_OK",a)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xy-exact-finish-audit
          path: artifacts/variant_finish_audit_report.json
          if-no-files-found: error
