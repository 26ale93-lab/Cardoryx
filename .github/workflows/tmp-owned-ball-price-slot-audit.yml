name: Temporary owned Ball price-slot audit

on:
  push:
    branches:
      - audit/all-ball-price-slots-20261012
    paths:
      - scripts/test_cardmarket_stale_price_audit.py
      - .github/workflows/tmp-owned-ball-price-slot-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run owned Ball price-slot audit
        run: python scripts/test_cardmarket_stale_price_audit.py
