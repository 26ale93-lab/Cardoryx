name: Temporary EX5 Beldum Gym Challenge Fix

on:
  push:
    branches:
      - feature/exact-ex5-beldum-gym-challenge-20260916

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair temporary helper quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/temp_apply_ex5_beldum_gym_challenge_fix.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("fn=r'''def runtime_ex5_beldum_gym_challenge_regression():", 'fn=r"""def runtime_ex5_beldum_gym_challenge_regression():', 1)
          s=s.replace("return json.loads(subprocess.check_output([\"node\",\"-e\",js+\"\\n\"+harness,json.dumps(card),str(base_cm.get(\"trend\") or 0)],text=True))\n\n\n'''\nif anchor not in s:", "return json.loads(subprocess.check_output([\"node\",\"-e\",js+\"\\n\"+harness,json.dumps(card),str(base_cm.get(\"trend\") or 0)],text=True))\n\n\n\"\"\"\nif anchor not in s:", 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply exact Beldum patch
        run: python -B scripts/temp_apply_ex5_beldum_gym_challenge_fix.py
      - name: Ensure Beldum live audit target
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          s=p.read_text(encoding='utf-8')
          old='''    live_targets = ((multi_ids - historical_ids) | shared_identity_ids | verified_set_logo_ids | {"swshp-SWSH028"} |\n'''
          new='''    live_targets = ((multi_ids - historical_ids) | shared_identity_ids | verified_set_logo_ids | {"swshp-SWSH028", "ex5-29"} |\n'''
          if old not in s: raise SystemExit('live target anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Restore temporary helper before audits
        run: git checkout -- scripts/temp_apply_ex5_beldum_gym_challenge_fix.py
      - name: Runtime Cardmarket regression
        run: python -B scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Full Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Assert exact movement and EX5 isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          c=r['classificationTotals']
          assert c['P0_WRONG_PRODUCT']==0,c
          assert c['SOURCE_CONFLICT']==7,c
          assert c['P1_AMBIGUOUS_PRODUCT']==422,c
          assert c['EXACT_ALTERNATE_PRODUCT']==90,c
          b=next(x for x in r['caseIndex'] if x['tcgdexId']=='ex5-29')
          reg=next(x for x in r['caseIndex'] if x['tcgdexId']=='ex5-98')
          assert b['classification']=='EXACT_ALTERNATE_PRODUCT',b
          assert b.get('liveExactEx5BeldumGymChallenge') is True,b
          assert reg['classification']=='P1_AMBIGUOUS_PRODUCT',reg
          print(json.dumps({'totals':c,'beldum':b['classification'],'regirock':reg['classification']},indent=2))
          PY
      - name: Existing Numel Ditto regression
        run: python -B scripts/test_variant_finish_audit.py --numel-ditto-only
      - name: Existing Quilava regression
        run: python -B scripts/test_variant_finish_audit.py --quilava-play-only
      - name: Restore generated reports
        run: |
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git checkout -- artifacts/variant_finish_audit_report.json
      - name: Diff safety
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'index.html\nscripts/test_card_identity_cardmarket_audit.py'
      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m "Support exact Beldum Gym Challenge Cardmarket product"
          git push
