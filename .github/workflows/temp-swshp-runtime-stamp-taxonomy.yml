name: Temporary SWSH Promo Runtime Stamp Taxonomy

on:
  push:
    branches:
      - diagnostic/swshp-runtime-stamp-taxonomy-20260916

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect runtime stamp taxonomy
        run: python -B scripts/temp_swshp_runtime_stamp_taxonomy.py
      - name: Commit diagnostic report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/swshp_runtime_stamp_taxonomy_report.json
          git commit -m "Report SWSH promo runtime stamp taxonomy"
          git push
