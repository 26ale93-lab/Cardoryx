name: TEMP Final Gold Regression
on:
  push:
    branches: [feature/gold-finish-taxonomy-20260920]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - run: python3 scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/report.json
      - name: Final gates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open("artifacts/report.json"))
          c=r["summary"]["classifications"]
          assert r["summary"]["totalIdentitiesTested"]==4254
          assert c=={"CORRETTA":4097,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":149,"SOURCE CONFLICT":8},c
          assert r["summary"]["pricingP0"]==0
          s=Path("index.html").read_text()
          assert s.count('<option value="Gold">Gold</option>')==2
          assert '</option>\\n          <option value="Gold">' not in s
          print("FINAL_GOLD_GATES_OK")
          PY
