name: Temporary EX4 Verified Batch Validation

on:
  push:
    branches:
      - fix/ex4-verified-batch-cardmarket-identities

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Audit all EX4 identities before patch
        run: |
          python -B -m py_compile scripts/temp_ex4_verified_batch.py
          rm -rf scripts/__pycache__
          python -B scripts/temp_ex4_verified_batch.py --audit --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/ex4_verified_batch_audit.json').read_text())
          assert r['cards']==97, r['cards']
          assert r['parseErrors']==0, r['parseErrors']
          assert r['uniqueExactNameMatches']==50, r['uniqueExactNameMatches']
          assert not r['liveErrors'], r['liveErrors']
          assert r['eligibleCount']>0, r['eligibleCount']
          assert len(r['eligibleIds'])==len(set(r['eligibleIds']))
          targets=[x['targetProductId'] for x in r['candidates']]
          assert len(targets)==len(set(targets))
          for x in r['candidates']:
              assert x['uniqueExactNameInExpansion1542']
              assert x['matchingMetacardVariantIds']
              assert x['currentOutsideExpansion1542']
              assert x['currentDiffersFromTarget']
              assert x['priceAvailable']
              assert not x['alreadyFixed']
          print('SAFE_BATCH_COUNT',r['eligibleCount'])
          print('SAFE_BATCH_IDS',','.join(r['eligibleIds']))
          PY
          cp artifacts/ex4_verified_batch_audit.json "$RUNNER_TEMP/ex4_verified_batch_audit.json"
          rm artifacts/ex4_verified_batch_audit.json
      - name: Baseline full Cardmarket identity audit
        run: |
          python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
          cp artifacts/card_identity_cardmarket_audit_report.json "$RUNNER_TEMP/baseline_identity_report.json"
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
      - name: Apply only verified EX4 batch
        run: |
          python -B scripts/temp_ex4_verified_batch.py --apply --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database" --report "$RUNNER_TEMP/ex4_verified_batch_audit.json"
          python -B -m py_compile scripts/test_card_identity_cardmarket_audit.py
          rm -rf scripts/__pycache__
      - name: Focused runtime regression
        run: python -B scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Post-patch full identity audit
        run: |
          python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
          cp artifacts/card_identity_cardmarket_audit_report.json "$RUNNER_TEMP/post_identity_report.json"
      - name: Compare baseline and post-patch
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base=json.loads(Path(os.environ['RUNNER_TEMP'],'baseline_identity_report.json').read_text())
          post=json.loads(Path(os.environ['RUNNER_TEMP'],'post_identity_report.json').read_text())
          batch=json.loads(Path(os.environ['RUNNER_TEMP'],'ex4_verified_batch_audit.json').read_text())
          bc=base['summary']['classifications'] if 'summary' in base and 'classifications' in base['summary'] else base['classifications']
          pc=post['summary']['classifications'] if 'summary' in post and 'classifications' in post['summary'] else post['classifications']
          assert bc['P0_WRONG_PRODUCT']==0, bc
          assert pc['P0_WRONG_PRODUCT']==0, pc
          assert pc['P1_AMBIGUOUS_PRODUCT'] < bc['P1_AMBIGUOUS_PRODUCT'], (bc,pc)
          drop=bc['P1_AMBIGUOUS_PRODUCT']-pc['P1_AMBIGUOUS_PRODUCT']
          assert drop==batch['eligibleCount'], (drop,batch['eligibleCount'])
          print('P1',bc['P1_AMBIGUOUS_PRODUCT'],'->',pc['P1_AMBIGUOUS_PRODUCT'])
          print('P0',pc['P0_WRONG_PRODUCT'])
          PY
      - name: Verify scope and protected files
        run: |
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git diff --check
          git diff --exit-code HEAD -- data/retail_prices.json data/cardmarket_play_index.json sw.js manifest.webmanifest
          test "$(git diff --name-only HEAD | sort | tr '\n' ' ')" = "index.html scripts/test_card_identity_cardmarket_audit.py "
      - name: Commit validated production patch
        run: |
          git config user.name "26ale93-lab"
          git config user.email "26ale93@gmail.com"
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m "Fix verified EX4 Cardmarket identity batch"
          git push origin HEAD:fix/ex4-verified-batch-cardmarket-identities
      - uses: actions/upload-artifact@v4
        with:
          name: ex4-verified-batch-audit
          path: ${{ runner.temp }}/ex4_verified_batch_audit.json
          if-no-files-found: error
