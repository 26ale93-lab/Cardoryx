name: TEMP generate exact Ball variant index

on:
  push:
    branches:
      - fix/ball-variant-exact-index-20260919

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone TCGdex cards database
        run: |
          git clone --depth 1 https://github.com/tcgdex/cards-database.git /tmp/tcgdex-cards-database

      - name: Generate verified Ball index
        run: |
          python scripts/temp_generate_ball_variant_index.py

      - name: Validate diff
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert s.count("// CARDORYX GENERATED EXACT BALL VARIANT PRICES — BEGIN")==1
          assert s.count("// CARDORYX GENERATED EXACT BALL VARIANT PRICES — END")==1
          assert "function verifiedExactBallVariantPrice(card,variant)" in s
          assert "const exactBall=verifiedExactBallVariantPrice(card,variant);" in s
          print("Ball registry anchors OK")
          PY

      - name: Run production Cardmarket runtime regression
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("scripts/test_card_identity_cardmarket_audit.py")
          spec=importlib.util.spec_from_file_location("audit",p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          result=mod.runtime_cardmarket_regression()
          print(result["generatedBalls"])
          PY

      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Generate exact Cardmarket Ball variant index"
          git push
