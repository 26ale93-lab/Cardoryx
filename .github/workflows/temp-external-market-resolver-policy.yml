name: TEMP External Market Resolver Policy Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/external-market-resolver-policy-20260928
    paths:
      - scripts/external_market_resolver.py
      - scripts/test_external_market_resolver.py
      - .github/workflows/temp-external-market-resolver-policy.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify protected valuation files before
        run: |
          sha256sum data/cardmarket_play_index.json > /tmp/cardmarket.before
          sha256sum data/retail_prices.json > /tmp/retail.before
      - name: Run resolver policy tests
        run: |
          python scripts/test_external_market_resolver.py
      - name: Verify protected valuation files unchanged
        if: always()
        run: |
          sha256sum data/cardmarket_play_index.json > /tmp/cardmarket.after
          sha256sum data/retail_prices.json > /tmp/retail.after
          cmp /tmp/cardmarket.before /tmp/cardmarket.after
          cmp /tmp/retail.before /tmp/retail.after
