name: TEMP Verify iOS Finish Select
on:
  push:
    branches: [fix/ios-finish-select-autoselect-20260920]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Static UI regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text()
          assert '#scanView select{color-scheme:light;background:#fff;color:#111827;-webkit-appearance:menulist;appearance:auto;pointer-events:auto;touch-action:manipulation}' in s
          assert "if(!edit && selectable.length===1)" in s
          assert "sel.dispatchEvent(new Event('change',{bubbles:true}))" in s
          assert "const manual=['Speciale / Altro','Non so']" in s
          print("IOS_SELECT_AND_AUTOSELECT_STATIC_OK")
          PY
      - run: python3 scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/report.json
      - name: Exact safety gates
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("artifacts/report.json")); c=r["summary"]["classifications"]; print(r["summary"])
          assert r["summary"]["totalIdentitiesTested"]==4254
          assert c["FALSO POSITIVO"]==0 and c["FALSO NEGATIVO"]==0 and c["SOURCE CONFLICT"]==8
          assert r["summary"]["pricingP0"]==0
          PY
