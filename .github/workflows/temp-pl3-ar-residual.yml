name: TEMP PL3 AR residual audit
on:
  push:
    branches: [diagnostic/pl3-ar-residual-20260917]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Document AR duplicate source and catalogue
        run: |
          python3 - <<'PY'
          import json,pathlib,urllib.request,tempfile,re
          db=pathlib.Path('../tcgdex-cards-database')
          for folder in ('data/Platinum/Arceus','data/Platinum/Supreme Victors'):
              print('FOLDER',folder)
              for n in range(1,10):
                  p=db/folder/f'AR{n}.ts'
                  print('FILE',p.relative_to(db),'exists',p.exists())
                  if p.exists():
                      text=p.read_text(errors='ignore')
                      keep=[]
                      for line in text.splitlines():
                          if any(k in line for k in ('id:', 'name:', 'types:', 'attacks:', 'thirdParty', 'cardmarket', 'variants:')):
                              keep.append(line.strip())
                      print('\n'.join(keep[:80]))
          headers={'User-Agent':'Cardoryx-Cardmarket-Identity-Audit/2.0'}
          def dl(section,name):
              path=pathlib.Path(tempfile.gettempdir())/name
              req=urllib.request.Request('https://downloads.s3.cardmarket.com/productCatalog/'+section+'/'+name,headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r,path.open('wb') as f:
                  while chunk:=r.read(1024*1024):f.write(chunk)
              return json.load(open(path))
          prod=dl('productList','products_singles_6.json');price=dl('priceGuide','price_guide_6.json')
          def rows(obj,keys):
              if isinstance(obj,list):return obj
              for k in keys:
                  v=obj.get(k) if isinstance(obj,dict) else None
                  if isinstance(v,list):return v
              return []
          ar=[]
          for r in rows(prod,('products',)):
              if int(r.get('idExpansion') or 0)==1565 and str(r.get('name') or '').lower().startswith('arceus'):
                  ar.append(r)
          print('ARCEUS_CATALOGUE_COUNT',len(ar))
          for r in sorted(ar,key=lambda x:int(x.get('idProduct') or 0)):
              print('ARCEUS_PRODUCT',json.dumps(r,ensure_ascii=False,sort_keys=True))
          pids={int(r['idProduct']) for r in ar if r.get('idProduct')}
          for r in rows(price,('priceGuides','priceGuide')):
              if int(r.get('idProduct') or 0) in pids:
                  keep={k:r.get(k) for k in ('idProduct','avg','low','trend','avg1','avg7','avg30','trend-holo','avg7-holo','avg30-holo')}
                  print('ARCEUS_PRICE',json.dumps(keep,ensure_ascii=False,sort_keys=True))
          PY
