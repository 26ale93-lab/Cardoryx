name: TEMP Base Set stamp taxonomy inspect
on:
  push:
    branches: [diagnostic/base1-structure-p1-20260918]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect edition and stamp taxonomy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text()
          for needle in ('function canonicalStamp','canonicalStamp=','1st-edition','1st Edition','Shadowless','STAMP_OPTIONS','stampOptions'):
              print('NEEDLE',needle)
              p=0
              while True:
                  i=t.find(needle,p)
                  if i<0: break
                  print('CONTEXT',i)
                  print(t[max(0,i-1800):min(len(t),i+4800)])
                  p=i+len(needle)
          PY
