name: TEMP fix exact dual-base Cardmarket products

on:
  push:
    branches:
      - fix/cardmarket-dual-base-exact-products-20260917

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply surgical production and audit changes
        run: python3 scripts/temp_fix_dual_base.py
      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Resolve exact dual-base Cardmarket products'
          git push origin HEAD:fix/cardmarket-dual-base-exact-products-20260917
      - name: Runtime audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Verify exact delta
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          c=(d.get('summary') or {}).get('classifications') or d.get('classifications') or {}
          print('COUNTERS',json.dumps(c,sort_keys=True))
          expected={'SAFE':1762,'EXACT_ALTERNATE_PRODUCT':156,'P0_WRONG_PRODUCT':0,'P1_AMBIGUOUS_PRODUCT':279,'SOURCE_CONFLICT':7,'UNMAPPED_EXACT_PRODUCT':0}
          if c!=expected:
              raise SystemExit(f'unexpected counters {c} != {expected}')
          found={}
          def walk(x):
              if isinstance(x,dict):
                  if x.get('tcgdexId') in {'sv05-041','sv08-065','me01-073'} and 'classification' in x:
                      found[x['tcgdexId']]=x['classification']
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          print('CASES',found)
          if found.get('sv05-041')!='EXACT_ALTERNATE_PRODUCT' or found.get('sv08-065')!='EXACT_ALTERNATE_PRODUCT':
              raise SystemExit('dual-base candidates not resolved exactly')
          if found.get('me01-073')!='P1_AMBIGUOUS_PRODUCT':
              raise SystemExit('Hariyama must remain P1')
          PY
          git diff HEAD^ --check
          test ! -e .github/workflows/temp-fix-cardmarket-dual-base.yml
          test ! -e scripts/temp_fix_dual_base.py
