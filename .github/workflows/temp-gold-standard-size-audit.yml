name: TEMP Gold + Variant Finish Audit

on:
  push:
    branches:
      - fix/gold-standard-size-guard-20260921

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full variant finish audit
        run: python scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/variant_finish_audit_report.json --workers 28
      - name: Verify Cardoryx gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/variant_finish_audit_report.json"))
          s=r["summary"]; c=s["classifications"]
          expected={"CORRETTA":4131,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":115,"SOURCE CONFLICT":8}
          assert s["totalIdentitiesTested"]==4254,s
          assert c==expected,c
          assert s["pricingP0"]==0,s
          gold=r.get("goldMarketplaceRuntimeAudit",{})
          assert gold.get("metalGoldRejected") is True,gold
          assert gold.get("holoGoldAccepted") is True,gold
          assert gold.get("jumboGoldRejected") is True,gold
          assert gold.get("standardPreferredOverJumbo") is True,gold
          assert gold.get("stampedGoldRejected") is True,gold
          assert gold.get("mixedProductId")==900007,gold
          print("GATES_OK",s,gold)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: temp-gold-standard-size-audit
          path: artifacts/variant_finish_audit_report.json
          if-no-files-found: error
