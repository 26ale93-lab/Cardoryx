name: TEMP Audit 30th Special Finish Paths

on:
  push:
    branches:
      - fix/audit-30th-special-finish-paths-20260923

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 30th production regression
        run: python scripts/test_30th_anniversary_finish_stamp.py
      - name: MEE 009-016 production regression
        run: python scripts/test_mee_009_016_30th_finishes.py
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Full deterministic finish audit
        run: python scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/variant_finish_audit_report.json --workers 28
      - name: Verify current gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/variant_finish_audit_report.json"))
          s=r["summary"]; c=s["classifications"]
          expected={"CORRETTA":4450,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":0,"SOURCE CONFLICT":0}
          assert s["totalIdentitiesTested"]==4450,s
          assert c==expected,c
          assert s["pricingP0"]==0,s
          a=r.get("thirtiethAnniversaryFinishAudit") or {}
          assert a.get("mainSetId")=="30th",a
          assert a.get("classicSetId")=="30th-c",a
          assert a.get("finish")=="Holo",a
          assert a.get("stamp")=="30° Anniversario",a
          assert a.get("priceInferredFromFinishEvidence") is False,a
          print("GATES_OK",s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audit-30th-special-finish-paths
          path: artifacts/variant_finish_audit_report.json
          if-no-files-found: error
