name: TEMP Residual 155 Deep Audit
on:
  push:
    branches: [diagnostic/residual-155-deep-audit-20260920]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - run: python3 scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/report.json
      - name: Deep residual breakdown
        run: |
          python3 - <<'PY'
          import importlib.util,json
          from collections import Counter,defaultdict
          from pathlib import Path
          r=json.load(open("artifacts/report.json"))
          spec=importlib.util.spec_from_file_location("v","scripts/test_variant_finish_audit.py")
          v=importlib.util.module_from_spec(spec); spec.loader.exec_module(v)
          cards,errs,sha=v.load_official_database(Path("tcgdex-cards-database"))
          by={c["id"]:c for c in cards}
          amb=[x for x in r["issuesByPriority"] if x["classification"]=="AMBIGUA"]
          out=[]
          for x in amb:
            cid=x["tcgdexId"]; c=by.get(cid,{})
            rows=c.get("variants_detailed") or []
            out.append({
              "id":cid,"prefix":cid.split("-",1)[0],"name":x.get("name"),"set":x.get("set"),
              "reason":x.get("reason"),"rarity":c.get("rarity"),"coarse":c.get("variants"),
              "rows":[{"type":q.get("type"),"foil":q.get("foil"),"stamp":q.get("stamp"),"size":q.get("size"),
                       "subtype":q.get("subtype"),"cm":(q.get("thirdParty") or {}).get("cardmarket")}
                      for q in rows]
            })
          no=[x for x in out if not x["rows"]]
          det=[x for x in out if x["rows"]]
          print(json.dumps({
            "summary":r["summary"],"ambiguous":len(out),
            "prefixes":Counter(x["prefix"] for x in out).most_common(),
            "reasons":Counter(str(x["reason"]) for x in out).most_common(),
            "detailedCount":len(det),"detailed":det,
            "noDetailedCount":len(no),
            "noDetailedByPrefix":defaultdict(int,{p:sum(x["prefix"]==p for x in no) for p in sorted(set(x["prefix"] for x in no))}),
            "noDetailedPreview":no[:80]
          },ensure_ascii=False,indent=2,default=dict))
          PY
