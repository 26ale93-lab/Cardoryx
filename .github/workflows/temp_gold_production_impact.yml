name: TEMP Gold Production Impact
on:
  push:
    branches: [diagnostic/gold-production-impact-20260920]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect finish taxonomy paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          terms=["FINISH","finish","finitura","Cosmos Holo","Reverse Holo","Poké Ball Reverse Holo","Master Ball Reverse Holo","Ditto Peelable","variant","cardmarket"]
          lines=s.splitlines()
          hits=[]
          for i,line in enumerate(lines,1):
            if any(t in line for t in terms):
              hits.append({"line":i,"text":line[:1200]})
          print(json.dumps({"head":__import__("subprocess").check_output(["git","rev-parse","HEAD"],text=True).strip(),"hitCount":len(hits),"hits":hits},ensure_ascii=False,indent=2))
          PY
