name: TEMP Residual 147 Diagnostic
on:
  push:
    branches: [diagnostic/residual-147-audit-20260920]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - run: python3 scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/report.json
      - name: Residual diagnostic
        run: |
          python3 - <<'PY'
          import json, collections
          r=json.load(open("artifacts/report.json"))
          rows=r.get("cards") or []
          amb=[x for x in (r.get("issues") or []) if x.get("classification")=="AMBIGUA"]
          print("SUMMARY",r["summary"])
          print("AMB_COUNT",len(amb))
          for x in amb: print("AMB",json.dumps(x,ensure_ascii=False))
          print("ISSUE_KEYS", list(amb[0]) if amb else [])
          PY
