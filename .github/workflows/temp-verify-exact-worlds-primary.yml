name: TEMP verify exact Worlds primary stamps
on:
  push:
    branches: [fix/exact-worlds-primary-stamps-20260917]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Assert exact Worlds scope and audit delta
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('artifacts/card_identity_cardmarket_audit_report.json'))
          cls=d['classificationTotals']
          expected={'SAFE':1777,'EXACT_ALTERNATE_PRODUCT':156,'P0_WRONG_PRODUCT':0,'P1_AMBIGUOUS_PRODUCT':264,'SOURCE_CONFLICT':7,'UNMAPPED_EXACT_PRODUCT':0}
          if cls != expected:
              raise SystemExit(f'classification mismatch: {cls} != {expected}')
          p1=set(d.get('p1AmbiguousProductIds') or [])
          fixed={'swshp-SWSH296','svp-045','svp-150'}
          if p1 & fixed:
              raise SystemExit('Worlds base ids still P1: '+repr(sorted(p1 & fixed)))
          src=Path('index.html').read_text()
          if "'svp-190':" in src[src.find('const VERIFIED_PRIMARY_WORLDS_STAMPS='):src.find('function cachedOfficialPlaySeries')]:
              raise SystemExit('svp-190 incorrectly entered Worlds auto registry')
          if "'sv03-196':" in src[src.find('const VERIFIED_PRIMARY_WORLDS_STAMPS='):src.find('function cachedOfficialPlaySeries')]:
              raise SystemExit('sv03-196 incorrectly entered Worlds auto registry')
          for label in ('Worlds 2022','Worlds 2023','Worlds 2024'):
              if src.count(f'<option value="{label}">{label}</option>') != 2:
                  raise SystemExit(f'UI option count failed for {label}')
          print('FINAL WORLDS GATE PASS',cls)
          PY
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-verify-exact-worlds-primary.yml
          git commit -m 'Remove temporary Worlds verification workflow'
          git push origin HEAD:fix/exact-worlds-primary-stamps-20260917
