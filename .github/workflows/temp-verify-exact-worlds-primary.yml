name: TEMP verify exact Worlds primary stamps
on:
  push:
    branches: [fix/exact-worlds-primary-stamps-20260917]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch exact Worlds runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()

          # UI options: scanner + edit, inserted after 30th Anniversary.
          old='''          <option value="30° Anniversario">30° Anniversario</option>'''
          new='''          <option value="30° Anniversario">30° Anniversario</option>\n          <option value="Worlds 2022">Worlds 2022</option>\n          <option value="Worlds 2023">Worlds 2023</option>\n          <option value="Worlds 2024">Worlds 2024</option>'''
          if s.count(old)!=1: raise SystemExit(f'scanner option anchor count {s.count(old)}')
          s=s.replace(old,new,1)
          old_edit='''              <option value="30° Anniversario">30° Anniversario</option>'''
          new_edit='''              <option value="30° Anniversario">30° Anniversario</option>\n              <option value="Worlds 2022">Worlds 2022</option>\n              <option value="Worlds 2023">Worlds 2023</option>\n              <option value="Worlds 2024">Worlds 2024</option>'''
          if s.count(old_edit)!=1: raise SystemExit(f'edit option anchor count {s.count(old_edit)}')
          s=s.replace(old_edit,new_edit,1)

          # canonicalStamp exact year taxonomy.
          anchor="""  if(n.includes('30 anniversario')||n.includes('30th celebration')||n.includes('30 celebration'))return '30° Anniversario';\n"""
          insert="""  if(n.includes('30 anniversario')||n.includes('30th celebration')||n.includes('30 celebration'))return '30° Anniversario';\n  if(n.includes('worlds2022'))return 'Worlds 2022';\n  if(n.includes('worlds2023'))return 'Worlds 2023';\n  if(n.includes('worlds2024'))return 'Worlds 2024';\n"""
          if anchor not in s: raise SystemExit('canonical stamp anchor missing')
          s=s.replace(anchor,insert,1)

          # TCGdex stamp evidence tokens.
          anchor="""    '30° Anniversario':['30thcelebration','30anniversario','30thanniversary'],\n"""
          insert="""    '30° Anniversario':['30thcelebration','30anniversario','30thanniversary'],\n    'Worlds 2022':['worlds2022'],\n    'Worlds 2023':['worlds2023'],\n    'Worlds 2024':['worlds2024'],\n"""
          if anchor not in s: raise SystemExit('stamp evidence anchor missing')
          s=s.replace(anchor,insert,1)

          # Exact identity registry + primary-stamp detector. Only these three identities
          # are auto-selected because their top-level product is the Worlds base print.
          anchor="""function cachedOfficialPlaySeries(card){\n"""
          helper="""const VERIFIED_PRIMARY_WORLDS_STAMPS={\n  'swshp-SWSH296':{setId:'swshp',localId:'SWSH296',name:'Champions Festival',stamp:'Worlds 2022',token:'worlds2022',productId:671798,staffProductId:672087},\n  'svp-045':{setId:'svp',localId:'045',name:'Paradise Resort',stamp:'Worlds 2023',token:'worlds2023',productId:726924,staffProductId:727542},\n  'svp-150':{setId:'svp',localId:'150',name:'Paradise Resort',stamp:'Worlds 2024',token:'worlds2024',productId:783445,staffProductId:783446}\n};\nfunction verifiedPrimaryWorldsStamp(card){\n  const id=String(card?.tcgdexId||card?.id||'').trim();\n  const rule=VERIFIED_PRIMARY_WORLDS_STAMPS[id];\n  if(!rule || cardSetId(card)!==rule.setId ||\n     exactLocalIdKey(card?.localId||'')!==exactLocalIdKey(rule.localId) ||\n     normText(card?.name||'')!==normText(rule.name))return '';\n  const topPid=Number(card?.pricing?.cardmarket?.idProduct||card?.pricing?.cardmarket?.id_product||0);\n  if(topPid!==rule.productId)return '';\n  const rows=tcgdexVariantDetails(card).filter(row=>{\n    const stamps=(Array.isArray(row?.stamp)?row.stamp:[]).map(normText);\n    const pid=Number(row?.thirdParty?.cardmarket||0);\n    const cm=row?.pricing?.cardmarket||{};\n    const ppid=Number(cm?.idProduct||cm?.id_product||0);\n    const usable=['trend','avg7','avg30','avg','low'].some(k=>Number(cm?.[k]||0)>0);\n    return stamps.length===1&&stamps[0]===rule.token&&\n      canonicalFinishTypeLabel(row?.type)==='normal'&&!canonicalFinishFoilLabel(row?.foil)&&\n      String(row?.size||'standard').trim().toLowerCase()==='standard'&&\n      pid===rule.productId&&ppid===rule.productId&&usable;\n  });\n  return rows.length===1?rule.stamp:'';\n}\n\n"""
          if anchor not in s: raise SystemExit('worlds helper anchor missing')
          s=s.replace(anchor,helper+anchor,1)

          # Auto-select only from None; an explicit Staff choice is never overwritten.
          anchor="""  if(is30thCelebrationSet(card)||isMee30CelebrationEnergy(card)){\n    sel.value='30° Anniversario';\n    const ps=document.getElementById(edit?'editPlaySeries':'playSeries');\n    if(ps)ps.value='';\n  }\n"""
          insert=anchor+"""  const exactWorlds=verifiedPrimaryWorldsStamp(card);\n  if(exactWorlds && canonicalStamp(sel.value||card?.stamp||'None')==='None'){\n    sel.value=exactWorlds;\n    const ps=document.getElementById(edit?'editPlaySeries':'playSeries');\n    if(ps)ps.value='';\n  }\n"""
          if anchor not in s: raise SystemExit('sync stamp anchor missing')
          s=s.replace(anchor,insert,1)

          # Exact Worlds price resolver supports the base Worlds stamp and its Staff pair.
          anchor="""function tcgdexExactSvpStampPrice(card,variant,stamp){\n"""
          resolver="""function tcgdexExactWorldsStampPrice(card,variant,stamp){\n  const id=String(card?.tcgdexId||card?.id||'').trim();\n  const rule=VERIFIED_PRIMARY_WORLDS_STAMPS[id];\n  if(!rule || cardSetId(card)!==rule.setId ||\n     exactLocalIdKey(card?.localId||'')!==exactLocalIdKey(rule.localId) ||\n     normText(card?.name||'')!==normText(rule.name) || canonicalVariant(variant||'Normal')!=='Normal')return null;\n  const st=canonicalStamp(stamp);\n  let expectedPid=0, expectedStamps=[];\n  if(st===rule.stamp){expectedPid=rule.productId;expectedStamps=[rule.token];}\n  else if(st==='Staff'){expectedPid=rule.staffProductId;expectedStamps=[rule.token,'staff'];}\n  else return null;\n  const rows=tcgdexVariantDetails(card).filter(row=>{\n    const stamps=(Array.isArray(row?.stamp)?row.stamp:[]).map(normText).sort();\n    const expected=[...expectedStamps].sort();\n    const pid=Number(row?.thirdParty?.cardmarket||0);\n    const cm=row?.pricing?.cardmarket||{};\n    const ppid=Number(cm?.idProduct||cm?.id_product||0);\n    const usable=['trend','avg7','avg30','avg','low'].some(k=>Number(cm?.[k]||0)>0);\n    return stamps.length===expected.length&&stamps.every((v,i)=>v===expected[i])&&\n      canonicalFinishTypeLabel(row?.type)==='normal'&&!canonicalFinishFoilLabel(row?.foil)&&\n      String(row?.size||'standard').trim().toLowerCase()==='standard'&&\n      pid===expectedPid&&ppid===expectedPid&&usable;\n  });\n  if(rows.length!==1)return null;\n  const cm=rows[0].pricing.cardmarket;\n  return {...cm,idProduct:expectedPid,source:`TCGdex · Cardmarket · ${st}`,verified:String(cm?.updated||'')};\n}\n\n"""
          if anchor not in s: raise SystemExit('resolver anchor missing')
          s=s.replace(anchor,resolver+anchor,1)

          anchor="""  const swsh028GameStop=tcgdexExactSwsh028GameStopPrice(card,variant,stamp);\n  if(swsh028GameStop)return swsh028GameStop;\n  const tcgdexExact=tcgdexExactSvpStampPrice(card,variant,stamp);\n"""
          insert="""  const swsh028GameStop=tcgdexExactSwsh028GameStopPrice(card,variant,stamp);\n  if(swsh028GameStop)return swsh028GameStop;\n  const worldsExact=tcgdexExactWorldsStampPrice(card,variant,stamp);\n  if(worldsExact)return worldsExact;\n  const tcgdexExact=tcgdexExactSvpStampPrice(card,variant,stamp);\n"""
          if anchor not in s: raise SystemExit('verified stamp resolver chain anchor missing')
          s=s.replace(anchor,insert,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Patch exact Worlds audit evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py'); s=p.read_text()
          anchor="""VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS = {\n"""
          const="""VERIFIED_PRIMARY_WORLDS_CARDMARKET_ROWS = {\n    "swshp-SWSH296": {"setId":"swshp","localId":"SWSH296","name":"Champions Festival","stamp":"worlds-2022","productId":671798,"staffProductId":672087},\n    "svp-045": {"setId":"svp","localId":"045","name":"Paradise Resort","stamp":"worlds-2023","productId":726924,"staffProductId":727542},\n    "svp-150": {"setId":"svp","localId":"150","name":"Paradise Resort","stamp":"worlds-2024","productId":783445,"staffProductId":783446},\n}\n"""
          if anchor not in s: raise SystemExit('audit constant anchor missing')
          s=s.replace(anchor,const+anchor,1)

          old="""                    set(VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS) | set(VERIFIED_PRIMARY_SPECIAL_CARDMARKET_ROWS) |\n"""
          new="""                    set(VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS) | set(VERIFIED_PRIMARY_SPECIAL_CARDMARKET_ROWS) |\n                    set(VERIFIED_PRIMARY_WORLDS_CARDMARKET_ROWS) |\n"""
          if old not in s: raise SystemExit('live targets anchor missing')
          s=s.replace(old,new,1)

          anchor="""        exact_primary_special_pair = False\n"""
          block="""        exact_primary_worlds_pair = False\n        exact_primary_worlds_products = None\n        if card_id in VERIFIED_PRIMARY_WORLDS_CARDMARKET_ROWS:\n            rule=VERIFIED_PRIMARY_WORLDS_CARDMARKET_ROWS[card_id]\n            identity_ok=bool((card.get('set') or {}).get('id')==rule['setId'] and\n                             norm_local(card.get('localId'))==norm_local(rule['localId']) and\n                             card_identity(card).get('name')==rule['name'])\n            def exact_worlds_row(expected_pid, expected_stamps):\n                matched=[]\n                for row in live_card_detail.get('variants_detailed') or []:\n                    stamps=row.get('stamp') or []\n                    if isinstance(stamps,str): stamps=[stamps]\n                    pricing_cm=((row.get('pricing') or {}).get('cardmarket') or {})\n                    try: pricing_pid=int(pricing_cm.get('idProduct') or pricing_cm.get('id_product'))\n                    except (TypeError,ValueError): pricing_pid=None\n                    usable=any(isinstance(pricing_cm.get(k),(int,float)) and pricing_cm.get(k)>0 for k in ('trend','avg7','avg30','avg','low'))\n                    if (cm_id(row)==expected_pid and pricing_pid==expected_pid and usable and\n                        str(row.get('type') or '').lower()=='normal' and not row.get('foil') and\n                        sorted(map(str,stamps))==sorted(expected_stamps) and\n                        str(row.get('size') or 'standard').lower()=='standard'):\n                        matched.append(row)\n                return matched\n            base_rows=exact_worlds_row(rule['productId'],[rule['stamp']])\n            staff_rows=exact_worlds_row(rule['staffProductId'],[rule['stamp'],'staff'])\n            exact_primary_worlds_pair=bool(identity_ok and current_pid==rule['productId'] and\n                                           len(base_rows)==1 and len(staff_rows)==1 and\n                                           prices.get(rule['productId']) and prices.get(rule['staffProductId']))\n            if exact_primary_worlds_pair:\n                exact_primary_worlds_products={'base':rule['productId'],'staff':rule['staffProductId']}\n\n"""
          if anchor not in s: raise SystemExit('audit evidence anchor missing')
          s=s.replace(anchor,block+anchor,1)

          anchor="""        elif card_id in VERIFIED_PRIMARY_SPECIAL_CARDMARKET_ROWS:\n"""
          classblock="""        elif card_id in VERIFIED_PRIMARY_WORLDS_CARDMARKET_ROWS:\n            if exact_primary_worlds_pair and 'VERIFIED_PRIMARY_WORLDS_STAMPS' in source and 'tcgdexExactWorldsStampPrice' in source:\n                rule=VERIFIED_PRIMARY_WORLDS_CARDMARKET_ROWS[card_id]\n                classification, priority, confidence = 'SAFE', None, 'HIGH'\n                resolved_pid=rule['productId']\n                resolved_value=(prices.get(rule['productId']) or {}).get('trend')\n                reason=('TCGdex live prova la stampa Worlds base come identità fisica top-level esatta e separa la copia Staff con un productId distinto; il runtime espone anno Worlds e Staff senza riuso incrociato del prezzo.')\n                action='Mantenere il resolver Worlds esatto per queste identità; piazzamenti senza productId restano fail-closed.'\n            else:\n                classification, priority, confidence = 'P1_AMBIGUOUS_PRODUCT', 'P1', 'LOW'\n                reason='La coppia Worlds base/Staff non supera più tutti i gate esatti di identità, stamp o Price Guide.'\n                action='Fail-closed; nessuna euristica Worlds generica.'\n        elif card_id in VERIFIED_PRIMARY_SPECIAL_CARDMARKET_ROWS:\n"""
          if anchor not in s: raise SystemExit('classification anchor missing')
          s=s.replace(anchor,classblock,1)

          anchor='''            "verifiedPrimarySpecialPair": exact_primary_special_pair,\n'''
          insert='''            "verifiedPrimaryWorldsPair": exact_primary_worlds_pair,\n            "verifiedPrimaryWorldsProducts": exact_primary_worlds_products,\n            "verifiedPrimarySpecialPair": exact_primary_special_pair,\n'''
          if anchor not in s: raise SystemExit('report anchor missing')
          s=s.replace(anchor,insert,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit production changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-verify-exact-worlds-primary.yml
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m 'Resolve exact Worlds primary stamp products'
          git push origin HEAD:fix/exact-worlds-primary-stamps-20260917
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Focused Worlds assertions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          src=Path('index.html').read_text()
          for label in ['Worlds 2022','Worlds 2023','Worlds 2024']:
              if src.count(f'<option value="{label}">{label}</option>')!=2:
                  raise SystemExit(f'UI option count failed: {label}')
          required=['VERIFIED_PRIMARY_WORLDS_STAMPS','verifiedPrimaryWorldsStamp','tcgdexExactWorldsStampPrice']
          for token in required:
              if token not in src: raise SystemExit('missing runtime token '+token)
          rules={
            'swshp-SWSH296':('worlds-2022',671798,672087),
            'svp-045':('worlds-2023',726924,727542),
            'svp-150':('worlds-2024',783445,783446),
          }
          for cid,(stamp,base,staff) in rules.items():
              with urllib.request.urlopen('https://api.tcgdex.net/v2/en/cards/'+cid,timeout=60) as r: c=json.load(r)
              top=int((((c.get('pricing') or {}).get('cardmarket') or {}).get('idProduct') or 0))
              if top!=base: raise SystemExit(f'{cid} top product changed: {top}')
              seen={}
              for row in c.get('variants_detailed') or []:
                  stamps=row.get('stamp') or []
                  if isinstance(stamps,str): stamps=[stamps]
                  cm=((row.get('pricing') or {}).get('cardmarket') or {})
                  pid=(row.get('thirdParty') or {}).get('cardmarket')
                  ppid=cm.get('idProduct') or cm.get('id_product')
                  key=tuple(sorted(stamps))
                  if pid and int(ppid or 0)==int(pid) and any(float(cm.get(k) or 0)>0 for k in ('trend','avg7','avg30','avg','low')):
                      seen[key]=int(pid)
              if seen.get((stamp,))!=base: raise SystemExit(f'{cid} base row mismatch {seen}')
              if seen.get(tuple(sorted((stamp,'staff'))))!=staff: raise SystemExit(f'{cid} staff row mismatch {seen}')
          print('Focused Worlds physical rows PASS')
          PY
      - name: Assert exact audit delta
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/card_identity_cardmarket_audit_report.json'))
          cls=d['classifications']
          expected={'SAFE':1777,'EXACT_ALTERNATE_PRODUCT':156,'P0_WRONG_PRODUCT':0,'P1_AMBIGUOUS_PRODUCT':264,'SOURCE_CONFLICT':7,'UNMAPPED_EXACT_PRODUCT':0}
          if cls!=expected: raise SystemExit(f'classification mismatch: {cls} != {expected}')
          p1=set(d.get('p1AmbiguousProductIds') or [])
          fixed={'swshp-SWSH296','svp-045','svp-150'}
          if p1 & fixed: raise SystemExit('Worlds ids still P1: '+repr(sorted(p1 & fixed)))
          print('Audit delta PASS',cls)
          PY
