name: Temporary Cardmarket P1 Residual Post-Milotic

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-residual-post-milotic-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Full Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Rank residual P1 candidates read-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          skip={
            'sv09-055','me01-073','ex8-16','sv05-041','sv10.5b-065','swshp-SWSH055',
            'base1-49','base1-4','pl3-70'
          }
          rows=[]
          for c in r.get('caseIndex',[]):
            if c.get('classification')!='P1_AMBIGUOUS_PRODUCT':
              continue
            cid=c.get('tcgdexId') or ''
            if cid in skip:
              continue
            cur=c.get('currentCardoryxValue')
            if not isinstance(cur,(int,float)):
              continue
            guides=c.get('realPriceGuideValues') or {}
            alts=[]
            for pid,g in guides.items():
              if not isinstance(g,dict):
                continue
              v=g.get('trend')
              if isinstance(v,(int,float)) and v>0:
                alts.append((abs(v-cur),v,int(pid)))
            if not alts:
              continue
            delta,alt,pid=max(alts)
            rows.append((delta,cid,cur,alt,pid,c.get('name'),c.get('setNameEN'),c.get('currentProductId'),c.get('physicalVariantsByProductId'),c.get('cardmarketProductCatalog')))
          rows.sort(reverse=True,key=lambda x:x[0])
          print('P1_TOTAL',r.get('classificationTotals',{}).get('P1_AMBIGUOUS_PRODUCT'))
          for row in rows[:25]:
            delta,cid,cur,alt,pid,name,setname,current,physical,catalog=row
            print('RANK',json.dumps({
              'delta':round(delta,2),'tcgdexId':cid,'name':name,'set':setname,
              'currentProductId':current,'currentTrend':cur,'alternateProductId':pid,'alternateTrend':alt,
              'physicalVariantsByProductId':physical,'cardmarketProductCatalog':catalog
            },ensure_ascii=False,sort_keys=True))
          PY
      - name: Restore generated report and assert read-only
        run: |
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git diff --exit-code
