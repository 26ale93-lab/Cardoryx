name: TEMP Verify Single Finish Autoselect
on:
  push:
    branches: [fix/search-single-finish-autoselect-20260920]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: UI regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text()
          assert "if(!edit && selectable.length===1)" in s
          assert "sel.dispatchEvent(new Event('change',{bubbles:true}))" in s
          assert "sel.value=selectable.length===1?selectable[0].value:'Non so'" in s
          assert "Never silently choose the first of multiple physical finishes" in s
          print("SINGLE_FINISH_UI_OK")
          PY
      - run: python3 scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/report.json
      - name: Safety gates
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("artifacts/report.json")); c=r["summary"]["classifications"]
          print(r["summary"])
          assert r["summary"]["totalIdentitiesTested"]==4254
          assert c.get("FALSO POSITIVO")==0 and c.get("FALSO NEGATIVO")==0
          assert c.get("SOURCE CONFLICT")==8
          assert r["summary"]["pricingP0"]==0
          print("SAFETY_GATES_OK")
          PY
