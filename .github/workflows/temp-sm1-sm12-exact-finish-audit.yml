name: TEMP SM1 SM12 Exact Finish Audit

on:
  push:
    branches:
      - fix/sm1-sm12-exact-finishes-20260922

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Run deterministic variant finish audit
        run: python scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/variant_finish_audit_report.json --workers 28
      - name: Verify exact SM1 SM12 gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/variant_finish_audit_report.json"))
          s=r["summary"]; c=s["classifications"]
          expected={"CORRETTA":4220,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":26,"SOURCE CONFLICT":8}
          assert s["totalIdentitiesTested"]==4254,s
          assert c==expected,c
          assert s["pricingP0"]==0,s
          sm1=r["verifiedSm1ChecklistFinishAudit"]
          sm12=r["verifiedSm12ChecklistFinishAudit"]
          assert sm1["expectedIdentities"]==13,sm1
          assert len(sm1["normalIdentities"])==10,sm1
          assert len(sm1["holoIdentities"])==3,sm1
          assert len(sm1["reverseIdentities"])==12,sm1
          assert sm12["expectedIdentities"]==13,sm12
          assert len(sm12["normalIdentities"])==10,sm12
          assert len(sm12["holoIdentities"])==3,sm12
          assert len(sm12["reverseIdentities"])==11,sm12
          print("GATES_OK",s)
          print("SM1_OK",sm1)
          print("SM12_OK",sm12)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sm1-sm12-exact-finish-audit
          path: artifacts/variant_finish_audit_report.json
          if-no-files-found: error
