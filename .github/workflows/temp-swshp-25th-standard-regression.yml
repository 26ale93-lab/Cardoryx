name: TEMP SWSH 25th Standard Regression

on:
  push:
    branches:
      - feature/swshp-25th-standard-only-20260920
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest TCGdex cards database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database

      - name: Static checks
        run: |
          git diff --check origin/main...HEAD
          python3 -m py_compile scripts/test_variant_finish_audit.py

      - name: Full variant finish audit
        run: |
          python3 scripts/test_variant_finish_audit.py \
            --tcgdex-db ../tcgdex-cards-database \
            --output /tmp/temp_swshp25_finish_report.json \
            --workers 24

      - name: Verify SWSH 25th regression
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/temp_swshp25_finish_report.json").read_text())
          a=r["swshp25thStandardPromoAudit"]
          assert a["supportedStandardOnly"] == 6, a
          assert a["excludedStandardPlusJumbo"] == 6, a
          assert a["runtime"]["supported"] == 6, a
          assert a["runtime"]["excludedJumboPairs"] == 6, a
          assert a["runtime"]["jumboPairsFailClosed"] is True, a
          assert r["summary"]["classifications"]["FALSO POSITIVO"] == 0, r["summary"]
          assert r["summary"]["classifications"]["FALSO NEGATIVO"] == 0, r["summary"]
          assert r["summary"]["pricingP0"] == 0, r["summary"]
          print(json.dumps({
            "summary":r["summary"],
            "swshp25th":a,
          },ensure_ascii=False))
          PY

      - name: Run Cardmarket identity audit
        run: |
          rm -rf scripts/__pycache__
          python3 scripts/test_card_identity_cardmarket_audit.py \
            --tcgdex-db ../tcgdex-cards-database \
            --workers 24

      - name: Verify Cardmarket remains clean
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/card_identity_cardmarket_audit_report.json").read_text())
          assert r["classificationTotals"]["P0_WRONG_PRODUCT"] == 0, r["classificationTotals"]
          print(json.dumps(r["classificationTotals"],ensure_ascii=False))
          PY

      - name: Record successful validation
        if: github.event_name == 'push'
        run: |
          cat > temp_swshp_25th_standard_validation.txt <<'EOF'
          PASS
          supportedStandardOnly=6
          excludedStandardPlusJumbo=6
          pricingP0=0
          EOF
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_swshp_25th_standard_validation.txt
          git commit -m "TEMP record SWSH 25th standard validation"
          git push
