name: TEMP apply exact Standard Jumbo audit

on:
  push:
    branches:
      - fix/cardmarket-exact-standard-jumbo-audit-20260917

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch audit only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          s=p.read_text()

          old='''VERIFIED_DUAL_BASE_CARDMARKET_PRODUCTS = {\n    "sv05-041": {"setId": "sv05", "localId": "041", "name": "Feraligatr", "expansion": 5589, "metacard": 430014, "normal": 761970, "holo": 760671, "reverse": 760671},\n    "sv08-065": {"setId": "sv08", "localId": "065", "name": "Tapu Koko", "expansion": 5879, "metacard": 441182, "normal": 799718, "holo": 794346, "reverse": 794346},\n}\n'''
          new=old+'''VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS = {\n    "svp-067": {"setId": "svp", "localId": "067", "name": "Roaring Moon ex", "expansion": 5241, "metacard": 426438, "standard": 740407, "jumbo": 740408, "stamp": []},\n    "swshp-SWSH055": {"setId": "swshp", "localId": "SWSH055", "name": "Hatterene V", "expansion": 2916, "metacard": 322125, "standard": 510180, "jumbo": 510175, "stamp": []},\n    "swshp-SWSH132": {"setId": "swshp", "localId": "SWSH132", "name": "Dragapult", "expansion": 2916, "metacard": 345894, "standard": 576731, "jumbo": 576905, "stamp": ["25th-celebration"]},\n    "swshp-SWSH133": {"setId": "swshp", "localId": "SWSH133", "name": "Lance's Charizard V", "expansion": 2916, "metacard": 345895, "standard": 576732, "jumbo": 576906, "stamp": ["25th-celebration"]},\n    "swshp-SWSH134": {"setId": "swshp", "localId": "SWSH134", "name": "Dark Sylveon V", "expansion": 2916, "metacard": 345896, "standard": 576733, "jumbo": 576907, "stamp": ["25th-celebration"]},\n    "swshp-SWSH136": {"setId": "swshp", "localId": "SWSH136", "name": "Mimikyu", "expansion": 2916, "metacard": 345898, "standard": 576735, "jumbo": 576908, "stamp": ["25th-celebration"]},\n    "swshp-SWSH137": {"setId": "swshp", "localId": "SWSH137", "name": "Light Toxtricity", "expansion": 2916, "metacard": 345899, "standard": 576736, "jumbo": 576909, "stamp": ["25th-celebration"]},\n    "swshp-SWSH138": {"setId": "swshp", "localId": "SWSH138", "name": "Hydreigon C", "expansion": 2916, "metacard": 345900, "standard": 576737, "jumbo": 576910, "stamp": ["25th-celebration"]},\n}\n'''
          if old not in s: raise SystemExit('registry anchor missing')
          s=s.replace(old,new,1)

          old='''        "finish": row.get("type"), "foil": sorted(map(str, foils)), "stamp": sorted(map(str, stamps)),\n        "language": row.get("language") or row.get("languages"), "variantId": row.get("variantId"),\n        "firstEdition": row.get("firstEdition"),\n'''
          new='''        "finish": row.get("type"), "foil": sorted(map(str, foils)), "stamp": sorted(map(str, stamps)),\n        "size": row.get("size"), "subtype": row.get("subtype"),\n        "language": row.get("language") or row.get("languages"), "variantId": row.get("variantId"),\n        "firstEdition": row.get("firstEdition"),\n'''
          if old not in s: raise SystemExit('physical_variant anchor missing')
          s=s.replace(old,new,1)

          old='''        live_dual_base_pair = False\n        if card_id in VERIFIED_DUAL_BASE_CARDMARKET_PRODUCTS:\n'''
          new='''        exact_standard_jumbo_pair = False\n        exact_standard_jumbo_products = None\n        if card_id in VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS:\n            rule = VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS[card_id]\n            ps, pj = products.get(rule["standard"]), products.get(rule["jumbo"])\n            gs, gj = prices.get(rule["standard"]), prices.get(rule["jumbo"])\n            identity_ok = bool(\n                (card.get("set") or {}).get("id") == rule["setId"] and\n                norm_local(card.get("localId")) == norm_local(rule["localId"]) and\n                card_identity(card).get("name") == rule["name"]\n            )\n            catalog_ok = bool(\n                ps and pj and ps.get("idExpansion") == rule["expansion"] and pj.get("idExpansion") == rule["expansion"] and\n                ps.get("idMetacard") == rule["metacard"] and pj.get("idMetacard") == rule["metacard"] and\n                ps.get("name") == pj.get("name")\n            )\n            expected_stamp = sorted(rule.get("stamp") or [])\n            standard_rows = [v for v in details.get(rule["standard"], [])\n                             if str(v.get("size") or "standard").lower() == "standard" and\n                             sorted(v.get("stamp") or []) == expected_stamp]\n            jumbo_rows = [v for v in details.get(rule["jumbo"], [])\n                          if str(v.get("size") or "").lower() == "jumbo" and\n                          sorted(v.get("stamp") or []) == expected_stamp]\n            rows_ok = bool(len(standard_rows) == 1 and len(jumbo_rows) == 1 and\n                           standard_rows[0].get("finish") == jumbo_rows[0].get("finish"))\n            guides_ok = bool(\n                gs and gj and int(gs.get("idProduct") or 0) == rule["standard"] and int(gj.get("idProduct") or 0) == rule["jumbo"] and\n                any(isinstance(gs.get(k), (int, float)) and gs.get(k) > 0 for k in ("trend", "avg7", "avg30", "avg", "low")) and\n                any(isinstance(gj.get(k), (int, float)) and gj.get(k) > 0 for k in ("trend", "avg7", "avg30", "avg", "low"))\n            )\n            exact_standard_jumbo_pair = bool(\n                identity_ok and current_pid == rule["standard"] and set(ids) == {rule["standard"], rule["jumbo"]} and\n                catalog_ok and rows_ok and guides_ok\n            )\n            if exact_standard_jumbo_pair:\n                exact_standard_jumbo_products = {"standard": rule["standard"], "jumbo": rule["jumbo"]}\n\n        live_dual_base_pair = False\n        if card_id in VERIFIED_DUAL_BASE_CARDMARKET_PRODUCTS:\n'''
          if old not in s: raise SystemExit('pair computation anchor missing')
          s=s.replace(old,new,1)

          old='''        elif card_id == "swshp-SWSH163":\n'''
          new='''        elif card_id in VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS:\n            if exact_standard_jumbo_pair:\n                rule = VERIFIED_STANDARD_JUMBO_CARDMARKET_PAIRS[card_id]\n                classification, priority, confidence = "SAFE", None, "HIGH"\n                resolved_pid = rule["standard"]\n                resolved_value = (prices.get(rule["standard"]) or {}).get("trend")\n                reason = ("TCGdex documenta due formati fisici distinti della stessa promo: una riga Standard e una Jumbo, "\n                          "con productId Cardmarket separati. Catalogo ufficiale, set, metacard, nome, stamp e Price Guide "\n                          "coincidono; il prodotto top-level corrente è esclusivamente quello Standard.")\n                action = "Nessuna modifica runtime: mantenere il prodotto Standard corrente e non trasferire il prezzo alla Jumbo."\n            else:\n                classification, priority, confidence = "P1_AMBIGUOUS_PRODUCT", "P1", "LOW"\n                reason = "La coppia Standard/Jumbo registrata non supera più tutti i gate esatti di identità, formato o Price Guide."\n                action = "Fail-closed e nuova verifica delle fonti ufficiali; nessuna euristica Standard/Jumbo."\n        elif card_id == "swshp-SWSH163":\n'''
          if old not in s: raise SystemExit('classification anchor missing')
          s=s.replace(old,new,1)

          old='''            "liveExactSwsh028GameStop": live_swsh028_gamestop,\n            "liveExactSwsh028GameStopProductId": live_swsh028_gamestop_pid,\n            "snapshotExactAlternateProductProtected": snapshot_exact_alternate_product,\n'''
          new='''            "liveExactSwsh028GameStop": live_swsh028_gamestop,\n            "liveExactSwsh028GameStopProductId": live_swsh028_gamestop_pid,\n            "verifiedStandardJumboPair": exact_standard_jumbo_pair,\n            "verifiedStandardJumboProducts": exact_standard_jumbo_products,\n            "snapshotExactAlternateProductProtected": snapshot_exact_alternate_product,\n'''
          if old not in s: raise SystemExit('case output anchor missing')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          python3 -m py_compile scripts/test_card_identity_cardmarket_audit.py
          git diff --check
          git diff -- scripts/test_card_identity_cardmarket_audit.py
      - name: Commit audit-only change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-apply-standard-jumbo-audit.yml
          git add scripts/test_card_identity_cardmarket_audit.py
          git commit -m 'Classify exact Standard and Jumbo Cardmarket promo pairs'
          git push origin HEAD:fix/cardmarket-exact-standard-jumbo-audit-20260917
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Assert exact delta
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          c=r['classificationTotals']
          expected={'SAFE':1770,'EXACT_ALTERNATE_PRODUCT':156,'P0_WRONG_PRODUCT':0,'P1_AMBIGUOUS_PRODUCT':271,'SOURCE_CONFLICT':7,'UNMAPPED_EXACT_PRODUCT':0}
          if c != expected: raise SystemExit(f'unexpected totals {c} != {expected}')
          ids=['svp-067','swshp-SWSH055','swshp-SWSH132','swshp-SWSH133','swshp-SWSH134','swshp-SWSH136','swshp-SWSH137','swshp-SWSH138']
          idx={x['tcgdexId']:x for x in r['caseIndex']}
          bad={i:idx.get(i) for i in ids if idx.get(i,{}).get('classification')!='SAFE'}
          if bad: raise SystemExit(f'pair classifications failed: {bad}')
          print(json.dumps({'totals':c,'verifiedStandardJumboIds':ids},indent=2))
          PY
          git diff --check
