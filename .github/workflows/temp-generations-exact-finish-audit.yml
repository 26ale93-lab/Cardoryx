name: TEMP Generations Exact Finish Audit

on:
  push:
    branches:
      - fix/generations-exact-finishes-20260922

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generations exact registry binding
        run: python scripts/test_generations_exact_finish_registry.py
      - name: Scanner single-finish regression
        run: python scripts/test_scanner_single_finish_autoselect.py
      - name: Catalog allocation regression
        run: python scripts/test_catalog_filters.py
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Full deterministic variant finish audit
        run: python scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/variant_finish_audit_report.json --workers 28
      - name: Verify exact gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/variant_finish_audit_report.json"))
          s=r["summary"]; c=s["classifications"]
          expected={"CORRETTA":4238,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":8,"SOURCE CONFLICT":8}
          assert s["totalIdentitiesTested"]==4254,s
          assert c==expected,c
          assert s["pricingP0"]==0,s
          g=r["verifiedGenerationsMarketplaceFinishAudit"]
          assert g["expectedIdentities"]==18,g
          assert len(g["normalIdentities"])==13,g
          assert len(g["holoIdentities"])==5,g
          assert len(g["reverseIdentities"])==10,g
          assert g["outsideListInheritedRule"] is False,g
          assert g["priceFieldsPresent"] is False,g
          print("GATES_OK",s,g)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: generations-exact-finish-audit
          path: artifacts/variant_finish_audit_report.json
          if-no-files-found: error
