name: Temporary Cardmarket P1 Risk Post-Beldum

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-risk-post-beldum-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Add focused EX8 and SV05 diagnostics only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          s=p.read_text(encoding='utf-8')
          needle='''    report = {\n'''
          insert='''    for _focus_id in ("ex8-16", "sv05-041"):\n        _focus = next(c for c in cases if c["tcgdexId"] == _focus_id)\n        print("FOCUS_CASE " + json.dumps(_focus, ensure_ascii=False, sort_keys=True))\n\n    report = {\n'''
          if needle not in s: raise SystemExit('report anchor missing')
          p.write_text(s.replace(needle,insert,1),encoding='utf-8')
          PY
      - name: Full Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Restore diagnostic edits and report
        run: |
          git checkout -- scripts/test_card_identity_cardmarket_audit.py
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
      - name: Read-only safety
        run: git diff --exit-code
