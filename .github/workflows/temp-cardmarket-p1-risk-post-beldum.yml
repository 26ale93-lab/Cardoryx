name: Temporary Cardmarket P1 Risk Post-Beldum

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-risk-post-beldum-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Exclude explained and high-ambiguity historical sets from risk extreme only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          s=p.read_text(encoding='utf-8')
          old='''    for case in p0 + p1:\n        current = case.get("currentCardoryxValue")\n'''
          new='''    for case in p0 + p1:\n        cid=case.get("tcgdexId") or ""\n        if cid in {"sv09-055", "me01-073"} or cid.startswith(("base1-", "base2-", "base3-", "base5-", "gym1-", "gym2-", "neo1-", "neo2-", "neo3-", "neo4-")):\n            continue\n        current = case.get("currentCardoryxValue")\n'''
          if old not in s: raise SystemExit('risk loop anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Full Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Restore diagnostic edits and report
        run: |
          git checkout -- scripts/test_card_identity_cardmarket_audit.py
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
      - name: Read-only safety
        run: git diff --exit-code
