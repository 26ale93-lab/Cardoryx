name: TEMP final dual-base check

on:
  push:
    branches:
      - fix/cardmarket-dual-base-exact-products-20260917

permissions:
  contents: write

jobs:
  final-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove temporary checker and commit clean tree
        shell: bash
        run: |
          rm .github/workflows/temp-final-dual-base-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary dual-base checker'
          git push origin HEAD:fix/cardmarket-dual-base-exact-products-20260917
      - name: Verify final diff
        shell: bash
        run: |
          git fetch origin main
          git diff origin/main...HEAD --check
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "index.html scripts/test_card_identity_cardmarket_audit.py "
          test ! -e scripts/temp_fix_dual_base.py
          test ! -e .github/workflows/temp-fix-cardmarket-dual-base.yml
          test ! -e .github/workflows/temp-final-dual-base-check.yml
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
