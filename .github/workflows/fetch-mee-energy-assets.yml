name: Fetch Cardoryx MEE energy assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_mee_energy_assets.py'
      - '.github/workflows/fetch-mee-energy-assets.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified MEE 009-016 scans
        run: python scripts/fetch_mee_energy_assets.py

      - name: Commit local assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/energies/mee-*.jpg
          if git diff --cached --quiet; then
            echo "Assets already current"
          else
            git commit -m "Add local MEE 009-016 energy scans"
            git push
          fi
