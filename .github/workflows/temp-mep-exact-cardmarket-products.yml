name: Temp MEP exact Cardmarket products

on:
  push:
    branches:
      - fix/mep-exact-cardmarket-products-20260915
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mep-exact-cardmarket-products-20260915
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply surgical MEP patch
        run: python scripts/_temp_apply_mep_exact_cardmarket_products.py
      - name: Run official MEP regression
        run: python scripts/test_prefixed_promo_official_fallbacks.py
      - name: Run prefixed promo regression
        run: python scripts/test_manual_prefixed_promo_search.py
      - name: Show diff
        run: git diff -- index.html scripts/test_prefixed_promo_official_fallbacks.py artifacts/mep_exact_cardmarket_products_report.json
      - name: Commit tested production change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/test_prefixed_promo_official_fallbacks.py artifacts/mep_exact_cardmarket_products_report.json
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
          else
            git commit -m 'Add exact Cardmarket products for verified MEP promos'
            git push origin HEAD:fix/mep-exact-cardmarket-products-20260915
          fi
