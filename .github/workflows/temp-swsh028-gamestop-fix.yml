name: Temporary SWSH028 GameStop Fix

on:
  push:
    branches:
      - feature/exact-swsh028-gamestop-cardmarket-20260916

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair temporary helper quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/temp_apply_swsh028_gamestop_fix.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("fn=r'''\ndef runtime_swsh028_gamestop_regression():", 'fn=r"""\ndef runtime_swsh028_gamestop_regression():', 1)
          s=s.replace("\n'''\nif main_anchor not in s:", '\n"""\nif main_anchor not in s:', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply exact SWSH028 GameStop patch
        run: python -B scripts/temp_apply_swsh028_gamestop_fix.py
      - name: Repair isolated runtime dependency list
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          s=p.read_text(encoding='utf-8')
          old='''           "cardSetId","exactLocalIdKey","tcgdexVariantDetails","tcgdexExactSwsh028GameStopPrice")'''
          new='''           "cardSetId","canonicalPrintedLocalId","printedLocalIdParts","exactLocalIdKey","tcgdexVariantDetails","tcgdexExactSwsh028GameStopPrice")'''
          if old not in s:
              raise SystemExit('SWSH028 runtime dependency anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Restore temporary helper before audits
        run: git checkout -- scripts/temp_apply_swsh028_gamestop_fix.py
      - name: Runtime Cardmarket regression
        run: python -B scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Full Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Assert exact movement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          c=r['classificationTotals']
          assert c['P0_WRONG_PRODUCT']==0,c
          assert c['SOURCE_CONFLICT']==7,c
          assert c['P1_AMBIGUOUS_PRODUCT']==423,c
          assert c['EXACT_ALTERNATE_PRODUCT']==89,c
          case=next(x for x in r['caseIndex'] if x['tcgdexId']=='swshp-SWSH028')
          assert case['classification']=='EXACT_ALTERNATE_PRODUCT',case
          print(json.dumps(c,indent=2))
          PY
      - name: Existing Numel Ditto regression
        run: python -B scripts/test_variant_finish_audit.py --numel-ditto-only
      - name: Existing Quilava regression
        run: python -B scripts/test_variant_finish_audit.py --quilava-play-only
      - name: Restore generated reports
        run: |
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git checkout -- artifacts/variant_finish_audit_report.json
      - name: Diff safety
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'index.html\nscripts/test_card_identity_cardmarket_audit.py'
      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m "Support exact SWSH028 GameStop Cardmarket product"
          git push
