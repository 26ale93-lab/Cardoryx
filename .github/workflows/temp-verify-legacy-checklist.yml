name: TEMP verify exact legacy checklist products
on:
  push:
    branches: [fix/gym-neo-exact-cardmarket-products-20260918]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Apply exact checklist patch
        run: python3 scripts/temp_patch_legacy_checklist.py
      - name: Diff check
        run: git diff --check
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Assert exact delta
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/card_identity_cardmarket_audit_report.json'))
          found=[]
          def walk(x):
              if isinstance(x,dict):
                  if 'SAFE' in x and 'P1_AMBIGUOUS_PRODUCT' in x:
                      found.append(x)
                  for v in x.values():
                      walk(v)
              elif isinstance(x,list):
                  for v in x:
                      walk(v)
          walk(d)
          if not found:
              raise SystemExit('classification counts not found')
          c=found[0]
          expected={
              'SAFE':1823,
              'EXACT_ALTERNATE_PRODUCT':162,
              'P0_WRONG_PRODUCT':0,
              'P1_AMBIGUOUS_PRODUCT':212,
              'SOURCE_CONFLICT':7,
              'UNMAPPED_EXACT_PRODUCT':0,
          }
          for k,v in expected.items():
              if int(c.get(k,-1))!=v:
                  raise SystemExit(f'{k}: expected {v}, got {c.get(k)}')
          neo={f'neo2-{x}' for x in [2,21,3,22,4,23,5,24,6,25,7,26,8,27,9,28,10,29,11,30,12,31,14,33,15,34,16,35,17,36]}
          remaining=set(d.get('p1AmbiguousProductIds') or [])
          bad=sorted(neo & remaining)
          if bad:
              raise SystemExit('Neo targets still P1: '+repr(bad))
          print('COUNTS_OK',expected)
          PY
      - name: Commit verified production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-verify-legacy-checklist.yml scripts/temp_patch_legacy_checklist.py
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m "Resolve exact Gym and Neo Discovery Cardmarket products"
          git push origin HEAD:fix/gym-neo-exact-cardmarket-products-20260918
