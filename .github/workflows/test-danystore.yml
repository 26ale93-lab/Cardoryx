name: Test DanyStore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-danystore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test collegamento DanyStore
        run: python scripts/test_danystore.py
