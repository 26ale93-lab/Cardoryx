name: Temporary Cardmarket P1 Residual Audit

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-residual-audit-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone current TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Run permanent Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Summarize residual P1 by set
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          report=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          ids=report.get('p1AmbiguousProductIds') or []
          counts=Counter(x.rsplit('-',1)[0] for x in ids)
          print('RESIDUAL_P1',len(ids))
          for set_id,count in counts.most_common(20):
              print(json.dumps({'setId':set_id,'p1Count':count},ensure_ascii=False))
          PY
      - name: Audit Scarlet and Violet promo residuals
        run: python -B scripts/temp_cardmarket_svp_residual_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: cardmarket-p1-residual-audit
          path: |
            artifacts/card_identity_cardmarket_audit_report.json
            artifacts/cardmarket_svp_residual_audit_report.json
          if-no-files-found: error
