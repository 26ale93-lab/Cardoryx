name: TEMP Verify Hidden Fates Shiny Vault
on:
  push:
    branches: [audit/hidden-fates-shiny-vault-foil-20260920]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - run: python3 scripts/test_variant_finish_audit.py --tcgdex-db tcgdex-cards-database --output artifacts/report.json
      - name: Exact gates
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("artifacts/report.json"))
          c=r["summary"]["classifications"]
          print(r["summary"])
          assert r["summary"]["totalIdentitiesTested"]==4254
          assert c=={"CORRETTA":4117,"FALSO POSITIVO":0,"FALSO NEGATIVO":0,"AMBIGUA":129,"SOURCE CONFLICT":8},c
          assert r["summary"]["pricingP0"]==0
          print("HIDDEN_FATES_GATES_OK")
          PY
