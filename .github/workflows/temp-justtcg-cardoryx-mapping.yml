name: TEMP JustTCG Cardoryx Mapping Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/justtcg-cardoryx-mapping-20260926
    paths:
      - scripts/test_justtcg_cardoryx_identity_mapping.py
      - .github/workflows/temp-justtcg-cardoryx-mapping.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify protected valuation files before
        run: |
          sha256sum data/cardmarket_play_index.json > /tmp/cardmarket.before
          sha256sum data/retail_prices.json > /tmp/retail.before

      - name: Require JustTCG API key
        env:
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
        run: |
          test -n "$JUSTTCG_API_KEY"

      - name: Run exact identity mapping audit
        env:
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
        run: |
          set -o pipefail
          python scripts/test_justtcg_cardoryx_identity_mapping.py | tee /tmp/justtcg_cardoryx_mapping.json

      - name: Verify protected valuation files unchanged
        if: always()
        run: |
          sha256sum data/cardmarket_play_index.json > /tmp/cardmarket.after
          sha256sum data/retail_prices.json > /tmp/retail.after
          cmp /tmp/cardmarket.before /tmp/cardmarket.after
          cmp /tmp/retail.before /tmp/retail.after

      - name: Upload audit report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: justtcg-cardoryx-mapping-audit
          path: /tmp/justtcg_cardoryx_mapping.json
          retention-days: 7
