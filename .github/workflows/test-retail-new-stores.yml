name: Test Collector Store Cards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-collector-store-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Collector Store Cards V3
        run: python scripts/test_collectorstorecards.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: collectorstorecards-test-report
          path: collectorstorecards_test_report.json
