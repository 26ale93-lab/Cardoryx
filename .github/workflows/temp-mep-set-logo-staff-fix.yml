name: Temporary MEP Set Logo Staff Fix

on:
  push:
    branches:
      - feature/exact-mep-set-logo-staff-20260916

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair temporary helper quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/temp_apply_mep_set_logo_staff_fix.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("fn=r'''\ndef runtime_mep_set_logo_staff_regression():", 'fn=r"""\ndef runtime_mep_set_logo_staff_regression():', 1)
          s=s.replace("\n'''\ns=s.replace(insert_before,fn+insert_before,1)\nold='''    runtime_regression", "\n\"\"\"\ns=s.replace(insert_before,fn+insert_before,1)\nold='''    runtime_regression", 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply exact MEP resolver patch
        run: python -B scripts/temp_apply_mep_set_logo_staff_fix.py
      - name: Restore temporary helper before audits
        run: git checkout -- scripts/temp_apply_mep_set_logo_staff_fix.py
      - name: Runtime Cardmarket regressions including MEP
        run: python -B scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Run full Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Assert exact MEP classification movement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          c=r['classificationTotals']
          assert c['P0_WRONG_PRODUCT']==0, c
          assert c['SOURCE_CONFLICT']==7, c
          assert c['P1_AMBIGUOUS_PRODUCT']==424, c
          assert c['EXACT_ALTERNATE_PRODUCT']==88, c
          cases={x['tcgdexId']:x for x in r['caseIndex']}
          ids=('mep-001','mep-002','mep-003','mep-004','mep-014','mep-015','mep-016','mep-017','mep-064','mep-065','mep-066','mep-067','mep-074','mep-075','mep-076','mep-077')
          for cid in ids:
              assert cases[cid]['classification']=='EXACT_ALTERNATE_PRODUCT',(cid,cases[cid])
          print(json.dumps(c,indent=2))
          PY
      - name: Existing Numel Ditto regression
        run: python -B scripts/test_variant_finish_audit.py --numel-ditto-only
      - name: Existing Quilava Play regression
        run: python -B scripts/test_variant_finish_audit.py --quilava-play-only
      - name: Restore generated reports
        run: |
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git checkout -- artifacts/variant_finish_audit_report.json
      - name: Diff safety
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'index.html\nscripts/test_card_identity_cardmarket_audit.py'
      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m "Support exact MEP Set Stamp and Staff products"
          git push
