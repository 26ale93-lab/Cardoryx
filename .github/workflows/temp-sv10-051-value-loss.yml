name: TEMP sv10-051 value loss

on:
  push:
    branches:
      - diagnostic/sv10-051-value-loss-20260918
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit 26 verified Normal identities for Holo value regression
        run: |
          python - <<'PY'
          import json, urllib.request

          ids=[
            "svp-107","me04-013","me01-064","me01-073","me03-045","me03-086","me03-087","me03-088",
            "me02-045","me02-053","sv10-034","sv10-049","sv10-051","sv10-096","sv09-055","svp-190",
            "svp-221","svp-222","svp-223","sv08-014","sv08-065","sv05-041","sv05-062","sv05-119",
            "sv05-121","sv06-100"
          ]
          def get(cid):
            with urllib.request.urlopen(f"https://api.tcgdex.net/v2/en/cards/{cid}",timeout=20) as r:
              return json.load(r)
          def norm_type(v):
            return str(v or "").strip().lower()
          out=[]
          for cid in ids:
            try:c=get(cid)
            except Exception as e:
              out.append({"id":cid,"error":repr(e)});continue
            rows=c.get("variants_detailed") or []
            base=[r for r in rows if not r.get("foil") and not r.get("stamp") and str(r.get("size") or "standard").lower()=="standard"]
            nr=[r for r in base if norm_type(r.get("type"))=="normal"]
            hr=[r for r in base if norm_type(r.get("type"))=="holo"]
            rr=[r for r in base if norm_type(r.get("type"))=="reverse"]
            top=((c.get("pricing") or {}).get("cardmarket") or {})
            top_pid=int(top.get("idProduct") or 0)
            hpids=[int((r.get("thirdParty") or {}).get("cardmarket") or 0) for r in hr]
            npids=[int((r.get("thirdParty") or {}).get("cardmarket") or 0) for r in nr]
            rpids=[int((r.get("thirdParty") or {}).get("cardmarket") or 0) for r in rr]
            holo_exact_same_top=(len(hr)==1 and hpids[0]>0 and hpids[0]==top_pid and
              int((((hr[0].get("pricing") or {}).get("cardmarket") or {}).get("idProduct") or 0))==top_pid)
            current_holo_would_fail=bool(nr and hr)  # production rule: hasNormal + Holo => needs-exact-variant
            out.append({
              "id":cid,"name":c.get("name"),"topProduct":top_pid,
              "normalProducts":npids,"holoProducts":hpids,"reverseProducts":rpids,
              "normalRows":len(nr),"holoRows":len(hr),"reverseRows":len(rr),
              "holoExactSameTop":holo_exact_same_top,
              "currentHoloWouldFail":current_holo_would_fail,
              "holoTrend":top.get("trend"),"reverseTrend":top.get("trend-holo")
            })
          affected=[x for x in out if x.get("currentHoloWouldFail")]
          safe=[x for x in affected if x.get("holoExactSameTop")]
          print(json.dumps({
            "total":len(out),
            "affectedCount":len(affected),
            "safeExactHoloRecoveryCount":len(safe),
            "affected":affected,
            "notSafe":[x for x in affected if not x.get("holoExactSameTop")],
            "errors":[x for x in out if x.get("error")]
          },ensure_ascii=False,indent=2))
          PY
