name: TEMP ball variant value audit

on:
  push:
    branches:
      - audit/ball-variant-values-20260919
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone TCGdex cards database read-only
        run: |
          git clone --depth 1 https://github.com/tcgdex/cards-database.git /tmp/tcgdex-cards-database

      - name: Audit all Pokeball and Masterball physical rows
        run: |
          python - <<'PY'
          import json, re, urllib.request, concurrent.futures, time
          from pathlib import Path
          import importlib.util

          root=Path(".")
          index=(root/"index.html").read_text(encoding="utf-8")

          spec=importlib.util.spec_from_file_location("finish_audit", root/"scripts/test_variant_finish_audit.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          cards, parse_errors, upstream_sha = mod.load_official_database(Path("/tmp/tcgdex-cards-database"))

          exact=mod.extract_js_object(index,"VERIFIED_EXACT_VARIANT_PRICES")
          legacy=mod.extract_js_object(index,"VERIFIED_VARIANT_PRICES")

          def norm(v):
            return mod.norm(v)

          def canonical_local(v):
            s=str(v or "").strip()
            t=s.lstrip("0")
            return t or s or "0"

          def finish_for_row(row):
            return mod.canonical_row_finish(row)

          candidates=[]
          totals={"pokeball":0,"masterball":0}
          for c in cards:
            for row in c.get("variants_detailed") or []:
              finish=finish_for_row(row)
              if finish not in ("Poké Ball Reverse Holo","Master Ball Reverse Holo"):
                continue
              foil="pokeball" if finish.startswith("Poké") else "masterball"
              totals[foil]+=1
              pid=int((row.get("thirdParty") or {}).get("cardmarket") or 0)
              if not pid:
                continue
              cid=str(c.get("id") or "").strip().lower()
              set_id=str((c.get("set") or {}).get("id") or "").strip().lower()
              local=str(c.get("localId") or "")
              name=str(c.get("name") or "")
              covered=False
              reason=None

              rule=exact.get(cid)
              if isinstance(rule,dict):
                if (str(rule.get("setId") or "").lower()==set_id and
                    canonical_local(rule.get("localId"))==canonical_local(local) and
                    int(rule.get("productId") or 0)==pid and
                    mod.canonical_finish(rule.get("finish"))==finish):
                    covered=True; reason="exact-registry"

              if not covered:
                # legacy set-name registry can also cover exact visible runtime cards
                set_name=norm((c.get("set") or {}).get("name") or "")
                local_key=canonical_local(local)
                for k,v in legacy.items():
                  try: ks,kn,kf=k.split("|",2)
                  except ValueError: continue
                  if norm(ks)==set_name and canonical_local(kn)==local_key and mod.canonical_finish(kf)==finish:
                    covered=True; reason="legacy-registry"; break

              if not covered:
                candidates.append({
                  "tcgdexId":cid,"setId":set_id,"setName":(c.get("set") or {}).get("name"),
                  "localId":local,"name":name,"finish":finish,"productId":pid
                })

          # Deduplicate exact identity+finish+product.
          uniq={}
          for x in candidates:
            uniq[(x["tcgdexId"],x["finish"],x["productId"])]=x
          candidates=list(uniq.values())

          def fetch_card(lang,cid):
            url=f"https://api.tcgdex.net/v2/{lang}/cards/{cid}"
            last=None
            for attempt in range(3):
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"Cardoryx-ball-audit/1.0"})
                with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r),None
              except Exception as e:
                last=repr(e); time.sleep(0.35*(attempt+1))
            return None,last

          def relevant_rows(card,finish):
            rows=[]
            for row in (card or {}).get("variants_detailed") or []:
              if mod.canonical_row_finish(row)!=finish: continue
              pid=int((row.get("thirdParty") or {}).get("cardmarket") or 0)
              cm=(row.get("pricing") or {}).get("cardmarket") or {}
              rows.append({
                "productId":pid,
                "pricingProductId":int(cm.get("idProduct") or cm.get("id_product") or 0),
                "low":cm.get("low"),"trend":cm.get("trend"),"avg1":cm.get("avg1"),
                "avg7":cm.get("avg7"),"avg30":cm.get("avg30"),"avg":cm.get("avg"),
                "updated":cm.get("updated"),
                "foil":row.get("foil"),"type":row.get("type"),"size":row.get("size"),
                "stamp":row.get("stamp")
              })
            return rows

          def live_legacy_covered(x,en,it):
            local_key=canonical_local(x["localId"])
            finish=x["finish"]
            set_names=[]
            for card in (en,it):
              if card:
                set_names.append(norm((card.get("set") or {}).get("name") or ""))
            for k,v in legacy.items():
              try: ks,kn,kf=k.split("|",2)
              except ValueError: continue
              if (norm(ks) in set_names and canonical_local(kn)==local_key and
                  mod.canonical_finish(kf)==finish):
                return True
            return False

          def fetch_live(x):
            cid=x["tcgdexId"]
            en,en_err=fetch_card("en",cid)
            it,it_err=fetch_card("it",cid)
            if not en:
              return {**x,"liveStatus":"FETCH_ERROR","error":en_err}
            en_rows=relevant_rows(en,x["finish"])
            exact_en=[r for r in en_rows if r["productId"]==x["productId"] and r["pricingProductId"]==x["productId"]]
            if len(exact_en)!=1:
              return {**x,"liveStatus":"AMBIGUOUS_OR_MISSING","liveRows":en_rows}
            row=exact_en[0]
            vals=[row.get(k) for k in ("trend","avg7","avg30","avg","low")]
            has_price=any(isinstance(v,(int,float)) and v>0 for v in vals)
            if not has_price:
              return {**x,"liveStatus":"NO_PRICE","liveRows":en_rows,"exactRow":row}

            it_status="MISSING"
            it_rows=[]
            it_name=None
            if it:
              it_name=it.get("name")
              it_rows=relevant_rows(it,x["finish"])
              exact_it=[r for r in it_rows if r["productId"]==x["productId"] and r["pricingProductId"]==x["productId"]]
              it_status="MATCH" if len(exact_it)==1 else "MISMATCH"
            elif it_err:
              it_status="FETCH_ERROR"

            return {**x,"liveStatus":"SAFE_EXACT","liveRows":en_rows,"exactRow":row,
                    "englishName":en.get("name"),"italianName":it_name,
                    "englishSetName":(en.get("set") or {}).get("name"),
                    "italianSetName":((it or {}).get("set") or {}).get("name") if it else None,
                    "runtimeLegacyCovered":live_legacy_covered(x,en,it),
                    "italianStatus":it_status,"italianRows":it_rows}

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
            for r in ex.map(fetch_live,candidates):
              results.append(r)

          safe=[r for r in results if r["liveStatus"]=="SAFE_EXACT"]
          ambiguous=[r for r in results if r["liveStatus"]=="AMBIGUOUS_OR_MISSING"]
          no_price=[r for r in results if r["liveStatus"]=="NO_PRICE"]
          errors=[r for r in results if r["liveStatus"]=="FETCH_ERROR"]
          italian_match=[r for r in safe if r.get("italianStatus")=="MATCH"]
          italian_mismatch=[r for r in safe if r.get("italianStatus")=="MISMATCH"]
          italian_missing=[r for r in safe if r.get("italianStatus") in ("MISSING","FETCH_ERROR")]
          legacy_covered_live=[r for r in safe if r.get("runtimeLegacyCovered")]
          safe_missing=[r for r in safe if not r.get("runtimeLegacyCovered")]

          from collections import Counter, defaultdict
          set_distribution=defaultdict(lambda:{"Poké Ball Reverse Holo":0,"Master Ball Reverse Holo":0})
          product_usage=defaultdict(list)
          for r in safe_missing:
            set_distribution[r["setId"]][r["finish"]]+=1
            product_usage[r["productId"]].append((r["tcgdexId"],r["finish"]))
          duplicate_products={str(pid):rows for pid,rows in product_usage.items() if len(rows)>1}

          # Priority buckets: exact rows with a current price; no assumptions.
          by_finish={}
          for finish in ("Poké Ball Reverse Holo","Master Ball Reverse Holo"):
            rows=[r for r in safe_missing if r["finish"]==finish]
            by_finish[finish]={
              "count":len(rows),
              "cards":sorted(rows,key=lambda x:(x["setId"],x["localId"],x["tcgdexId"]))
            }

          report={
            "audit":"Cardoryx missing ball variant Cardmarket values",
            "mode":"read-only",
            "mainSha":"3fdaa8d75ce3574a3b7f4a082ec171d4e3a531e7",
            "tcgdexDatabaseSha":upstream_sha,
            "upstreamParseErrors":len(parse_errors),
            "physicalRowsSeen":totals,
            "uncoveredIdentityFinishProducts":len(candidates),
            "safeExactPhysicalRows":len(safe),
            "alreadyCoveredByLegacyRuntime":len(legacy_covered_live),
            "safeExactRecoverable":len(safe_missing),
            "ambiguousOrMissing":len(ambiguous),
            "noCurrentPrice":len(no_price),
            "fetchErrors":len(errors),
            "italianExactMatches":len(italian_match),
            "italianMismatches":len(italian_mismatch),
            "italianMissingOrFetchError":len(italian_missing),
            "setDistribution":dict(sorted(set_distribution.items())),
            "duplicateCardmarketProductsAcrossIdentities":duplicate_products,
            "byFinish":by_finish,
            "ambiguous":sorted(ambiguous,key=lambda x:(x["setId"],x["localId"],x["tcgdexId"])),
            "noPrice":sorted(no_price,key=lambda x:(x["setId"],x["localId"],x["tcgdexId"])),
            "fetchErrorsDetail":errors,
            "safety":{
              "productionModified":False,"cardmarketDataModified":False,"retailModified":False,
              "retailPricesModified":False,"genericFallbackAdded":False
            }
          }
          out=Path("/tmp/ball_variant_value_audit_report.json")
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({
            "physicalRowsSeen":totals,
            "uncoveredIdentityFinishProducts":len(candidates),
            "safeExactPhysicalRows":len(safe),
            "alreadyCoveredByLegacyRuntime":len(legacy_covered_live),
            "safeExactRecoverable":len(safe_missing),
            "ambiguousOrMissing":len(ambiguous),
            "noCurrentPrice":len(no_price),
            "fetchErrors":len(errors),
            "italianExactMatches":len(italian_match),
            "italianMismatches":len(italian_mismatch),
            "italianMissingOrFetchError":len(italian_missing),
            "duplicateCardmarketProductsAcrossIdentities":len(duplicate_products),
            "setDistribution":dict(sorted(set_distribution.items())),
            "safePokeball":len(by_finish["Poké Ball Reverse Holo"]["cards"]),
            "safeMasterball":len(by_finish["Master Ball Reverse Holo"]["cards"])
          },ensure_ascii=False,indent=2))
          print("SAFE_SAMPLE")
          for row in safe_missing[:40]:
            e=row["exactRow"]
            print(json.dumps({
              "tcgdexId":row["tcgdexId"],"name":row["name"],"setId":row["setId"],
              "localId":row["localId"],"finish":row["finish"],"productId":row["productId"],
              "trend":e.get("trend"),"avg7":e.get("avg7"),"avg30":e.get("avg30"),"low":e.get("low")
            },ensure_ascii=False))
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: ball-variant-value-audit-report
          path: /tmp/ball_variant_value_audit_report.json
