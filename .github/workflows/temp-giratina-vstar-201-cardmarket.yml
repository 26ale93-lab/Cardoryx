name: Temporary Giratina VSTAR 201 Cardmarket Fix

on:
  push:
    branches:
      - fix/giratina-vstar-lost-origin-201-cardmarket-p1

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASE_SHA: b1588ea8387b16c369d2e903e2ae51ce6c1991e2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact Giratina VSTAR patch
        run: python -B scripts/temp_giratina_vstar_201_fix.py

      - name: Compile audit without leaving cache
        run: |
          python -m py_compile scripts/test_card_identity_cardmarket_audit.py
          rm -rf scripts/__pycache__

      - name: Runtime regression
        run: python -B scripts/test_card_identity_cardmarket_audit.py --runtime-only

      - name: Clone current TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"

      - name: Full Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database" | tee /tmp/cardmarket-audit.log

      - name: Verify exact audit gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          c=report['classifications']
          assert c['P0_WRONG_PRODUCT']==0, c
          assert c['P1_AMBIGUOUS_PRODUCT']==392, c
          assert c['SAFE']==1690, c
          assert c['EXACT_ALTERNATE_PRODUCT']==115, c
          assert c['SOURCE_CONFLICT']==7, c
          assert c['UNMAPPED_EXACT_PRODUCT']==0, c
          cases=report.get('cases') or report.get('results') or []
          target=[x for x in cases if x.get('tcgdexId')=='swsh11-201']
          if target:
              assert target[0].get('classification')=='SAFE', target[0]
          print('GATES', c)
          PY

      - name: Remove diagnostics and assert final scope
        run: |
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git rm .github/workflows/temp-giratina-vstar-201-cardmarket.yml
          git rm scripts/temp_giratina_vstar_201_fix.py
          changed="$(git diff --name-only "$BASE_SHA" | sort)"
          printf 'FINAL_DIFF\n%s\n' "$changed"
          expected="$(printf '%s\n' index.html scripts/test_card_identity_cardmarket_audit.py | sort)"
          test "$changed" = "$expected"
          git diff --check "$BASE_SHA"

      - name: Commit validated production-only diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m 'Fix Giratina VSTAR Lost Origin 201 Cardmarket identity'
          git push origin HEAD:fix/giratina-vstar-lost-origin-201-cardmarket-p1
