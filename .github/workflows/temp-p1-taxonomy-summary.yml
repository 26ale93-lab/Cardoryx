name: TEMP P1 taxonomy summary

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-taxonomy-summary-20260917

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Expose P1 bodies in diagnostic report only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          s=p.read_text()
          old='''        "p1AmbiguousProductIds": [c["tcgdexId"] for c in p1],\n'''
          new='''        "p1AmbiguousProductIds": [c["tcgdexId"] for c in p1],\n        "p1AmbiguousProducts": p1,\n'''
          if old not in s: raise SystemExit('report anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Verify small non-legacy residuals live
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          p1=r.get('p1AmbiguousProducts') or []
          target_sets={'svp','swshp','cel25cc','ex5','sm12'}
          targets=[]
          for c in p1:
              cid=str(c.get('tcgdexId') or '')
              sid=str(c.get('setId') or cid.split('-')[0])
              if sid in target_sets or sid.startswith(('sv','me')):
                  targets.append(c)
          print('SMALL_NONLEGACY_COUNT',len(targets))
          for c in sorted(targets,key=lambda x:str(x.get('tcgdexId'))):
              cid=c['tcgdexId']
              live=None; err=None
              try:
                  with urllib.request.urlopen('https://api.tcgdex.net/v2/en/cards/'+cid,timeout=60) as fh:
                      live=json.load(fh)
              except Exception as e: err=repr(e)
              rows=[]
              if live:
                  for v in live.get('variants_detailed') or []:
                      p=(v.get('thirdParty') or {}).get('cardmarket')
                      if isinstance(p,dict): p=p.get('idProduct') or p.get('id_product')
                      pcm=(v.get('pricing') or {}).get('cardmarket') or {}
                      rows.append({'type':v.get('type'),'foil':v.get('foil'),'stamp':v.get('stamp'),'size':v.get('size'),'subtype':v.get('subtype'),'pid':p,'pricingPid':pcm.get('idProduct') or pcm.get('id_product'),'trend':pcm.get('trend'),'trendHolo':pcm.get('trend-holo')})
              lcm=((live or {}).get('pricing') or {}).get('cardmarket') or {}
              out={
                'id':cid,'name':c.get('name'),'setId':c.get('setId'),'localId':c.get('localId'),
                'snapshotCurrent':c.get('currentProductId'),'allProductIds':c.get('allProductIds'),
                'baseIds':c.get('baseRowProductIdsAccordingToTcgdex'),
                'shared':c.get('sharedProductWithTcgdexIds'),'catalog':c.get('cardmarketProductCatalog'),
                'reason':c.get('reason'),'liveError':err,
                'liveName':(live or {}).get('name'),'liveLocalId':(live or {}).get('localId'),'liveSet':(live or {}).get('set'),
                'liveTopPid':lcm.get('idProduct') or lcm.get('id_product'),'liveTopTrend':lcm.get('trend'),
                'liveRows':rows,
              }
              print('SMALL',json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
