name: TEMP focused Regirock Pikachu runtime audit

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-taxonomy-summary-20260917

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate production price and finish resolvers
        shell: bash
        run: |
          grep -n -E '^function (resolvedCardmarketPricingForCard|currentVariantPrice|priceFor|tcgdex.*Price|documentedVariantsForCard|recommendedVariantFromTCGdex|cardmarketValueForVariant)' index.html || true
          grep -n -E 'cardmarketValueForVariant\(|resolvedCardmarketPricingForCard\(' index.html | head -n 80
      - name: Print resolver neighborhoods
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          needles=['function resolvedCardmarketPricingForCard','function documentedVariantsForCard','function cardmarketValueForVariant']
          for n in needles:
              for i,line in enumerate(s):
                  if n in line:
                      a=max(0,i-8); b=min(len(s),i+180)
                      print('\n###',n,'LINE',i+1)
                      for j in range(a,b): print(f'{j+1}:{s[j]}')
                      break
          PY
