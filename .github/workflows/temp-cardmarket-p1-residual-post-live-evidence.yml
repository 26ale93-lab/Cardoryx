name: Temporary Cardmarket P1 Residual Audit

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-residual-post-live-evidence-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Run current Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Group residual P1 by set
        run: python -B scripts/temp_cardmarket_p1_cluster_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: cardmarket-p1-residual-post-live-evidence
          path: |
            artifacts/card_identity_cardmarket_audit_report.json
            artifacts/cardmarket_p1_cluster_audit_report.json
          if-no-files-found: error
