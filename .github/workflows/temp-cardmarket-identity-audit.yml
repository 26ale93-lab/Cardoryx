name: Temporary Cardmarket Identity Audit

on:
  push:
    branches:
      - diagnostic/cardmarket-identity-audit-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect official Cardmarket Expedition Tyranitar products
        run: |
          python - <<'PY'
          import json, urllib.request
          urls = {
            'products':'https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json',
            'prices':'https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json',
          }
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Cardoryx-Cardmarket-Identity-Audit/2.0'})
              with urllib.request.urlopen(req,timeout=300) as r:
                  return json.load(r)
          products=get(urls['products'])
          prices=get(urls['prices'])
          prows=products.get('products',products if isinstance(products,list) else [])
          grows=prices.get('priceGuides',prices.get('priceGuide',prices if isinstance(prices,list) else []))
          targets=[p for p in prows if int(p.get('idExpansion') or 0)==1536 and 'Tyranitar' in str(p.get('name') or '')]
          ids={int(p['idProduct']) for p in targets}
          price={int(p['idProduct']):p for p in grows if int(p.get('idProduct') or 0) in ids}
          out={'products':targets,'prices':{str(i):price.get(i) for i in sorted(ids)}}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          open('artifacts/expedition_tyranitar_cardmarket_products.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Verify production files unchanged
        run: |
          git diff --check
          git diff --exit-code HEAD -- index.html scripts/test_card_identity_cardmarket_audit.py data/retail_prices.json data/cardmarket_play_index.json sw.js manifest.webmanifest

      - name: Upload target report
        uses: actions/upload-artifact@v4
        with:
          name: expedition-tyranitar-cardmarket-products-20260916
          path: artifacts/expedition_tyranitar_cardmarket_products.json
          if-no-files-found: error
