name: Temporary Cardmarket Identity Audit

on:
  push:
    branches:
      - diagnostic/cardmarket-identity-audit-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned TCGdex database snapshot outside worktree
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate audit script without bytecode
        run: python -B -m py_compile scripts/test_card_identity_cardmarket_audit.py && rm -rf scripts/__pycache__

      - name: Run Cardmarket identity audit read-only
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"

      - name: Verify protected production files unchanged
        run: |
          git diff --check
          git diff --exit-code HEAD -- index.html data/retail_prices.json data/cardmarket_play_index.json sw.js manifest.webmanifest

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-identity-audit-20260916
          path: artifacts/card_identity_cardmarket_audit_report.json
          if-no-files-found: error
