name: TEMP Cardmarket Stale Price Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/cardmarket-stale-price-20261010
    paths:
      - scripts/test_cardmarket_stale_price_audit.py
      - .github/workflows/temp-cardmarket-stale-price-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Cardmarket stale-price audit
        run: |
          set -o pipefail
          python scripts/test_cardmarket_stale_price_audit.py | tee /tmp/cardmarket_stale_price_audit.json

      - name: Upload report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-stale-price-audit
          path: /tmp/cardmarket_stale_price_audit.json
          retention-days: 7
