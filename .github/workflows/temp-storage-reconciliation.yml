name: TEMP IndexedDB Fallback Reconciliation

on:
  push:
    branches:
      - fix/indexeddb-fallback-reconciliation-20260920
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static checks
        run: |
          git diff --check origin/main...HEAD
          python3 -m py_compile scripts/test_storage_reconciliation.py

      - name: Storage reconciliation regression
        run: python3 scripts/test_storage_reconciliation.py

      - name: Record successful validation
        if: github.event_name == 'push'
        run: |
          printf 'PASS\ncommit=%s\n' "$GITHUB_SHA" > temp_storage_reconciliation_validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_storage_reconciliation_validation.txt
          git commit -m "TEMP record storage reconciliation validation"
          git push
