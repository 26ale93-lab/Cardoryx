name: TEMP apply exact Fossil Cardmarket checklist products
on:
  push:
    branches: [fix/base3-fossil-cardmarket-products-20260918]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Validate Cardmarket catalogue and patch exact Fossil identities
        run: |
          python3 - <<'PY'
          import json, urllib.request, pathlib, tempfile, re

          headers={'User-Agent':'Cardoryx-Cardmarket-Identity-Audit/2.0'}
          pairs=[
            (1,16,'Aerodactyl',273862,273877),
            (2,17,'Articuno',273863,273878),
            (3,18,'Ditto',273864,273879),
            (4,19,'Dragonite',273865,273880),
            (5,20,'Gengar',273866,273881),
            (6,21,'Haunter',273867,273882),
            (7,22,'Hitmonlee',273868,273883),
            (8,23,'Hypno',273869,273884),
            (9,24,'Kabutops',273870,273885),
            (10,25,'Lapras',273871,273886),
            (11,26,'Magneton',273872,273887),
            (12,27,'Moltres',273873,273888),
            (13,28,'Muk',273874,273889),
            (14,29,'Raichu',273875,273890),
            (15,30,'Zapdos',273876,273891),
          ]

          def dl(section,name):
              p=pathlib.Path(tempfile.gettempdir())/name
              req=urllib.request.Request('https://downloads.s3.cardmarket.com/productCatalog/'+section+'/'+name,headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r,p.open('wb') as out:
                  while chunk:=r.read(1024*1024): out.write(chunk)
              return json.load(open(p))
          def rows(root,keys):
              if isinstance(root,list): return root
              for k in keys:
                  v=root.get(k) if isinstance(root,dict) else None
                  if isinstance(v,list): return v
              return []

          products={int(r['idProduct']):r for r in rows(dl('productList','products_singles_6.json'),('products',)) if r.get('idProduct')}
          prices={int(r['idProduct']):r for r in rows(dl('priceGuide','price_guide_6.json'),('priceGuides','priceGuide')) if r.get('idProduct')}

          rules={}
          guides={}
          for holo_num,normal_num,name,holo_pid,normal_pid in pairs:
              hp,np=products.get(holo_pid),products.get(normal_pid)
              if not hp or not np:
                  raise SystemExit(f'Missing Cardmarket product for {name}: {holo_pid}/{normal_pid}')
              if int(hp.get('idExpansion') or 0)!=1526 or int(np.get('idExpansion') or 0)!=1526:
                  raise SystemExit(f'Wrong expansion for {name}')
              if int(hp.get('idMetacard') or 0)<=0 or int(hp.get('idMetacard'))!=int(np.get('idMetacard') or 0):
                  raise SystemExit(f'Metacard mismatch for {name}')
              if str(hp.get('name') or '')!=str(np.get('name') or ''):
                  raise SystemExit(f'Catalogue-name mismatch for {name}')
              for num,finish,pid,source,pair in [
                  (holo_num,'Holo',holo_pid,holo_pid,normal_num),
                  (normal_num,'Normal',normal_pid,holo_pid,holo_num),
              ]:
                  cid=f'base3-{num}'
                  rules[cid]={
                      'setId':'base3','localId':str(num),'name':name,'finish':finish,
                      'productId':pid,'sourceProduct':source,'expansionId':1526,'pairId':f'base3-{pair}'
                  }
                  pg=prices.get(pid) or {}
                  compact={'idProduct':pid}
                  for k in ('avg','low','trend','avg1','avg7','avg30'):
                      v=pg.get(k)
                      if isinstance(v,(int,float)) and v>0: compact[k]=v
                  if len(compact)==1:
                      raise SystemExit(f'No usable standard Price Guide for {cid} product {pid}')
                  guides[str(pid)]=compact

          index=pathlib.Path('index.html')
          s=index.read_text(encoding='utf-8')
          marker='const VERIFIED_LEGACY_CHECKLIST_PRODUCTS={'
          start=s.index(marker)
          end=s.index('\n};',start)
          block=s[start:end]
          if 'base3-1' in block:
              raise SystemExit('Fossil registry already present; aborting duplicate patch')
          additions=[]
          for cid,r in rules.items():
              additions.append(
                  '  '+json.dumps(cid)+':{'
                  +f'setId:{json.dumps(r["setId"])},localId:{json.dumps(r["localId"])},name:{json.dumps(r["name"])},'
                  +f'finish:{json.dumps(r["finish"])},productId:{r["productId"]},sourceProduct:{r["sourceProduct"]},'
                  +f'expansionId:{r["expansionId"]},pairId:{json.dumps(r["pairId"])}'
                  +'},'
              )
          # remove trailing comma on final inserted row
          additions[-1]=additions[-1].rstrip(',')
          s=s[:end] + ',\n' + '\n'.join(additions) + s[end:]

          pg_marker='const VERIFIED_LEGACY_CHECKLIST_PRICE_GUIDES='
          pg_start=s.index(pg_marker)+len(pg_marker)
          pg_end=s.index(';',pg_start)
          current=json.loads(s[pg_start:pg_end])
          overlap=set(current).intersection(guides)
          if overlap: raise SystemExit(f'Price Guide overlap: {sorted(overlap)}')
          current.update(guides)
          s=s[:pg_start]+json.dumps(current,separators=(',',':'),ensure_ascii=False)+s[pg_end:]
          index.write_text(s,encoding='utf-8')

          audit=pathlib.Path('scripts/test_card_identity_cardmarket_audit.py')
          a=audit.read_text(encoding='utf-8')
          astart=a.index('LEGACY_CHECKLIST_PRODUCTS = {')
          aend=a.index('\n}\n\nBATCH2_SHARED_PRODUCT_OWNERS',astart)
          ablock=a[astart:aend]
          if "'base3-1'" in ablock:
              raise SystemExit('Fossil audit registry already present')
          pyrows=[]
          for cid,r in rules.items():
              pyrows.append(
                  f"    {cid!r}: ({r['setId']!r}, {r['localId']!r}, {r['name']!r}, {r['finish']!r}, "
                  f"{r['productId']}, {r['sourceProduct']}, {r['expansionId']}, {r['pairId']!r}),"
              )
          a=a[:aend]+'\n'+'\n'.join(pyrows)+a[aend:]
          old_base='base_ok=(str(row.get("type") or "").lower()==expected_type and not row.get("foil") and str(row.get("size") or "standard").lower()=="standard")'
          new_base=('source_foil=str(row.get("foil") or "").strip().lower()'
                    +chr(10)+'                foil_ok=(not source_foil) or (owner_set=="base3" and source_foil=="galaxy")'
                    +chr(10)+'                base_ok=(str(row.get("type") or "").lower()==expected_type and foil_ok and str(row.get("size") or "standard").lower()=="standard")')
          if old_base not in a:
              raise SystemExit('Legacy source-row audit anchor not found')
          a=a.replace(old_base,new_base,1)
          audit.write_text(a,encoding='utf-8')
          print('PATCHED_RULES',len(rules),'PATCHED_GUIDES',len(guides),'FOSSIL_SOURCE_FOIL_GATE','galaxy')
          PY
      - name: Production JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          marker=s.index('VERIFIED_LEGACY_CHECKLIST_PRODUCTS')
          script_open=s.rfind('<script',0,marker)
          if script_open<0: raise SystemExit('Production script opening tag not found')
          body_start=s.index('>',script_open)+1
          body_end=s.index('</script>',marker)
          Path('/tmp/cardoryx.js').write_text(s[body_start:body_end])
          PY
          node --check /tmp/cardoryx.js
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Assert expected audit delta
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/card_identity_cardmarket_audit_report.json'))
          s=d.get('classificationTotals') or {}
          print('SUMMARY',json.dumps(s,sort_keys=True))
          expected={'SAFE':1853,'EXACT_ALTERNATE_PRODUCT':162,'P0_WRONG_PRODUCT':0,'P1_AMBIGUOUS_PRODUCT':182,'SOURCE_CONFLICT':7,'UNMAPPED_EXACT_PRODUCT':0}
          for k,v in expected.items():
              got=s.get(k)
              if got!=v: raise SystemExit(f'{k}: expected {v}, got {got}')
          p1=set(d.get('p1AmbiguousProductIds') or [])
          residual=sorted(x for x in p1 if x.startswith('base3-'))
          if residual: raise SystemExit(f'Fossil identities still P1: {residual}')
          print('FOSSIL_RESIDUAL_P1',0)
          PY
      - name: Verify scope and diff
        run: |
          git diff --check
          git status --short
          git diff --stat
      - name: Remove temporary workflow and commit verified fix
        run: |
          rm .github/workflows/temp-base3-fossil-cardmarket.yml
          git config user.name "26ale93-lab"
          git config user.email "26ale93@gmail.com"
          git add index.html scripts/test_card_identity_cardmarket_audit.py .github/workflows/temp-base3-fossil-cardmarket.yml
          git diff --cached --check
          git diff --cached --name-only
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'index.html','scripts/test_card_identity_cardmarket_audit.py'}
          if changed!=expected:
              raise SystemExit(f'Unexpected staged files: {sorted(changed)}')
          PY
          git commit -m "Resolve exact Fossil Cardmarket checklist products"
          git push origin HEAD:fix/base3-fossil-cardmarket-products-20260918
