name: TEMP base2 Jungle exact page mapping
on:
  push:
    branches: [diagnostic/base2-jungle-p1-20260918]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Jungle numbered pages
        run: |
          python3 - <<'PY'
          import urllib.request
          headers={'User-Agent':'Mozilla/5.0 Cardoryx-Identity-Audit/2.0'}
          pairs=[
            ('clefable',1,17,273798,273814,[275572]),
            ('electrode',2,18,273799,273815,[]),
            ('flareon',3,19,273800,273816,[]),
            ('jolteon',4,20,273801,273817,[]),
            ('kangaskhan',5,21,273802,273818,[]),
            ('mr-mime',6,22,273803,273819,[]),
            ('nidoqueen',7,23,273804,273820,[]),
            ('pidgeot',8,24,273805,273821,[]),
            ('pinsir',9,25,273806,273822,[]),
            ('scyther',10,26,273807,273823,[]),
            ('snorlax',11,27,273808,273824,[]),
            ('vaporeon',12,28,273809,273825,[]),
            ('venomoth',13,29,273810,273826,[]),
            ('victreebel',14,30,273811,273827,[]),
            ('vileplume',15,31,273812,273828,[]),
            ('wigglytuff',16,32,273813,273829,[]),
          ]
          bad=[]
          for slug,holo,normal,hpid,npid,extras in pairs:
              for num,expected in ((holo,hpid),(normal,npid)):
                  cands=tuple([hpid,npid]+extras)
                  urls=[f'https://www.tcggo.com/pokemon/jungle/{slug}-{num}',f'https://www.tcggo.com/pokemon/jungle/{slug}-{num}-1']
                  ok=False; seen=[]
                  for u in urls:
                      try:
                          with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=30) as r:t=r.read().decode('utf-8','ignore')
                          hits=[p for p in cands if str(p) in t]
                          print('PAGE',u,'EXPECTED',expected,'HITS',hits)
                          seen.append((u,hits))
                          if expected in hits and len(hits)==1: ok=True; break
                      except Exception as e:
                          print('PAGE_ERROR',u,repr(e))
                  print('MAP',slug,num,'EXPECTED',expected,'OK' if ok else 'BAD')
                  if not ok:bad.append((slug,num,expected,seen))
          print('BAD_COUNT',len(bad))
          if bad:print('BAD',bad)
          PY
