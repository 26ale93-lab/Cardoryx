name: TEMP Verify Umbreon Reverse and iOS Select Contrast

on:
  push:
    branches:
      - fix/umbreon-reverse-ios-select-20260920

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cardoryx
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout TCGdex cards database
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Run full Variant & Finish audit
        run: |
          python3 scripts/test_variant_finish_audit.py \
            --tcgdex-db tcgdex-cards-database \
            --output artifacts/variant_finish_audit_report.json
      - name: Enforce exact impact and UI rule
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=Path("index.html").read_text()
          r=json.loads(Path("artifacts/variant_finish_audit_report.json").read_text())
          c=r["summary"]["classifications"]
          rev=r["verifiedReverseFinishAudit"]
          assert r["summary"]["totalIdentitiesTested"] == 4254, r["summary"]
          assert c["CORRETTA"] == 3944, c
          assert c["AMBIGUA"] == 302, c
          assert c["FALSO POSITIVO"] == 0, c
          assert c["FALSO NEGATIVO"] == 0, c
          assert c["SOURCE CONFLICT"] == 8, c
          assert r["summary"]["pricingP0"] == 0, r["summary"]
          assert "sv08.5-059" in rev["integratedIds"], rev
          assert rev["expectedIdentities"] == 6, rev
          assert "#scanView select{color-scheme:light;background:#fff;color:#111827}" in source
          print(json.dumps({"summary":r["summary"],"reverse":rev},ensure_ascii=False,indent=2))
          PY
