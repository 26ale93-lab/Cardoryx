name: Temporary Cardmarket P1 Cluster Audit

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-cluster-audit-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Run full Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Group current P1 cases by set
        run: python -B scripts/temp_cardmarket_p1_cluster_audit.py
      - name: Run isolated EX Sandstorm identity audit
        run: python -B scripts/temp_ex2_cardmarket_identity_audit.py "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Probe EX Sandstorm live pricing and current runtime
        run: python -B scripts/temp_ex2_runtime_probe.py "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Recalculate EX Sandstorm shared owners after verified conflicts
        run: python -B scripts/temp_ex2_shared_owner_audit.py "$RUNNER_TEMP/tcgdex-cards-database"
      - uses: actions/upload-artifact@v4
        with:
          name: cardmarket-p1-cluster-audit
          path: |
            artifacts/cardmarket_p1_cluster_audit_report.json
            artifacts/ex2_cardmarket_identity_audit_report.json
          if-no-files-found: error
