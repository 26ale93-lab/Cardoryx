name: TEMP Verify Celebrations Standard Holo Audit

on:
  push:
    branches:
      - audit/classify-celebrations-standard-holo-20260920

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cardoryx
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout TCGdex cards database
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          path: tcgdex-cards-database
          fetch-depth: 1
      - name: Run full Variant & Finish audit
        run: |
          python3 scripts/test_variant_finish_audit.py \
            --tcgdex-db tcgdex-cards-database \
            --output artifacts/variant_finish_audit_report.json
      - name: Enforce exact six-card impact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/variant_finish_audit_report.json").read_text())
          c=r["summary"]["classifications"]
          x=r["celebrationsStandardHoloClassification"]
          assert r["summary"]["totalIdentitiesTested"] == 4254, r["summary"]
          assert c["CORRETTA"] == 3949, c
          assert c["AMBIGUA"] == 297, c
          assert c["FALSO POSITIVO"] == 0, c
          assert c["FALSO NEGATIVO"] == 0, c
          assert c["SOURCE CONFLICT"] == 8, c
          assert r["summary"]["pricingP0"] == 0, r["summary"]
          assert x["expectedIdentities"] == 6, x
          assert len(x["classifiedCorrectIds"]) == 6, x
          assert x["finish"] == "Holo" and x["stamp"] == "25th-celebration" and x["size"] == "standard", x
          assert x["productionModified"] is False, x
          print(json.dumps({"summary":r["summary"],"celebrations":x},ensure_ascii=False,indent=2))
          PY
