name: TEMP Neo Discovery implementation anchors
on:
  push:
    branches: [diagnostic/neo2-p1-20260917]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Gym implementation anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ('index.html','scripts/test_card_identity_cardmarket_audit.py'):
              t=Path(fn).read_text()
              print('FILE_BEGIN',fn)
              spans=[]
              for needle in ['gym1-15','274151','Gym Leader','GYM','shared finish','verifiedVariantPrice']:
                  pos=0
                  while True:
                      i=t.find(needle,pos)
                      if i<0: break
                      a=max(0,i-2500); b=min(len(t),i+5500)
                      if not any(a>=x and b<=y for x,y in spans):
                          spans.append((a,b))
                      pos=i+len(needle)
              for a,b in spans:
                  print('CONTEXT_RANGE',a,b)
                  print(t[a:b])
              print('FILE_END',fn)
          PY
