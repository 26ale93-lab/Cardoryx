name: Temporary Tyranitar Expedition 66 P0 Validation

on:
  push:
    branches:
      - fix/tyranitar-expedition-66-cardmarket-p0
    paths:
      - .github/workflows/temp-tyranitar-expedition66-p0.yml

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact Tyranitar patch in worktree
        run: python -B scripts/temp_patch_tyranitar_exp66.py

      - name: Compile and run focused runtime regression
        run: |
          python -B -m py_compile scripts/test_card_identity_cardmarket_audit.py
          rm -rf scripts/__pycache__
          python -B scripts/test_card_identity_cardmarket_audit.py --runtime-only

      - name: Run full identity audit
        run: |
          git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
          python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"

      - name: Verify scope and protected files
        run: |
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git diff --check
          git diff --exit-code HEAD -- data/retail_prices.json data/cardmarket_play_index.json sw.js manifest.webmanifest
          test "$(git diff --name-only HEAD | sort | tr '\n' ' ')" = "index.html scripts/test_card_identity_cardmarket_audit.py "

      - name: Commit validated production patch
        run: |
          git config user.name "26ale93-lab"
          git config user.email "26ale93@gmail.com"
          git add index.html scripts/test_card_identity_cardmarket_audit.py
          git commit -m "Fix Tyranitar Expedition 66 Cardmarket identity"
          git push origin HEAD:fix/tyranitar-expedition-66-cardmarket-p0
