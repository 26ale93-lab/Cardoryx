name: TEMP 30th anniversary fix

on:
  push:
    branches:
      - fix/30th-anniversary-auto-finish-stamp-20260917

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 scripts/temp_apply_30th_anniversary_fix.py
      - name: Test 30th Anniversary finish and stamp
        run: python3 scripts/test_30th_anniversary_finish_stamp.py
      - name: Existing Cardmarket runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Final diff check
        run: git diff --check
      - name: Commit verified production change
        shell: bash
        run: |
          git rm .github/workflows/temp-30th-anniversary-fix.yml scripts/temp_apply_30th_anniversary_fix.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html scripts/test_30th_anniversary_finish_stamp.py
          git commit -m "Fix 30th anniversary automatic finish and stamp"
          git push origin HEAD:fix/30th-anniversary-auto-finish-stamp-20260917
