name: Temporary deck stamp identity test

on:
  push:
    branches:
      - fix/deck-stamp-identity-collision
    paths:
      - index.html
      - scripts/test_deck_stamp_identity.py
      - .github/workflows/tmp-deck-stamp-identity-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deck stamp identity regression
        run: python scripts/test_deck_stamp_identity.py
