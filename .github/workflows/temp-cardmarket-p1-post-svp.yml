name: Temporary Cardmarket P1 Post SVP

on:
  push:
    branches:
      - diagnostic/cardmarket-p1-post-svp-20260916

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone pinned TCGdex source
        run: git clone --depth 1 https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Run full Cardmarket identity audit
        run: python -B scripts/test_card_identity_cardmarket_audit.py --tcgdex-db "$RUNNER_TEMP/tcgdex-cards-database"
      - name: Build P1 cluster report
        run: python -B scripts/temp_cardmarket_p1_cluster_audit.py
      - name: Assert safe diagnostic state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/cardmarket_p1_cluster_audit_report.json').read_text())
          assert r['sourceClassificationTotals']['P0_WRONG_PRODUCT']==0, r
          assert r['uniqueP1Found']==440, r
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Commit diagnostic report only
        run: |
          git checkout -- artifacts/card_identity_cardmarket_audit_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/cardmarket_p1_cluster_audit_report.json
          git commit -m "Report post-SVP Cardmarket P1 clusters"
          git push
