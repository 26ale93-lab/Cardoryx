name: TEMP Ascended Heroes Finish Diagnostic
on:
  push:
    branches: [fix/ascended-heroes-parallels-20260925]
    paths:
      - index.html
      - scripts/test_ascended_heroes_finish_diagnostic.py
      - scripts/test_variant_finish_audit.py
      - .github/workflows/temp-ascended-heroes-finish-diagnostic.yml
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ascended Heroes exact parallel audit
        run: python scripts/test_ascended_heroes_finish_diagnostic.py
      - name: Scanner single-finish regression
        run: python scripts/test_scanner_single_finish_autoselect.py
      - name: 30th anniversary finish regression
        run: python scripts/test_30th_anniversary_finish_stamp.py
      - name: Mega Evolution Energy finish regression
        run: python scripts/test_mee_001_008_exact_finishes.py
      - name: Verify valuation data untouched
        run: |
          test -z "$(git diff --name-only origin/main...HEAD -- data/cardmarket_play_index.json data/retail_prices.json)"

  compare-full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full finish audit on current main
        id: main_audit
        continue-on-error: true
        run: |
          git checkout --detach origin/main
          python scripts/test_variant_finish_audit.py > /tmp/main-audit.log 2>&1
      - name: Save main tail
        if: always()
        run: tail -120 /tmp/main-audit.log || true
      - name: Run full finish audit on branch
        id: branch_audit
        continue-on-error: true
        run: |
          git checkout --detach "$GITHUB_SHA"
          python scripts/test_variant_finish_audit.py > /tmp/branch-audit.log 2>&1
      - name: Save branch tail
        if: always()
        run: tail -120 /tmp/branch-audit.log || true
      - name: Compare audit outcomes
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          def tail(path):
              p=Path(path)
              return p.read_text(errors='replace')[-12000:] if p.exists() else ''
          main=tail('/tmp/main-audit.log')
          branch=tail('/tmp/branch-audit.log')
          needles=['Verified Normal target missing from the audited dataset: me04-013','HTTP Error 503','HTTP 503']
          same_external=any(n in main and n in branch for n in needles)
          print('same_external_blocker=',same_external)
          if same_external:
              print('PASS: main and branch are blocked by the same live TCGdex condition.')
              raise SystemExit(0)
          # If both full audits completed successfully, they are comparable.
          main_ok='"CORRETTA"' in main and '"pricingP0": 0' in main
          branch_ok='"CORRETTA"' in branch and '"pricingP0": 0' in branch
          if main_ok and branch_ok:
              print('PASS: both full audits completed.')
              raise SystemExit(0)
          print('FAIL: outcomes differ or blocker is not shared.')
          raise SystemExit(1)
          PY
