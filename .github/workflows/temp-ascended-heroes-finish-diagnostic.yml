name: TEMP Ascended Heroes Finish Diagnostic
on:
  push:
    branches: [fix/ascended-heroes-parallels-20260925]
    paths:
      - index.html
      - scripts/test_ascended_heroes_finish_diagnostic.py
      - .github/workflows/temp-ascended-heroes-finish-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ascended Heroes exact parallel audit
        run: python scripts/test_ascended_heroes_finish_diagnostic.py
      - name: Scanner single-finish regression
        run: python scripts/test_scanner_single_finish_autoselect.py
      - name: 30th anniversary finish regression
        run: python scripts/test_30th_anniversary_finish_stamp.py
      - name: Mega Evolution Energy finish regression
        run: python scripts/test_mee_001_008_exact_finishes.py
      - name: Compare full finish audit with current main
        shell: bash
        run: |
          set +e
          python scripts/test_variant_finish_audit.py > /tmp/branch-audit.log 2>&1
          branch_rc=$?
          git worktree add --detach /tmp/cardoryx-main origin/main
          (
            cd /tmp/cardoryx-main
            python scripts/test_variant_finish_audit.py > /tmp/main-audit.log 2>&1
          )
          main_rc=$?
          set -e
          echo "BRANCH_RC=$branch_rc"
          tail -n 12 /tmp/branch-audit.log
          echo "MAIN_RC=$main_rc"
          tail -n 12 /tmp/main-audit.log
          if [ "$branch_rc" -eq 0 ] && [ "$main_rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$branch_rc" -ne 0 ] && [ "$main_rc" -ne 0 ] &&
             grep -q "Verified Normal target missing from the audited dataset: me04-013" /tmp/branch-audit.log &&
             grep -q "Verified Normal target missing from the audited dataset: me04-013" /tmp/main-audit.log; then
            echo "External/live dataset parity confirmed: both current main and branch stop on me04-013."
            exit 0
          fi
          echo "Branch/main full-audit behavior differs."
          exit 1
      - name: Verify valuation data untouched
        run: |
          test -z "$(git diff --name-only origin/main...HEAD -- data/cardmarket_play_index.json data/retail_prices.json)"
