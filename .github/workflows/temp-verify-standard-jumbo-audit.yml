name: TEMP apply live Standard Jumbo audit gate

on:
  push:
    branches:
      - fix/cardmarket-exact-standard-jumbo-audit-20260917

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch exact Standard Jumbo gate to live rows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_card_identity_cardmarket_audit.py')
          s=p.read_text()
          old='''            expected_stamp = sorted(rule.get("stamp") or [])\n            standard_rows = [v for v in details.get(rule["standard"], [])\n                             if str(v.get("size") or "standard").lower() == "standard" and\n                             sorted(v.get("stamp") or []) == expected_stamp]\n            jumbo_rows = [v for v in details.get(rule["jumbo"], [])\n                          if str(v.get("size") or "").lower() == "jumbo" and\n                          sorted(v.get("stamp") or []) == expected_stamp]\n            rows_ok = bool(len(standard_rows) == 1 and len(jumbo_rows) == 1 and\n                           standard_rows[0].get("finish") == jumbo_rows[0].get("finish"))\n'''
          new='''            expected_stamp = sorted(rule.get("stamp") or [])\n            def exact_live_size_rows(expected_pid, expected_size):\n                matched = []\n                for row in live_card_detail.get("variants_detailed") or []:\n                    if cm_id(row) != expected_pid:\n                        continue\n                    if str(row.get("size") or ("standard" if expected_size == "standard" else "")).strip().lower() != expected_size:\n                        continue\n                    stamps = row.get("stamp") or []\n                    if isinstance(stamps, str):\n                        stamps = [stamps]\n                    if sorted(map(str, stamps)) != expected_stamp:\n                        continue\n                    pricing_cm = ((row.get("pricing") or {}).get("cardmarket") or {})\n                    try:\n                        pricing_pid = int(pricing_cm.get("idProduct") or pricing_cm.get("id_product"))\n                    except (TypeError, ValueError):\n                        pricing_pid = None\n                    usable = any(\n                        isinstance(pricing_cm.get(k), (int, float)) and pricing_cm.get(k) > 0\n                        for k in ("trend", "avg7", "avg30", "avg", "low")\n                    )\n                    if pricing_pid == expected_pid and usable:\n                        matched.append(row)\n                return matched\n\n            standard_rows = exact_live_size_rows(rule["standard"], "standard")\n            jumbo_rows = exact_live_size_rows(rule["jumbo"], "jumbo")\n            rows_ok = bool(len(standard_rows) == 1 and len(jumbo_rows) == 1 and\n                           standard_rows[0].get("type") == jumbo_rows[0].get("type"))\n'''
          if old not in s: raise SystemExit('Standard/Jumbo row gate anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit audit-only change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-verify-standard-jumbo-audit.yml
          git add scripts/test_card_identity_cardmarket_audit.py
          git commit -m 'Verify Standard Jumbo pairs from exact live rows'
          git push origin HEAD:fix/cardmarket-exact-standard-jumbo-audit-20260917
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Runtime regression
        run: python3 scripts/test_card_identity_cardmarket_audit.py --runtime-only
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Assert exact delta and clean scope
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          c=r['classificationTotals']
          expected={'SAFE':1770,'EXACT_ALTERNATE_PRODUCT':156,'P0_WRONG_PRODUCT':0,'P1_AMBIGUOUS_PRODUCT':271,'SOURCE_CONFLICT':7,'UNMAPPED_EXACT_PRODUCT':0}
          if c != expected: raise SystemExit(f'unexpected totals {c} != {expected}')
          ids=['svp-067','swshp-SWSH055','swshp-SWSH132','swshp-SWSH133','swshp-SWSH134','swshp-SWSH136','swshp-SWSH137','swshp-SWSH138']
          idx={x['tcgdexId']:x for x in r['caseIndex']}
          bad={i:idx.get(i) for i in ids if idx.get(i,{}).get('classification')!='SAFE'}
          if bad: raise SystemExit(f'pair classifications failed: {bad}')
          print(json.dumps({'totals':c,'verifiedStandardJumboIds':ids},indent=2))
          PY
          git diff --check
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
