name: TEMP inspect exact Standard Jumbo audit

on:
  push:
    branches:
      - fix/cardmarket-exact-standard-jumbo-audit-20260917

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Print target evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          ids=['svp-067','swshp-SWSH055','swshp-SWSH132','swshp-SWSH133','swshp-SWSH134','swshp-SWSH136','swshp-SWSH137','swshp-SWSH138']
          cases={x['tcgdexId']:x for x in r.get('p1WrongProduct',[]) + r.get('sourceConflicts',[]) + r.get('unmappedExactProduct',[])}
          # Full case bodies are not indexed separately, so scan top-level recursively.
          def walk(x):
              if isinstance(x,dict):
                  if x.get('tcgdexId') in ids and 'classification' in x and 'allProductIds' in x:
                      cases[x['tcgdexId']]=x
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(r)
          for i in ids:
              c=cases.get(i)
              if not c:
                  print('MISSING',i); continue
              out={k:c.get(k) for k in ['tcgdexId','name','setId','localId','currentProductId','allProductIds','classification','verifiedStandardJumboPair','verifiedStandardJumboProducts','physicalVariantsByProductId','cardmarketProductCatalog','realPriceGuideValues','reason']}
              print('TARGET',json.dumps(out,ensure_ascii=False,sort_keys=True))
          print('TOTALS',json.dumps(r['classificationTotals'],sort_keys=True))
          PY
          git diff --check
