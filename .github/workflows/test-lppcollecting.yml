name: Test LPPCollecting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lppcollecting:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run LPPCollecting HTTP diagnostic
        run: python scripts/test_lppcollecting.py

      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("lppcollecting_test_report.json")
          if not path.exists():
              raise SystemExit("Report non creato")

          data = json.loads(path.read_text(encoding="utf-8"))

          assert data.get("source") == "LPPCollecting"
          assert data.get("mode") == "read-only diagnostic"

          rules = data.get("rules", {})
          assert rules.get("cardmarketTouched") is False
          assert rules.get("retailPricesModified") is False

          print("Validazione OK")
          PY

      - name: Upload diagnostic files
        uses: actions/upload-artifact@v4
        with:
          name: lppcollecting-http-diagnostic
          path: |
            lppcollecting_test_report.json
            lppcollecting_response_snippet.txt
          if-no-files-found: error
