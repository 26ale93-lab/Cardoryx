name: TEMP residual P1 batch 8 diagnostic
on:
  push:
    branches: [diagnostic/cardmarket-p1-residual-batch8-20260917]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Run full Cardmarket audit
        run: python3 scripts/test_card_identity_cardmarket_audit.py --tcgdex-db ../tcgdex-cards-database
      - name: Summarize residual P1
        run: |
          python3 - <<'PY'
          import json, collections
          from pathlib import Path
          d=json.loads(Path('artifacts/card_identity_cardmarket_audit_report.json').read_text())
          ids=list(d.get('p1AmbiguousProductIds') or [])
          print('P1_COUNT',len(ids))
          by=collections.Counter(x.split('-',1)[0] for x in ids)
          print('P1_BY_SET',json.dumps(by.most_common(),ensure_ascii=False))
          blocked={'base1','base2','base3','base4','base5','gym1','gym2','neo1','neo2','neo3','neo4','ecard1','ecard2','ecard3','pl3','mfb'}
          small=[x for x in ids if x.split('-',1)[0] not in blocked]
          print('NONBLOCKED_COUNT',len(small))
          print('NONBLOCKED_IDS',json.dumps(small,ensure_ascii=False))
          PY
