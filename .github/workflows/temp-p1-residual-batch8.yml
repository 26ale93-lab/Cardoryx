name: TEMP residual P1 batch 8 diagnostic
on:
  push:
    branches: [diagnostic/cardmarket-p1-residual-batch8-20260917]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect all Worlds identities live
        run: |
          python3 - <<'PY'
          import json, urllib.request
          ids=['swshp-SWSH296','svp-045','svp-150','svp-190','sv03-196']
          for cid in ids:
              try:
                  with urllib.request.urlopen('https://api.tcgdex.net/v2/en/cards/'+cid,timeout=60) as r:
                      c=json.load(r)
              except Exception as e:
                  print('CARD',cid,'ERROR',repr(e)); continue
              top=((c.get('pricing') or {}).get('cardmarket') or {})
              rows=[]
              for x in c.get('variants_detailed') or []:
                  stamps=x.get('stamp') or []
                  if isinstance(stamps,str): stamps=[stamps]
                  if not any(str(v).startswith('worlds-') for v in stamps): continue
                  cm=((x.get('pricing') or {}).get('cardmarket') or {})
                  rows.append({'type':x.get('type'),'foil':x.get('foil'),'stamp':stamps,'size':x.get('size'),'pid':((x.get('thirdParty') or {}).get('cardmarket')),'ppid':cm.get('idProduct') or cm.get('id_product'),'trend':cm.get('trend'),'avg7':cm.get('avg7'),'low':cm.get('low')})
              print('CARD',json.dumps({'id':cid,'name':c.get('name'),'set':(c.get('set') or {}).get('id'),'localId':c.get('localId'),'topProduct':top.get('idProduct') or top.get('id_product'),'topTrend':top.get('trend'),'worldRows':rows},ensure_ascii=False,sort_keys=True))
          PY
