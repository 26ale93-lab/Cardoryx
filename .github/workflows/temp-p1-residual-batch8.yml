name: TEMP residual P1 batch 8 diagnostic
on:
  push:
    branches: [diagnostic/cardmarket-p1-residual-batch8-20260917]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone TCGdex database
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git ../tcgdex-cards-database
      - name: Locate all Worlds stamp source rows
        run: |
          cd ../tcgdex-cards-database
          echo '=== WORLDS 2022 ==='
          grep -RIl -- 'worlds-2022' data | sort
          echo '=== WORLDS 2023 ==='
          grep -RIl -- 'worlds-2023' data | sort
          echo '=== WORLDS 2024 ==='
          grep -RIl -- 'worlds-2024' data | sort
          echo '=== COUNTS ==='
          printf '2022 '; grep -RIl -- 'worlds-2022' data | wc -l
          printf '2023 '; grep -RIl -- 'worlds-2023' data | wc -l
          printf '2024 '; grep -RIl -- 'worlds-2024' data | wc -l
