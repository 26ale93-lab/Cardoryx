name: TEMP residual P1 batch 8 diagnostic
on:
  push:
    branches: [diagnostic/cardmarket-p1-residual-batch8-20260917]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect stamp UI and resolver neighborhoods
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          needles=['id="stamp"','id="editStamp"','function tcgdexExactSvpStampPrice','function verifiedExactSpecialStampPrice','function verifiedStampPrice']
          for n in needles:
              print('\n###',n)
              hits=[i for i,x in enumerate(s) if n in x]
              for i in hits[:3]:
                  for j in range(max(0,i-8),min(len(s),i+90)):
                      print(f'{j+1}:{s[j]}')
          PY
