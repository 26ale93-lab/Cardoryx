name: TEMP External Market Multi-Set Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/external-market-multiset-20260927
    paths:
      - scripts/test_external_market_multiset_audit.py
      - .github/workflows/temp-external-market-multiset-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify protected valuation files before
        run: |
          sha256sum data/cardmarket_play_index.json > /tmp/cardmarket.before
          sha256sum data/retail_prices.json > /tmp/retail.before

      - name: Require source API keys
        env:
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
          PKMNPRICES_API_KEY: ${{ secrets.PKMNPRICES_API_KEY }}
          POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
          PKMNPRICES_SKIP_ON_QUOTA: "1"
        run: |
          test -n "$JUSTTCG_API_KEY"
          test -n "$PKMNPRICES_API_KEY"
          test -n "$POKEMONPRICETRACKER_API_KEY"

      - name: Run multi-set source audit
        env:
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
          PKMNPRICES_API_KEY: ${{ secrets.PKMNPRICES_API_KEY }}
          POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
          PKMNPRICES_SKIP_ON_QUOTA: "1"
          POKEMONPRICETRACKER_SKIP_ON_QUOTA: "1"
        run: |
          set -o pipefail
          python scripts/test_external_market_multiset_audit.py | tee /tmp/external_market_multiset_audit.json

      - name: Verify protected valuation files unchanged
        if: always()
        run: |
          sha256sum data/cardmarket_play_index.json > /tmp/cardmarket.after
          sha256sum data/retail_prices.json > /tmp/retail.after
          cmp /tmp/cardmarket.before /tmp/cardmarket.after
          cmp /tmp/retail.before /tmp/retail.after

      - name: Upload report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: external-market-multiset-audit
          path: /tmp/external_market_multiset_audit.json
          retention-days: 7
